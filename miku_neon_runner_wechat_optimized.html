  function buySkin(i) {
    var SK = SKINS[i];
    if (!SK) return;
    if (G.owned[i]) {
      if (G.skin !== i) { G.skin = i; saveProfile(); Sfx.move(); }
      return;
    }
    if (G.wallet >= SK.price) {
      G.wallet -= SK.price;
      G.owned[i] = true;
      checkAchv();
      G.skin = i;
      saveProfile();
      Sfx.shieldGet();
      G.shopMsg = '解锁成功！已换上 ' + SK.name;
      G.shopMsgT = 2.2;
    } else {
      Sfx.hit();
      G.shopMsg = '金币不足，还差 ' + (SK.price - G.wallet) + ' 枚';
      G.shopMsgT = 2;
    }
  }

  // ---------- 分享成绩卡 ----------
  function rr2(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // 卡片上的简化版角色（笑眯眯的初音）
  function drawShareChar(c, cx, cy, r, SK) {
    c.fillStyle = SK.hairM;
    c.beginPath(); c.ellipse(cx - r * 1.05, cy + r * 0.35, r * 0.30, r * 0.95, 0.25, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx + r * 1.05, cy + r * 0.35, r * 0.30, r * 0.95, -0.25, 0, TAU); c.fill();
    var hg = c.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r * 1.05);
    hg.addColorStop(0, SK.hairG);
    hg.addColorStop(0.6, SK.hair);
    hg.addColorStop(1, SK.hairD);
    c.fillStyle = hg;
    c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill();
    c.fillStyle = '#ffe6d8';
    c.beginPath(); c.ellipse(cx, cy + r * 0.16, r * 0.62, r * 0.64, 0, 0, TAU); c.fill();
    c.fillStyle = SK.hair;
    c.beginPath();
    c.moveTo(cx - r * 0.62, cy + r * 0.06);
    c.quadraticCurveTo(cx - r * 0.5, cy - r * 0.62, cx, cy - r * 0.62);
    c.quadraticCurveTo(cx + r * 0.5, cy - r * 0.62, cx + r * 0.62, cy + r * 0.06);
    c.quadraticCurveTo(cx + r * 0.3, cy - r * 0.18, cx, cy - r * 0.12);
    c.quadraticCurveTo(cx - r * 0.3, cy - r * 0.18, cx - r * 0.62, cy + r * 0.06);
    c.closePath();
    c.fill();
    // 笑眼
    c.strokeStyle = SK.hairD;
    c.lineWidth = Math.max(2, r * 0.06);
    c.lineCap = 'round';
    c.beginPath(); c.arc(cx - r * 0.26, cy + r * 0.24, r * 0.12, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.beginPath(); c.arc(cx + r * 0.26, cy + r * 0.24, r * 0.12, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.fillStyle = 'rgba(255,150,180,0.35)';
    c.beginPath(); c.ellipse(cx - r * 0.42, cy + r * 0.4, r * 0.1, r * 0.06, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx + r * 0.42, cy + r * 0.4, r * 0.1, r * 0.06, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(180,80,100,0.8)';
    c.lineWidth = Math.max(1.5, r * 0.045);
    c.beginPath(); c.arc(cx, cy + r * 0.44, r * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    c.strokeStyle = '#151a2c';
    c.lineWidth = Math.max(3, r * 0.13);
    c.beginPath(); c.arc(cx, cy, r * 0.92, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    c.fillStyle = '#151a2c';
    c.beginPath(); c.arc(cx - r * 0.88, cy + r * 0.06, r * 0.15, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + r * 0.88, cy + r * 0.06, r * 0.15, 0, TAU); c.fill();
    c.fillStyle = SK.accent;
    c.beginPath(); c.arc(cx - r * 0.88, cy + r * 0.06, r * 0.07, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + r * 0.88, cy + r * 0.06, r * 0.07, 0, TAU); c.fill();
    c.fillStyle = SK.hair;
    c.beginPath();
    c.moveTo(cx - r * 0.06, cy - r * 0.9);
    c.quadraticCurveTo(cx - r * 0.2, cy - r * 1.5, cx + r * 0.5, cy - r * 1.35);

    c.closePath();
    c.fill();
    // 肩膀与领带
    c.fillStyle = SK.shirt;

    c.moveTo(cx, cy + r * 1.08);

  // ---------- 渲染 ----------
  // 速度线：冲刺或高速时从画面边缘向内掠过的细线
  function drawSpeedLines() {
    var intense = G.skillT > 0 ? 1 : clamp((G.speed - 32) / 12, 0, 1) * 0.6;
    if (intense <= 0.02 || G.state !== 'playing') return;
    var n = G.q > 1 ? 16 : 9;
    var cx = W * 0.5, cy = H * 0.52;
    var r0 = Math.min(W, H) * 0.46;
    var TH = TH_now();
    ctx.save();
    ctx.lineCap = 'round';
    for (var i = 0; i < n; i++) {
      var seed = Math.floor(G.t * 60) + i * 37;
      var a = hash01(seed, 1, 2) * TAU;
      var len = (0.06 + hash01(seed, 3, 4) * 0.12) * Math.min(W, H) * (0.6 + intense);
      var r1 = r0 + len;
      ctx.strokeStyle = i % 3 === 0 ? TH.accent2 : TH.edge;
      ctx.globalAlpha = (0.05 + 0.12 * intense) * (0.5 + 0.5 * hash01(seed, 5, 6));
      ctx.lineWidth = 1 + 2 * hash01(seed, 7, 8);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 轻提示（任务完成 / 画质切换等）
  function drawToasts() {
    if (!G.toasts.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < G.toasts.length; i++) {
      var t = G.toasts[i];
      var a = clamp(t.t / 0.4, 0, 1) * clamp((t.max - t.t) / 0.25, 0, 1);
      if (a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.font = '700 ' + clamp(W * 0.013, 11, 15) + 'px ' + FONT;
      var y = H * 0.24 + i * clamp(W * 0.02, 18, 26);
      var tw = ctx.measureText(t.text).width + 26;
      ctx.fillStyle = 'rgba(8,14,24,0.62)';
      rr(W / 2 - tw / 2, y - 13, tw, 26, 13); ctx.fill();
      ctx.strokeStyle = 'rgba(120,230,220,0.35)';
      ctx.lineWidth = 1;
      rr(W / 2 - tw / 2, y - 13, tw, 26, 13); ctx.stroke();
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, W / 2, y + 1);
    }
    ctx.restore();
  }

  // 里程节点大横幅
  function drawMileBanner() {
    var b = G.mileBanner;
    var k = clamp(b.t / 1.9, 0, 1);
    var pop = 1 + 0.35 * Math.max(0, (b.t - 1.55) / 0.35);
    ctx.save();
    ctx.globalAlpha = clamp(k * 1.6, 0, 1) * 0.96;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var y = H * 0.30 - (1 - clamp(k * 1.6, 0, 1)) * 18;
    ctx.font = '900 ' + Math.round(clamp(W * 0.085, 34, 72) * pop) + 'px ' + FONT;
    ctx.fillStyle = '#ffd76a';
    ctx.shadowColor = 'rgba(255,190,80,0.8)';
    ctx.shadowBlur = 26;
    ctx.fillText(b.text, W / 2, y);
    ctx.font = '800 ' + Math.round(clamp(W * 0.024, 16, 26)) + 'px ' + FONT;
    ctx.fillStyle = '#9ffff6';
    ctx.shadowColor = 'rgba(80,240,230,0.7)';
    ctx.shadowBlur = 14;
    ctx.fillText(b.sub, W / 2, y + clamp(W * 0.075, 30, 60));
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#07060f';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (G.shake > 0.2) {
      ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);
    }
    // 相机侧倾：变道时整个视角轻微倾斜
    if (Math.abs(G.roll) > 0.001) {
      ctx.translate(CX, HORIZON + H * 0.10);
      ctx.rotate(G.roll);
      ctx.translate(-CX, -(HORIZON + H * 0.10));
    }

    // 远景：一次性烘焙好的天空 + 太阳 + 星星 + 天际线，每帧只做一次 drawImage
    bakeBackdrop();
    ctx.save();
    ctx.translate(-CAM_X * 9, 0);
    if (bgCache.cv) {
      ctx.drawImage(bgCache.cv, -BG_PAD, 0, W + BG_PAD * 2, HORIZON + 96);
    }
    drawStarTwinkle();
    ctx.restore();

    drawGround();
    drawRoad();
    drawPlayerShadow();
    drawWorld();
    if (!G.minimal) drawParticles();
    ctx.restore();

    // 主题天气薄雾：沙尘 / 浓雾会压住远处能见度
    var tfx = themeFX();
    if (tfx.veil > 0.01) {
      var vg = cachedGrad('veil|' + tfx.c + '|' + tfx.veil + '|' + W + '|' + H, function () {
        var g3 = ctx.createLinearGradient(0, HORIZON - 12, 0, H);
        g3.addColorStop(0, 'rgba(' + tfx.c + ',' + tfx.veil + ')');
        g3.addColorStop(0.4, 'rgba(' + tfx.c + ',' + (tfx.veil * 0.5) + ')');
        g3.addColorStop(1, 'rgba(' + tfx.c + ',' + (tfx.veil * 0.1) + ')');
        return g3;
      });
      ctx.fillStyle = vg;
      ctx.fillRect(0, HORIZON - 12, W, H - HORIZON + 12);
    }

    if (!G.minimal) drawWeather();
    drawSpeedLines();

    if (G.skillT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.12 + 0.08 * Math.sin(G.t * 22);
      ctx.strokeStyle = '#8ffff4'; ctx.lineWidth = 7;
      ctx.strokeRect(5, 5, W - 10, H - 10);
      ctx.restore();
    }

    if (G.flash > 0.01) {
      ctx.globalAlpha = clamp(G.flash, 0, 0.7);
      ctx.fillStyle = '#ff9ec4';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    drawVignette();
    drawHUD();

    if (G.mileBanner) drawMileBanner();

    if (G.state === 'menu') drawMenu();
    else if (G.state === 'dead') drawDead();
    else if (G.state === 'paused') drawPaused();
    if (G.state === 'dying' && G.reviveOffer) drawRevivePrompt();
    if (G.state === 'playing' && Tutorial.step > 0) drawTutorial();

    if (G.panel) {
      if (G.panel === 'shop') drawShop();
      else if (G.panel === 'missions') drawMissions();
      else if (G.panel === 'scores') drawScores();
      else if (G.panel === 'settings') drawSettings();
      else if (G.panel === 'guide') drawGuide();
    }

    // 轻提示永远画在最上层（例如金币不足时点复活按钮）
    drawToasts();
  }

  // ---------- 主循环 ----------
  // 页面切到后台时彻底停止动画帧，回到前台后只恢复一个循环。
  var rafId = null;
  var rafRunning = false;
  function frame(now) {
    if (document.hidden) {
      rafRunning = false;
      rafId = null;
      return;
    }
    var rawDt = (now - last) / 1000;
    last = now;
    if (!isFinite(rawDt) || rawDt < 0) rawDt = 0.016;
    var dt = Math.min(rawDt, lowPowerMode ? 0.033 : 0.04);

    // 金币旋转
    for (var i = 0; i < G.coinList.length; i++) G.coinList[i].spin += dt * 3.4;

    // 使用未截断的真实帧时间监测 FPS；先降特效，再逐步降低 DPR，恢复时反向进行。
    var fps = 1 / Math.max(rawDt, 0.001);
    G.fpsEma = G.fpsEma ? G.fpsEma * 0.94 + fps * 0.06 : fps;
    G.qCheckT += Math.min(rawDt, 0.25);
    if (G.qCheckT > 2.5) {
      G.qCheckT = 0;
      if (G.fpsEma < 46) {
        if (G.q > 1) {
          G.q = 1;
          bgCache.key = '';
          toast('帧率偏低，已关闭部分特效', '#ffb0c8');
        } else if (dprScale > 0.65) {
          dprScale = Math.max(0.65, Math.round((dprScale - 0.1) * 100) / 100);
          resize();
          toast('已自适应降低渲染分辨率 ' + Math.round(dprScale * 100) + '%', '#ffb0c8');
        }
      } else if (G.fpsEma > 57) {
        if (dprScale < 1) {
          dprScale = Math.min(1, Math.round((dprScale + 0.05) * 100) / 100);
          resize();
        } else if (G.q < 2 && !lowPowerMode && !G.minimal) {
          G.q = 2;
          bgCache.key = '';
          toast('特效已恢复', '#9ffff6');
        }
      }
    }

    // 命中定格：冻结世界几帧，只继续渲染
    if (G.hitStop > 0) {
      G.hitStop -= dt;
      render();
      rafId = requestAnimationFrame(frame);
      return;
    }

    update(dt);
    // 极简模式：逻辑照常跑，渲染降到 30fps
    if (G.minimal) {
      G.minT += dt;
      if (G.minT < 0.033 && G.state === 'playing') {
        rafId = requestAnimationFrame(frame);
        return;
      }
      G.minT = 0;
    }
    render();
    Music.update();

    rafId = requestAnimationFrame(frame);
  }

  function startLoop() {
    if (rafRunning || document.hidden) return;
    rafRunning = true;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(function () { readSafeArea(); resize(); }, 120); });

  resize();
  readSafeArea();

  // 演示模式：index.html?demo 跳过菜单直接开跑
  if (window.location.search.indexOf('demo') >= 0) {
    startGame();
    G.camZ = 60;
    G.nextSpawnZ = G.camZ + 110;
  }

  startLoop();
})();
</script>
</body>
</html>
