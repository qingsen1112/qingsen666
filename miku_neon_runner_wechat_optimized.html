  function resize() {

    canvas.height = Math.round(H * DPR);

    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    HORIZON = H * 0.42;
    CX = W * 0.5;
    FOCAL = Math.min(H * 1.24, W * 1.35);
    // 机位高度：角色脚底尽量靠下（约 87%），同时给底部冲刺按钮留空间

  function buildBackdrop() {
    skyline[0] = [];
    skyline[1] = [];
    var rnd2 = mulberry32(20240818);
    for (var layer = 0; layer < 2; layer++) {
      var x = -140;
      while (x < W + 160) {
        var bw = 26 + rnd2() * 78;
        var bh = (layer === 0 ? 0.07 : 0.05) * H + rnd2() * (layer === 0 ? 0.24 : 0.15) * H;
        skyline[layer].push({ x: x, w: bw, h: bh, seed: rnd2() });
        x += bw + 5 + rnd2() * 22;
      }
    }
    stars = [];
    var rnd3 = mulberry32(777);
    for (var i = 0; i < 110; i++) {
      stars.push({
        x: rnd3() * W,
        y: rnd3() * HORIZON * 0.92,
        r: 0.6 + rnd3() * 1.5,
        p: rnd3() * TAU,
        s: 0.6 + rnd3() * 1.6
      });
    }

    // 把太阳放在最高那层楼群的空隙里
    var bestGap = -1, bestX = W * 0.5;
    for (var gi = 0; gi < skyline[0].length - 1; gi++) {
      var gapStart = skyline[0][gi].x + skyline[0][gi].w;
      var gapEnd = skyline[0][gi + 1].x;
      var gap = gapEnd - gapStart;
      if (gap > bestGap) { bestGap = gap; bestX = (gapStart + gapEnd) * 0.5; }
    }
    sunCX = bestGap > H * 0.16 ? bestX : W * 0.5;
  }

  var Missions = {
    today: '',
    list: [],
    pool: [
      { id: 'dist', stat: 'dist', target: 800, reward: 40, text: '累计奔跑 800 米' },
      { id: 'coins', stat: 'coins', target: 60, reward: 50, text: '收集 60 枚金币' },
      { id: 'near', stat: 'near', target: 8, reward: 60, text: '完美闪避 8 次' },
      { id: 'runs', stat: 'runs', target: 3, reward: 30, text: '完成 3 局游戏' },
      { id: 'combo', stat: 'combo', target: 10, reward: 45, text: '单局达成 10 连击' },
      { id: 'score', stat: 'score', target: 1500, reward: 55, text: '单局得分达到 1500' }
    ],
    dayKey: function () {
      var d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    },
    ensure: function () {
      if (this.today === this.dayKey() && this.list.length) return;
      this.roll();
    },
    roll: function () {
      this.today = this.dayKey();
      var seed = 0;
      var k = this.today;
      for (var i = 0; i < k.length; i++) seed = (seed * 31 + k.charCodeAt(i)) | 0;
      var rnd2 = mulberry32(seed);
      var idx = this.pool.map(function (_, i) { return i; });
      var picked = [];
      while (picked.length < 3 && idx.length) {
        picked.push(idx.splice(Math.floor(rnd2() * idx.length), 1)[0]);
      }
      this.list = picked.map(function (pi) {
        var def = Missions.pool[pi];
        return { def: def, prog: 0, done: false, claimed: false };
      });
      this.save();
    },
    load: function () {
      try {
        var raw = localStorage.getItem('miku-neon-missions');
        if (!raw) return;
        var obj = JSON.parse(raw);
        if (obj && obj.date === this.dayKey() && Array.isArray(obj.list) && obj.list.length) {
          this.today = obj.date;
          this.list = obj.list.filter(function (m) { return m && m.def && typeof m.def.target === 'number'; })
            .map(function (m) { return { def: m.def, prog: m.prog | 0, done: !!m.done, claimed: !!m.claimed }; });
        }
      } catch (e) { /* 存档损坏则按当天重新 roll */ }
    },
    save: function () {
      try {
        localStorage.setItem('miku-neon-missions', JSON.stringify({
          date: this.today,
          list: this.list.map(function (m) { return { def: m.def, prog: m.prog, done: m.done, claimed: m.claimed }; })
        }));
      } catch (e) { /* ignore */ }
    },
    // 结算一局后累计进度；完成的任务自动发奖
    settle: function (run) {
      this.ensure();
      var self = this;
      var update = function (stat, v, singleRun) {
        if (!v) return;
        for (var i = 0; i < self.list.length; i++) {
          var m = self.list[i];
          if (m.done || m.def.stat !== stat) continue;
          // 距离、金币等跨局累计；单局连击与得分只保留历史最高值。
          m.prog = Math.min(m.def.target, singleRun ? Math.max(m.prog, v) : m.prog + v);
          if (m.prog >= m.def.target && !m.claimed) {
            m.done = true;
            m.claimed = true;
            G.wallet += m.def.reward;
            toast('任务完成「' + m.def.text + '」 +' + m.def.reward + ' 金币', '#ffd76a');
          }
        }
      };
      update('dist', Math.floor(run.dist), false);
      update('coins', run.coins, false);
      update('near', run.near, false);
      update('runs', 1, false);
      update('combo', run.maxCombo, true);
      update('score', run.score, true);
      this.save();
    },
    doneCount: function () {
      var n = 0;
      for (var i = 0; i < this.list.length; i++) if (this.list[i].done) n++;
      return n;
    }
  };

    } catch (e) { /* ignore */ }
  }

  function saveMissionSeen() {
    try {
      localStorage.setItem('miku-neon-miss-seen', JSON.stringify({
        date: Missions.dayKey(), n: G.missionSeenN | 0
      }));
    } catch (e) { /* ignore */ }
  }

  function openPanel(name) {
    G.panel = name;
    G.shop = name === 'shop';
    if (name === 'missions') { G.missionSeenN = Missions.doneCount(); saveMissionSeen(); }
    G.shopMsg = ''; G.shopMsgT = 0;
    Sfx.move();
  }

  function closePanel() {
    G.panel = '';
    G.shop = false;
    Sfx.move();
  }

  window.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (k === ' ' || k === 'spacebar' || k.indexOf('arrow') === 0) e.preventDefault();
    // 长按方向键只响应一次，避免连续变道或重复触发跳跃。
    if (e.repeat && ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'a', 'd', 'w', 's', ' '].indexOf(k) >= 0) return;

    if (G.panel) {
      if (k === 'escape' || k === 'enter' || k === ' ') closePanel();
      return;
    }

    if (G.state === 'menu') {
      if (k === ' ' || k === 'enter' || k === 'arrowup' || k === 'w') { startGame(); return; }
      if (k === 'd') { startGame('daily'); return; }
      return;
    }
    if (G.state === 'dead') {
      if (k === 'r') { restart(); return; }
      if (k === ' ' || k === 'enter' || k === 'arrowup' || k === 'w') { goMenu(); }
      return;
    }
    if (G.state === 'dying') {
      // 复活提示期间：空格/回车/R = 花金币复活，Esc = 放弃
      if (!G.reviveOffer) return;
      if (k === ' ' || k === 'enter' || k === 'r') { doRevive(); return; }
      if (k === 'escape') { G.reviveOffer = false; finalize(); return; }
      return;
    }
    if (G.state === 'paused' && k === 'r') { restart(); return; }
    if (G.state === 'paused' && (k === ' ' || k === 'enter')) { togglePause(); return; }
    if (k === 'p' || k === 'escape') { togglePause(); return; }
    if (k === 'm') { toggleMute(); return; }
    if (G.state !== 'playing') return;

    // E / Shift 触发霓虹冲刺；忽略系统自动重复，避免长按连续释放。
    if (k === 'e' || k === 'shift') {
      e.preventDefault();
      if (!e.repeat) activateSkill();
      return;
    }
    if (k === 'arrowleft' || k === 'a') moveLane(-1);
    else if (k === 'arrowright' || k === 'd') moveLane(1);
    else if (k === 'arrowup' || k === 'w' || k === ' ') jump();
    else if (k === 'arrowdown' || k === 's') slide();
  }, { passive: false });

  // 松开跳跃键：可变跳跃高度（提前松手 = 小跳）
  window.addEventListener('keyup', function (e) {
    var k = (e.key || '').toLowerCase();
    if (k === 'arrowup' || k === 'w' || k === ' ') G.jumpHeld = false;
  });

  // 窗口失焦自动暂停，避免回来时已经撞死
  window.addEventListener('blur', function () {
    if (G.state === 'playing') togglePause();
  });

  var pointer = { down: false, x: 0, y: 0, used: false, t: 0 };

  function canvasPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function inRect(p, r) {
    return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Sfx.init();
    Sfx.resume();
    Music.unlock();
    var p = canvasPos(e);
    G.jumpHeld = true; // 触屏起跳默认按满（完整跳跃高度）
    if (inRect(p, G.ui.mute)) { toggleMute(); return; }
    if (G.state === 'playing' && inRect(p, G.ui.pause)) { togglePause(); return; }
    if (G.state === 'playing' && Tutorial.step > 0 && G.ui.tutNext && inRect(p, G.ui.tutNext)) {
      Tutorial.next();
      return;
    }
    if (G.state === 'playing' && Tutorial.step > 0 && G.ui.tutSkip && inRect(p, G.ui.tutSkip)) {
      Tutorial.skip();
      return;
    }
    if (G.state === 'playing' && inRect(p, G.ui.skill)) { activateSkill(); return; }

    if (G.panel) {
      if (!inRect(p, G.ui.panelRect)) { closePanel(); return; }
      if (inRect(p, G.ui.closePanel)) { closePanel(); return; }
      if (G.panel === 'shop') {
        for (var ci2 = 0; ci2 < SKINS.length; ci2++) {
          if (inRect(p, G.ui['card' + ci2])) { buySkin(ci2); return; }
        }
      }
      if (G.panel === 'missions') {
        if (G.ui.mTab0 && inRect(p, G.ui.mTab0)) { G.mTab = 0; Sfx.move(); return; }
        if (G.ui.mTab1 && inRect(p, G.ui.mTab1)) { G.mTab = 1; Sfx.move(); return; }
        if (G.ui.achPrev && inRect(p, G.ui.achPrev)) {
          G.achvPage--;
          if (G.achvPage < 0) G.achvPage = Math.max(0, Math.ceil(ACHV.length / 8) - 1);
          Sfx.move();
          return;
        }
        if (G.ui.achNext && inRect(p, G.ui.achNext)) {
          G.achvPage++;
          if (G.achvPage >= Math.ceil(ACHV.length / 8)) G.achvPage = 0;
          Sfx.move();
          return;
        }
      }
      if (G.panel === 'scores') {
        if (G.ui.scTab0 && inRect(p, G.ui.scTab0)) { G.scoreTab = 0; Sfx.move(); return; }
        if (G.ui.scTab1 && inRect(p, G.ui.scTab1)) { G.scoreTab = 1; Sfx.move(); return; }
        if (G.ui.scoreMode0 && inRect(p, G.ui.scoreMode0)) { G.scoreMode = 0; Sfx.move(); return; }
        if (G.ui.scoreMode1 && inRect(p, G.ui.scoreMode1)) { G.scoreMode = 1; Sfx.move(); return; }
        for (var sdi = 0; sdi < 4; sdi++) {
          if (G.ui['scDiff' + sdi] && inRect(p, G.ui['scDiff' + sdi])) {
            G.scoreDiffTab = sdi;
            Sfx.move();
            return;
          }
        }
      }
      if (G.panel === 'settings') {
        var sk3 = ['bgm', 'sfx', 'vibe'];
        for (var si3 = 0; si3 < sk3.length; si3++) {
          if (G.ui['set_' + sk3[si3]] && inRect(p, G.ui['set_' + sk3[si3]])) {
            G.dragSlider = sk3[si3];
            setVolFromPointer(sk3[si3], p);
            return;
          }
        }
        if (G.ui.setMinimal && inRect(p, G.ui.setMinimal)) {
          G.minimal = !G.minimal;
          if (G.minimal) {
            G.q = 1;
            G.parts.length = 0;
            dprScale = Math.min(dprScale, 0.8);
            resize();
          }
          saveSettings();
          Sfx.move();
          return;
        }
        if (G.ui.setExport && inRect(p, G.ui.setExport)) { exportSaveCode(); return; }
        if (G.ui.setImport && inRect(p, G.ui.setImport)) { importSaveCode(); return; }
      }
      return;
    }

    if (G.state === 'menu') {
      if (inRect(p, G.ui.shopBtn)) { openPanel('shop'); return; }
      if (inRect(p, G.ui.missionBtn)) { openPanel('missions'); return; }
      if (inRect(p, G.ui.scoreBtn)) { openPanel('scores'); return; }
      if (inRect(p, G.ui.settingsBtn)) { openPanel('settings'); return; }
      if (inRect(p, G.ui.guideBtn)) { openPanel('guide'); return; }
      if (inRect(p, G.ui.dailyBtn)) { startGame('daily'); return; }
      for (var di3 = 0; di3 < DIFFS.length; di3++) {
        if (inRect(p, G.ui['diff' + di3])) { setDiff(di3); return; }
      }
      if (inRect(p, G.ui.themePrev)) { setTheme((G.selTheme + THEMES.length - 1) % THEMES.length); return; }
      if (inRect(p, G.ui.themeNext)) { setTheme((G.selTheme + 1) % THEMES.length); return; }
      for (var ti = 0; ti < THEMES.length; ti++) {
        if (inRect(p, G.ui['theme' + ti])) {
          setTheme(ti);
          return;
        }
      }
      startGame(); return;
    }
    if (G.state === 'dead') {
      if (G.deadT <= 0.55) return;
      if (inRect(p, G.ui.btnAgain)) { restart(); return; }
      if (inRect(p, G.ui.btnShare)) { shareCard(); return; }
      goMenu(); return;
    }
    if (G.state === 'dying') {
      // 复活提示：花金币复活 / 放弃
      if (!G.reviveOffer) return;
      if (inRect(p, G.ui.revivePay)) { doRevive(); return; }
      if (inRect(p, G.ui.reviveSkip)) { G.reviveOffer = false; finalize(); return; }
      return;
    }
    if (G.state === 'paused') {
      if (inRect(p, G.ui.pauseResume)) { togglePause(); return; }
      if (inRect(p, G.ui.pauseRestart)) { restart(); return; }
      if (inRect(p, G.ui.pauseHome)) { goMenu(); return; }
      if (inRect(p, G.ui.pauseMusic)) { Music.toggle(); return; }
      if (inRect(p, G.ui.pauseSfx)) { toggleSfxOnly(); return; }
      return; // 点击空白处不再误触继续
    }

    pointer.down = true; pointer.x = p.x; pointer.y = p.y; pointer.used = false; pointer.t = performance.now();
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 某些浏览器不支持 */ }
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', function (e) {
    if (G.dragSlider) {
      setVolFromPointer(G.dragSlider, canvasPos(e));
      return;
    }
    if (!pointer.down || pointer.used) return;
    var p = canvasPos(e);
    var dx = p.x - pointer.x, dy = p.y - pointer.y;
    if (Math.abs(dx) < 26 && Math.abs(dy) < 26) return;
    pointer.used = true;
    if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) jump();
    else slide();
  });

  canvas.addEventListener('pointerup', function (e) {
    if (G.dragSlider) {
      G.dragSlider = '';
      Sfx.move();
      return;
    }
    if (!pointer.down) return;
    var dur = performance.now() - pointer.t;
    // 轻点一下 = 冲刺（上滑仍然是跳跃）
    if (!pointer.used && dur < 260) activateSkill();
    pointer.down = false;
  });

  canvas.addEventListener('pointercancel', function () { pointer.down = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (G.state === 'playing') G.state = 'paused';
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
      rafRunning = false;
    } else {
      startLoop();
    }
  });

  // ---------- 粒子 ----------
  function burst(x, y, color, n, spd, size) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var s = rnd(spd * 0.25, spd);
      G.parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
        life: rnd(0.3, 0.75), max: 0.75, color: color, size: rnd(size * 0.6, size * 1.5), g: 420, drag: 1.6
      });
    }
    var partLimit = G.q > 1 ? (lowPowerMode ? 120 : 240) : 80;
    if (G.parts.length > partLimit) G.parts.splice(0, G.parts.length - partLimit);
  }

  function popup(x, y, text, color) {
    G.parts.push({
      x: x, y: y, vx: rnd(-14, 14), vy: -70, life: 0.85, max: 0.85,
      color: color || '#ffe08a', size: 18, text: text, g: 25, drag: 0.6
    });
    var partLimit = G.q > 1 ? (lowPowerMode ? 120 : 240) : 80;
    if (G.parts.length > partLimit) G.parts.splice(0, G.parts.length - partLimit);
  }

  // ---------- 关卡生成 ----------
  function laneFree(arr, lane) {
    for (var i = 0; i < arr.length; i++) if (arr[i].lane === lane) return false;
    return true;
  }

  function addObstacle(type, lane, worldZ) {
    var defs = {
      barrier: { w: 1.6, y0: 0.04, y1: 0.8, d: 0.55 },
      slider: { w: 1.6, y0: 0.05, y1: 0.8, d: 0.55 },
      beam: { w: 1.95, y0: 1.3, y1: 1.95, d: 0.5 },
      block: { w: 1.55, y0: 0, y1: 2.0, d: 0.9 },
      drone: { w: 1.74, y0: 1.76, y1: 2.0, d: 8.5 },
      ramp: { w: 2.0, y0: 0, y1: 2.0, d: 6 },
      launch: { w: 1.9, y0: 0, y1: 1.1, d: 4.5 },
      spike: { w: 1.55, y0: 0.02, y1: 0.55, d: 1.1 },
      pendulum: { w: 0.6, y0: 0.62, y1: 1.78, d: 1.0 },
      pillar: { w: 0.85, y0: 0, y1: 2.5, d: 0.85 },
      gate: { w: 1.9, y0: 1.12, y1: 2.3, d: 0.4 },
      // ---- 场景专属 ----
      dune: { w: 1.75, y0: 0.02, y1: 0.75, d: 1.7 },
      icicle: { w: 1.8, y0: 1.22, y1: 2.4, d: 0.7 },
      lantern: { w: 1.05, y0: 0, y1: 2.35, d: 1.0 },
      booth: { w: 1.35, y0: 0, y1: 2.35, d: 1.0 },
      fence: { w: 1.8, y0: 0.95, y1: 1.32, d: 0.4 }
    };
    var d = defs[type];
    var o = {
      type: type,
      lane: lane,
      x: LANE_X[lane],
      z: worldZ,
      w: d.w, y0: d.y0, y1: d.y1, d: d.d,
      hit: false
    };
    if (type === 'pendulum') {
      // 摆锤：吊在横梁上来回摆，只能靠时机或变道躲
      o.ph = levelRnd(0, TAU);
      o.sw = levelRnd(1.5, 2.3);
      o.amp = levelRnd(1.15, 1.5);
      o.headX = o.x;
    }
    if (type === 'slider') {
      // 左右平移的路障：跳跃躲开，注意时机
      o.ox = o.x;
      o.amp = levelRnd(0.9, 2.0);
      o.spd = levelRnd(0.8, 1.5);
      o.ph = levelRnd(0, TAU);
    }
    G.obs.push(o);
  }

  function addPower(kind, x, y, worldZ) {
    G.powerList.push({ kind: kind, x: x, y: y, z: worldZ, spin: Math.random() * TAU, taken: false });
  }

  // 无法通过的高障碍：旁边不放金币，避免把玩家往死路引
  var TALL_OBS = { pillar: 1, block: 1, lantern: 1, booth: 1, drone: 1 };
  function tallObsNear(worldZ, laneX, coinY) {
    for (var i = 0; i < G.obs.length; i++) {
      var o = G.obs[i];
      if (o.hit || !TALL_OBS[o.type]) continue;
      if (Math.abs(o.z - worldZ) > 4.5) continue;
      if (Math.abs(o.x - laneX) > 1.1) continue;
      // 只有金币低于障碍顶面时才拦（无人机平台上方的金币是能拿到的）
      if (coinY < o.y1 - 0.05) return true;
    }
    return false;
  }

  function addCoin(x, y, worldZ) {
    if (tallObsNear(worldZ, x, y)) return;
    G.coinList.push({ x: x, y: y, z: worldZ, spin: Math.random() * TAU, taken: false });
  }

  function addShield(x, y, worldZ) {
    G.shieldList.push({ x: x, y: y, z: worldZ, spin: Math.random() * TAU, taken: false });
  }

  function spawnCoins(lane, z0, count) {
    for (var i = 0; i < count; i++) {
      addCoin(LANE_X[lane], 0.85, z0 + i * 1.9);
    }
  }

  // 弹射坡后的金币：沿着抛物线铺开
  function spawnLaunchCoins(lane, z0, topY) {
    var v = 24 + 18 * clamp(z0 / 2400, 0, 1);
    for (var i = 0; i < 5; i++) {
      var t = 0.12 + i * 0.14;
      var y = topY + 13.5 * t - 17 * t * t + 0.25;
      if (y > 4.1) y = 4.1;
      addCoin(LANE_X[lane], y, z0 + v * t);
    }
  }

  // 跳跃金币：7 枚拱形排列，必须从正确的时机起跳才能全部吃到
  function spawnArcCoins(lane, centerZ, count) {
    var span = (count - 1) * 2.4;
    for (var i = 0; i < count; i++) {
      var u = count > 1 ? i / (count - 1) : 0.5;
      var y = 1.72 + Math.sin(u * Math.PI) * 1.08;
      addCoin(LANE_X[lane], y, centerZ + (u - 0.5) * span);
    }
  }

  function spawnGroup(worldZ, light) {
    var diff = clamp(G.camZ / 2200 * DF().ramp, 0, 1);
    var free = levelRndInt(3);
    var others = [0, 1, 2].filter(function (l) { return l !== free; });
    var roll = light ? 0.1 : levelRnd(0, 1); // light = 二连组的简化组，只放单个障碍保证公平
    var used = [];
    var barrierLane = -1, barrierZ = 0, barrierType = '';
    var droneAdded = false;

    // 场景专属障碍：只在对应主题出现
    var themeObs = { desert: 'dune', snow: 'icicle', tang: 'lantern', london: 'booth', neon: 'fence' }[TH_now().id];
    if (themeObs && !light && diff > 0.06 && levelRnd(0, 1) < 0.2) {
      var tl2 = levelRndInt(3);
      addObstacle(themeObs, tl2, worldZ);
      used.push(tl2);
      barrierLane = tl2; barrierZ = worldZ; barrierType = themeObs;
    } else if (roll < 0.2) {
      var l1 = levelRndInt(3);
      var r1 = levelRnd(0, 1);
      var t1 = 'barrier';
      if (!light && diff > 0.45 && r1 < 0.18) t1 = 'pillar';
      else if (diff > 0.2 && r1 < 0.5) t1 = 'spike';
      else if (!light && diff > 0.35 && r1 < 0.72) t1 = 'slider';
      addObstacle(t1, l1, worldZ);
      used.push(l1);
      barrierLane = l1; barrierZ = worldZ; barrierType = t1;
    } else if (roll < 0.38) {
      var l2 = levelRndInt(3);
      var r2 = levelRnd(0, 1);
      if (!light && diff > 0.22 && r2 < 0.34) addObstacle('pendulum', l2, worldZ);
      else if (r2 < 0.62) addObstacle('gate', l2, worldZ);
      else addObstacle('beam', l2, worldZ);
      used.push(l2);
    } else if (roll < 0.52) {
      var l3 = levelRndInt(3);
      addObstacle('block', l3, worldZ);
      used.push(l3);
    } else if (roll < 0.7) {
      var dl = levelRndInt(3);
      addObstacle('drone', dl, worldZ);
      addObstacle('ramp', dl, worldZ - 7.25);
      used.push(dl);
      droneAdded = true;
      for (var ci = 0; ci < 5; ci++) addCoin(LANE_X[dl], 2.32, worldZ - 3.2 + ci * 1.6);
    } else if (roll < 0.78) {
      var la = levelRndInt(3);
      addObstacle('launch', la, worldZ);
      used.push(la);
      spawnLaunchCoins(la, worldZ + 3.2, 1.1);
    } else if (roll < 0.87) {
      var a = others[0], b = others[1];
      addObstacle('barrier', a, worldZ);
      var other = levelRnd(0, 1) < 0.5 ? 'beam' : 'barrier';
      addObstacle(other, b, worldZ);
      used.push(a, b);
      barrierLane = a; barrierZ = worldZ;
      if (other === 'barrier') barrierLane = levelRnd(0, 1) < 0.5 ? a : b;
    } else if (roll < 0.90) {
      addObstacle('block', others[0], worldZ);
      addObstacle('block', others[1], worldZ);
      used.push(others[0], others[1]);
    } else {
      if (!light && diff > 0.45 && levelRnd(0, 1) < 0.35) addObstacle('slider', others[0], worldZ);
      else addObstacle('barrier', others[0], worldZ);
      used.push(others[0]);
      barrierLane = others[0]; barrierZ = worldZ;
      if (diff > 0.25) {
        addObstacle(levelRnd(0, 1) < 0.5 ? 'beam' : 'barrier', others[1], worldZ + 5.5);
        used.push(others[1]);
      }
    }

    if (G.shields < shieldCap() && levelRnd(0, 1) < 0.16) {
      var sz = worldZ + levelRnd(5, 9);
      var sLane = free;
      var clash = G.obs.some(function (o2) { return o2.lane === sLane && Math.abs(o2.z - sz) < 4; });
      if (!clash) addShield(LANE_X[sLane], 1.05, sz);
    }

    if (!light && G.camZ >= G.nextPowerZ) {
      G.nextPowerZ = G.camZ + levelRnd(340, 560);
      var pz = worldZ + levelRnd(14, 26);
      var pClash = G.obs.some(function (o3) { return o3.lane === free && Math.abs(o3.z - pz) < 5; });
      if (!pClash) addPower(levelRnd(0, 1) < 0.5 ? 'magnet' : 'wing', LANE_X[free], 1.05, pz);
    }

    var coinRoll = levelRnd(0, 1);
    var freeLanes = [0, 1, 2].filter(function (l) { return used.indexOf(l) < 0; });
    // 冰锥需要滑铲通过，其上方放弧形金币会与冰锥重叠，跳过该组合
    if (barrierLane >= 0 && barrierType !== 'icicle' && coinRoll < 0.17) {
      spawnArcCoins(barrierLane, barrierZ, 7);
    } else if (coinRoll < 0.27 && freeLanes.length) {
      spawnArcCoins(freeLanes[levelRndInt(freeLanes.length)], worldZ + levelRnd(2, 7), 7);
    } else if (coinRoll < 0.4 && freeLanes.length) {
      var lane = freeLanes[levelRndInt(freeLanes.length)];
      spawnCoins(lane, worldZ + levelRnd(-2.5, 3.5), 4);
    }
    return droneAdded;
  }

  // ---------- 生命周期 ----------
  function resetRun() {
    G.camZ = 0;
    G.speed = 24;
    G.score = 0;
    G.coins = 0;
    G.coinFrac = 0;
    G.playT = 0;
    G.nextSpawnZ = 90;
    G.obs.length = 0;
    G.coinList.length = 0;
    G.shieldList.length = 0;
    G.shields = 0;
    G.invuln = 0;
    G.parts.length = 0;
    G.shake = 0;
    G.flash = 0;
    G.deadT = 0;
    G.hitT = 0;
    G.combo = 0; G.comboT = 0; G.energy = 0; G.skillT = 0; G.nearMisses = 0;
    G.skillCount = 0;
    CAM_X = 0;
    // ---- 4.0 新增状态重置 ----
    G.runId = (G.runId || 0) + 1;
    G.hitStop = 0;
    G.coyote = 0; G.jumpBuf = 0; G.jumping = false; G.airJumps = 0;
    G.magnetT = 0; G.wingT = 0;
    G.powerList.length = 0;
    G.nextPowerZ = 240;
    G.roll = 0; G.rollT = 0;
    G.prevCamZ = 0;
    G.maxCombo = 0;
    G.nextMile = 500; G.mileCount = 0;
    G.mileBanner = null;
    G.toasts.length = 0;
    G.myRank = 0;
    // ---- 复活状态重置 ----
    G.reviveCount = 0;
    G.reviveWindow = 0;
    G.reviveOffer = false;
    G.settled = false;
    var P = G.player;
    P.x = 0; P.lane = 1; P.y = 0; P.vy = 0; P.onGround = true;
    P.slideT = 0; P.crouch = 0; P.phase = 0; P.dead = false; P.tumble = 0;
    // 每日挑战从同一个日期种子重新开始；普通模式继续使用系统随机。
    if (G.daily) {
      if (!G.dailyDate) G.dailyDate = localDayKey();
      G.rngFn = mulberry32(Daily.seed(G.dailyDate));
    } else {
      G.dailyDate = '';
      G.rngFn = null;
    }
  }

  function startGame(mode) {
    Sfx.init(); Sfx.resume();
    G.daily = mode === 'daily';
    if (G.daily) G.dailyDate = localDayKey();
    resetRun();
    Tutorial.start();
    G.theme = G.selTheme;
    Music.setTheme(G.theme);
    G.nextThemeAt = 900;
    G.themeT = 2.4;
    G.weather.length = 0;
    G.state = 'playing';
    Sfx.start();
    if (G.daily) toast('每日挑战：今天所有玩家的关卡序列相同', '#9ffff6');
  }

  function restart() {
    resetRun();
    G.theme = G.selTheme; // 快速重开时重置回选中主题
    Music.setTheme(G.theme);
    G.nextThemeAt = 900;
    G.state = 'playing';
    Sfx.start();
  }

  function goMenu() {
    resetRun();
    G.daily = false;
    G.dailyDate = '';
    G.rngFn = null;
    G.theme = G.selTheme;
    Music.setTheme(G.theme);
    G.weather.length = 0;
    G.state = 'menu';
  }

  function takeHit(o) {
    if (G.shields > 0) {
      G.shields--;
      G.invuln = 1.3;
      G.shake = 13;
      G.flash = 0.3;
      G.hitStop = Math.max(G.hitStop, 0.05);
      var hp2 = proj(o.x, Math.min(o.y1, 1.25), PLAYER_Z);
      burst(hp2.x, hp2.y, 'rgba(120,220,255,0.95)', 24, 400, 4);
      burst(hp2.x, hp2.y, 'rgba(255,255,255,0.9)', 10, 260, 3);
      popup(hp2.x, hp2.y - 12, '护盾抵挡', '#9fe8ff');
      Sfx.shieldBreak();
      vibe(35);
    } else {
      die();
    }
  }

  // 本局复活价格：第 1 次 100、第 2 次 200、第 3 次 500，用完就不能再复活
  var REVIVE_COSTS = [100, 200, 500];

  function reviveCost() {
    return G.reviveCount < REVIVE_COSTS.length ? REVIVE_COSTS[G.reviveCount] : 0;
  }

  function canRevive() {
    var c = reviveCost();
    return c > 0 && G.wallet >= c;
  }

  function die() {
    if (G.state !== 'playing') return;
    G.state = 'dying';
    G.hitT = 0;
    G.hitStop = 0.1; // 命中定格：冻结几帧再播放死亡动画
    G.shake = 18;
    G.flash = 0.75;
    var P = G.player;
    P.dead = true;
    P.vy = 6.5;
    P.onGround = false;
    // 还有复活次数就先弹复活提示（金币不够也弹，只是按钮不可用）
    if (G.reviveCount < REVIVE_COSTS.length) {
      G.reviveOffer = true;
      G.reviveWindow = 3.2;
    }
    var p = proj(P.x, 0.9, PLAYER_Z);
    burst(p.x, p.y, 'rgba(255,120,180,0.9)', 26, 420, 4);
    burst(p.x, p.y, 'rgba(120,245,235,0.9)', 18, 320, 3);
    Sfx.hit();
    vibe([30, 40, 80]);
  }

  // 复活：清掉前方障碍、给无敌时间，从当前分数继续
  function doRevive() {
    if (G.state !== 'dying' || !G.reviveOffer) return;
    var cost = reviveCost();
    if (!cost || G.wallet < cost) {
      toast('金币不足，还差 ' + Math.max(0, cost - G.wallet) + ' 枚', '#ff9ec4');
      return;
    }
    G.wallet -= cost;
    G.reviveCount++;
    saveProfile();
    var P = G.player;
    G.state = 'playing';
    G.reviveOffer = false;
    G.reviveWindow = 0;
    G.hitT = 0;
    P.dead = false;
    P.tumble = 0;
    P.y = 0; P.vy = 0; P.onGround = true;
    P.slideT = 0; P.crouch = 0;
    G.invuln = 2.5;
    G.combo = 0; G.comboT = 0;
    // 清掉前方一段距离内的障碍，留出重新起步的空间
    for (var i = G.obs.length - 1; i >= 0; i--) {
      var o = G.obs[i];
      var rel = o.z - G.camZ;
      if (rel > -6 && rel < 70) {
        var pp = proj(o.x, (o.y0 + o.y1) * 0.5, Math.max(rel, 3));
        burst(pp.x, pp.y, 'rgba(150,255,240,0.8)', 8, 200, 3);
        G.obs.splice(i, 1);
      }
    }
    if (G.nextSpawnZ < G.camZ + 90) G.nextSpawnZ = G.camZ + 90;
    G.shake = Math.max(G.shake, 6);
    G.flash = Math.max(G.flash, 0.25);
    var rp = proj(P.x, 1.2, PLAYER_Z);
    burst(rp.x, rp.y, 'rgba(120,255,235,0.95)', 26, 320, 4);
    popup(rp.x, rp.y - 30, '复活！ -' + cost + ' 金币', '#9ffff6');
    Sfx.start();
    vibe([15, 40, 15]);
  }

  function finalize() {
    // 复活过的局只会最终死亡时结算一次
    if (G.settled) { G.state = 'dead'; G.deadT = 0; return; }
    G.settled = true;
    // 拾取金币时已经把 +10 计入 G.score，结算时不再重复加分。
    var total = Math.max(0, Math.floor(G.score));
    G.wallet += G.coins;
    saveProfile();
    G.score = total;
    G.prevBest = G.best;
    var isNew = total > G.best;
    if (isNew) { G.best = total; saveBest(); }

    // 常规榜按难度记录；每日挑战按「日期 + 难度」独立记录。
    G.myRank = 0;
    if (G.daily) {
      G.myRank = Daily.record({
        rid: G.runId, s: total, c: G.coins, d: Math.floor(G.camZ), t: Date.now(),
        skin: G.skin, diff: G.diff, date: G.dailyDate
      });
    } else {
      G.scores.push({ rid: G.runId, s: total, c: G.coins, d: Math.floor(G.camZ), t: Date.now(), skin: G.skin, diff: G.diff });
      trimScores();
      saveScores();
      var myList = scoresOf(G.diff);
      for (var i = 0; i < myList.length; i++) {
        if (myList[i].rid === G.runId) { G.myRank = i + 1; break; }
      }
    }

    // 每日任务结算（完成的任务自动发放金币奖励）
    Missions.settle({ dist: G.camZ, coins: G.coins, near: G.nearMisses, maxCombo: G.maxCombo, score: total });
    Stats.add();
    checkAchv();
    saveProfile();

    G.state = 'dead';
    G.deadT = 0;
    if (isNew) vibe([15, 40, 15, 40, 60]);
  }

  // ---------- 更新 ----------
  var last = performance.now();

  function update(dt) {
    G.t += dt;
    var P = G.player;
    // 死亡慢镜头：世界以 40% 速度演进，UI 计时保持实时
    var sdt = G.state === 'dying' ? dt * 0.4 : dt;
    if (!G.minimal) updateWeather(sdt);

    if (G.state === 'menu') {
      G.camZ += 11 * sdt;
      P.phase += sdt * 9.5;
      P.crouch = lerp(P.crouch, 0, Math.min(1, dt * 8));
      G.speed = 11;
      CAM_X = lerp(CAM_X, P.x * CAM_FOLLOW, Math.min(1, dt * 6));
    } else if (G.state === 'dying') {
      G.hitT += dt;
      P.tumble += sdt * 3.4;
      P.y += P.vy * sdt;
      P.vy -= 26 * sdt;
      if (P.y < 0) { P.y = 0; P.vy = 0; }
      if (G.reviveOffer) {
        // 复活倒计时期间不结算，超时/放弃后再走死亡结算
        G.reviveWindow -= dt;
        if (G.reviveWindow <= 0) { G.reviveOffer = false; finalize(); }
      } else if (G.hitT > 0.85) {
        finalize();
      }
    } else if (G.state === 'dead') {
      G.deadT += dt;
      P.tumble = Math.min(P.tumble + dt * 0.6, 1.35);
    } else if (G.state === 'playing') {
      G.playT += dt;
      G.comboT = Math.max(0, G.comboT - dt);
      if (G.comboT <= 0) G.combo = 0;
      if (G.combo > G.maxCombo) G.maxCombo = G.combo;
      G.skillT = Math.max(0, G.skillT - dt);
      G.skillDeny = Math.max(0, G.skillDeny - dt);
      P.landT = Math.max(0, P.landT - dt);
      P.stretchT = Math.max(0, P.stretchT - dt);
      if (Tutorial.step > 0) {
        Tutorial.t += dt;
        if (Tutorial.t > 14) Tutorial.next();
      }
      G.magnetT = Math.max(0, G.magnetT - dt);
      G.wingT = Math.max(0, G.wingT - dt);
      G.speed = (24 + 18 * clamp(G.camZ / 2400, 0, 1)) * DF().speed;
      // 冲刺时实际前进速度提高 65%，并按实际距离计分；基础速度条仍显示常规速度成长。
      var travelSpeed = G.speed * (G.skillT > 0 ? 1.65 : 1);
      G.prevCamZ = G.camZ; // 扫掠碰撞：记录本帧起点
      G.camZ += travelSpeed * dt;
      G.score += travelSpeed * dt * 1.05;
      P.phase += dt * (6 + G.speed * 0.32);

      // 土狼时间 / 跳跃缓冲 / 可变跳跃高度
      G.coyote = P.onGround ? 0.1 : Math.max(0, G.coyote - dt);
      G.jumpBuf = Math.max(0, G.jumpBuf - dt);
      if (G.jumpBuf > 0 && (P.onGround || G.coyote > 0)) doJump(11.0);
      if (!G.jumpHeld && G.jumping && P.vy > 5.5) P.vy = 5.5;

      // 相机侧倾：变道后缓慢回正
      G.roll = lerp(G.roll, G.rollT, Math.min(1, dt * 6));
      G.rollT = lerp(G.rollT, 0, Math.min(1, dt * 2.2));

      // 移动路障
      for (var si3 = 0; si3 < G.obs.length; si3++) {
        var so = G.obs[si3];
        if (so.type === 'slider') so.x = clamp(so.ox + Math.sin(G.t * so.spd + so.ph) * so.amp, -2.9, 2.9);
      }

      // 主题轮换（同时切换一套 BGM）
      if (G.camZ > G.nextThemeAt) {
        G.theme = (G.theme + 1) % THEMES.length;
        Music.setTheme(G.theme);
        G.nextThemeAt += 900;
        G.themeT = 2.6;
        G.flash = Math.max(G.flash, 0.3);
        G.weather.length = 0;
      }
      if (G.themeT > 0) G.themeT -= dt;

      // 里程节点奖励：每 500 米一次，越往后奖励越高
      if (G.camZ >= G.nextMile) {
        G.mileCount++;
        var mBonus = 100 * G.mileCount;
        G.score += mBonus;
        G.mileBanner = { text: G.nextMile + 'M!', sub: '+' + mBonus, t: 1.9 };
        G.nextMile += 500;
        Sfx.milestone(G.mileCount);
        vibe(15);
      }

      // 相机跟随角色横向移动，变道时视角一起走
      CAM_X = lerp(CAM_X, P.x * CAM_FOLLOW, Math.min(1, dt * 7));

      // 变道（雪地打滑：横向插值变慢，会有惯性）
      var tx = LANE_X[P.lane];
      var slipK = 13 - 8.5 * themeFX().slip;
      P.x = lerp(P.x, tx, Math.min(1, dt * slipK));
      if (Math.abs(P.x - tx) < 0.004) P.x = tx;

      // 无人机平台：计算脚下支撑高度
      var support = 0;
      var droneHit = null;
      var launchNow = null;
      for (var pi = 0; pi < G.obs.length; pi++) {
        var od = G.obs[pi];
        if (od.hit) continue;
        if (od.type === 'ramp' || od.type === 'launch') {
          var uu = (G.camZ + PLAYER_Z - (od.z - od.d * 0.5)) / od.d;
          if (uu < 0 || uu > 1) continue;
          if (Math.abs(P.x - od.x) > od.w * 0.5 + 0.16) continue;
          var rh = od.y1 * uu;
          if (rh > support) support = rh;
          // 弹射台在坡顶前就进入待触发状态，避免不同车道的坡台
          // 因玩家落地帧时机不同而漏触发；同一座弹射台只触发一次。
          if (od.type === 'launch' && uu >= 0.82 && !od.launched) {
            if (!launchNow || uu > launchNow._launchU) {
              od._launchU = uu;
              launchNow = od;
            }
          }
          continue;
        }
        if (od.type === 'block') {
          // 方块顶面可站立（二段跳后可以跳上方块）
          var bdz = od.z - G.camZ;
          if (PLAYER_Z < bdz - od.d * 0.5 - 0.12 || PLAYER_Z > bdz + od.d * 0.5 + 0.12) continue;
          if (Math.abs(P.x - od.x) > od.w * 0.5 + 0.12) continue;
          if (P.y >= od.y1 - 0.35 && od.y1 > support) support = od.y1;
          continue;
        }
        if (od.type !== 'drone') continue;
        var rd = od.z - G.camZ;
        var hd = od.d * 0.5;
        if (PLAYER_Z < rd - hd - 0.1 || PLAYER_Z > rd + hd + 0.1) continue;
        if (Math.abs(P.x - od.x) > od.w * 0.5 + 0.12) continue;
        if (P.y >= od.y1 - 0.45) { if (od.y1 > support) support = od.y1; }
        else droneHit = od;
      }
      P.support = support;

      if (P.onGround) {
        if (P.y > support + 0.03) { P.onGround = false; P.vy = 0; }
        else P.y = support;
      }
      if (!P.onGround) {
        P.vy -= 34 * dt;
        P.y += P.vy * dt;
        if (P.y <= support && P.vy <= 0) {
          var fallV = -P.vy;
          P.landT = 0.18 * clamp(fallV / 13, 0.35, 1.25);
          P.stretchT = 0;
          P.y = support; P.vy = 0; P.onGround = true;
          G.jumping = false;
          G.airJumps = G.wingT > 0 ? 1 : 0;
          var fp = proj(P.x, support + 0.02, PLAYER_Z);
          burst(fp.x, fp.y, 'rgba(140,230,255,0.5)', support > 0 ? 12 : 6, support > 0 ? 200 : 130, 2);
          // 落地扬尘：落速越快尘越浓
          if (fallV > 6) burst(fp.x, fp.y, 'rgba(205,220,235,0.5)', Math.min(10, 3 + Math.round(fallV * 0.3)), 120, 2);
          if (support > 0) popup(fp.x, fp.y - 20, '无人机', '#9fe8ff');
        }
      }

      // 触发条件兼容坡顶处短暂的离地状态；只要角色确实贴近坡面，
      // 左/中/右三条车道的弹射台都能稳定生效。
      if (launchNow && !launchNow.launched && (P.onGround || P.y <= support + 0.35)) {
        launchNow.launched = true;
        P.onGround = false;
        P.vy = 13.5;
        G.jumping = false; // 弹射上升不被"松键截断"影响
        P.slideT = 0;
        P.crouch = 0;
        P.y = Math.max(P.y, launchNow.y1);
        G.shake = Math.max(G.shake, 7);
        var lp = proj(P.x, P.y + 0.2, PLAYER_Z);
        burst(lp.x, lp.y, 'rgba(255,212,95,0.95)', 18, 340, 3);
        burst(lp.x, lp.y, 'rgba(255,255,255,0.9)', 8, 220, 2);
        popup(lp.x, lp.y - 26, '弹射！', '#ffd45f');
        Sfx.launch();
      }

      if (droneHit) {
        if (G.skillT > 0) {
          // 冲刺期间直接撞碎无人机
          droneHit.hit = true;
          G.score += 60;
          G.combo++; G.comboT = 2.4;
          var dp2 = proj(droneHit.x, droneHit.y1, droneHit.z - G.camZ);
          burst(dp2.x, dp2.y, 'rgba(255,150,200,0.95)', 20, 300, 4);
          burst(dp2.x, dp2.y, 'rgba(150,255,240,0.9)', 12, 220, 3);
          popup(dp2.x, dp2.y - 20, '粉碎 +60', '#ffd45f');
          Sfx.shieldBreak();
          G.hitStop = Math.max(G.hitStop, 0.035);
          vibe(20);
        } else if (!G.god && G.invuln <= 0) {
          droneHit.hit = true;
          takeHit(droneHit);
        }
      }

      // 滑铲
      if (P.slideT > 0) P.slideT -= dt;
      var target = P.slideT > 0 ? 1 : 0;
      P.crouch = lerp(P.crouch, target, Math.min(1, dt * (target > P.crouch ? 22 : 12)));

      // 生成（新手引导期间整条路保持空旷，点完提示后再开始放障碍）
      if (Tutorial.step === 0) {
        var guard = 0;
        while (G.nextSpawnZ < G.camZ + 175 && guard++ < 8) {
          var hadDrone = spawnGroup(G.nextSpawnZ);
          var diffN = clamp(G.camZ / 2200, 0, 1);
          // 难度曲线：组间隔随时间收紧；高速阶段概率性二连组制造"紧张-放松"节奏波
          var gapT = levelRnd(0.96, 1.32) * (1 - 0.16 * diffN) * DF().gap;
          G.nextSpawnZ += G.speed * gapT + (hadDrone ? 8 : 0);
          if (diffN > 0.3 && levelRnd(0, 1) < 0.20 * diffN * DF().dbl) {
            spawnGroup(G.nextSpawnZ + 6, true); // 简化组：只放单个障碍，保证可通过
            G.nextSpawnZ += G.speed * 0.5;
          }
        }
      }

      G.invuln = Math.max(0, G.invuln - dt);

      // 碰撞（扫掠检测：按本帧位移区间判定，高速/冲刺时也不会穿模）
      var height = 1.7 - 0.85 * P.crouch;
      var dCam = Math.max(0, G.camZ - G.prevCamZ);
      for (var i = 0; i < G.obs.length; i++) {
        var o = G.obs[i];
        if (o.hit || o.type === 'drone' || o.type === 'ramp' || o.type === 'launch') continue;
        var rel = o.z - G.camZ;
        var prevRel = rel + dCam; // 上一帧时障碍的相对位置
        if (G.god || G.tutGod) continue;
        var xGap = Math.abs(P.x - o.x);
        if (o.type === 'pendulum') {
          var hx2 = o.x + Math.sin(G.t * o.sw + o.ph) * o.amp;
          o.headX = hx2;
          xGap = Math.abs(P.x - hx2);
        }
        // 本帧障碍判定窗口扫过的区间是否覆盖玩家所在平面
        var swept = rel - 1.15 <= PLAYER_Z && prevRel + 1.15 >= PLAYER_Z;
        // 本帧内障碍与玩家的最小 z 距离（0 表示本帧穿过）
        var zMin = (PLAYER_Z >= rel && PLAYER_Z <= prevRel) ? 0
          : Math.min(Math.abs(rel - PLAYER_Z), Math.abs(prevRel - PLAYER_Z));
        // 擦肩而过会触发完美闪避；每个障碍只奖励一次。
        if (!o.nearMiss && G.invuln <= 0 && zMin > 1.15 && zMin < 2.35 && xGap > o.w * 0.5 + 0.28 && xGap < o.w * 0.5 + 0.95) {
          o.nearMiss = true;
          G.nearMisses++;
          G.combo++;
          G.comboT = 2.4;
          G.energy = clamp(G.energy + 14 * (skinPerk().energy || 1), 0, 100);
          var np = proj(P.x, P.y + 1.1, PLAYER_Z);
          popup(np.x, np.y - 25, '完美闪避 +' + Math.round(14 * (skinPerk().energy || 1)) + ' 能量', '#9ffff6');
          if (Tutorial.step === 3) Tutorial.next();
          burst(np.x, np.y, 'rgba(110,255,235,0.9)', 7, 170, 2);
        }
        if (!swept) continue;
        if (G.skillT > 0 && xGap <= o.w * 0.5 + 0.28) {
          // 冲刺期间直接粉碎障碍（不再"穿模"）
          var topS = P.y + height;
          if (!(P.y >= o.y1 - 0.03) && !(topS <= o.y0 + 0.03)) {
            o.hit = true;
            G.score += 60;
            G.combo++; G.comboT = 2.4;
            var shp = proj(o.x, (o.y0 + o.y1) * 0.5, rel);
            burst(shp.x, shp.y, 'rgba(255,150,200,0.95)', 20, 320, 4);
            burst(shp.x, shp.y, 'rgba(150,255,240,0.9)', 12, 240, 3);
            popup(shp.x, shp.y - 20, '粉碎 +60', '#ffd45f');
            Sfx.shieldBreak();
            G.hitStop = Math.max(G.hitStop, 0.035);
            vibe(20);
            continue;
          }
        }
        if (G.invuln > 0) continue;
        if (xGap > o.w * 0.5 + 0.28) continue;
        var top = P.y + height;
        if (P.y >= o.y1 - 0.03) continue;
        if (top <= o.y0 + 0.03) continue;
        o.hit = true;
        takeHit(o);
        break;
      }

      // 金币（磁铁吸附 + 扫掠判定，高速也漏不掉）
      var coinMul = (skinPerk().coinMul || 1) * DF().coin;
      var magnetOn = G.magnetT > 0;
      for (var j = 0; j < G.coinList.length; j++) {
        var c = G.coinList[j];
        if (c.taken) continue;
        var relc = c.z - G.camZ;
        // 磁铁：把前方金币缓缓吸向角色
        if (magnetOn && relc > -2 && relc < 34 && Math.abs(c.x - P.x) < 4.6) {
          c.x = lerp(c.x, P.x, Math.min(1, dt * 4.5));
          c.y = lerp(c.y, P.y + 0.85, Math.min(1, dt * 4.5));
        }
        var prevRelc = relc + dCam;
        var sweptC = relc - 1.1 <= PLAYER_Z && prevRelc + 1.1 >= PLAYER_Z;
        if (!sweptC) continue;
        if (Math.abs(P.x - c.x) > (magnetOn ? 1.3 : 0.82)) continue;
        var coinTop = P.y + 1.66 - 0.62 * P.crouch;
        if (c.y < P.y - 0.1 || c.y > coinTop) continue;
        c.taken = true;
        // 收益加成同时作用于实际金币；小数部分累计，避免每枚向下取整损失。
        G.coinFrac += coinMul;
        var wholeCoins = Math.floor(G.coinFrac + 0.000001);
        if (wholeCoins > 0) {
          G.coins += wholeCoins;
          G.coinFrac -= wholeCoins;
        }
        G.score += Math.round(10 * coinMul);
        G.combo++; G.comboT = 2.4;
        // 金币不再提供冲刺能量：能量只来自「完美闪避」
        if (G.combo > 0 && G.combo % 5 === 0) { G.score += 25; popup(proj(c.x, c.y, relc).x, proj(c.x, c.y, relc).y - 32, '连击奖励 +25', '#ffd45f'); }
        var cp = proj(c.x, c.y, relc);
        burst(cp.x, cp.y, 'rgba(255,215,110,0.95)', 9, 210, 3);
        popup(cp.x, cp.y - 14, '+' + Math.round(10 * coinMul));
        Sfx.coin();
        vibe(12);
      }

      // 护盾拾取
      for (var sh2 = 0; sh2 < G.shieldList.length; sh2++) {
        var sp = G.shieldList[sh2];
        if (sp.taken) continue;
        var rels = sp.z - G.camZ;
        if (!(rels - 1.1 <= PLAYER_Z && rels + dCam + 1.1 >= PLAYER_Z)) continue;
        if (Math.abs(P.x - sp.x) > 0.85) continue;
        if (sp.y < P.y - 0.2 || sp.y > P.y + 1.95) continue;
        sp.taken = true;
        if (G.shields < shieldCap()) G.shields++;
        var spp = proj(sp.x, sp.y, rels);
        burst(spp.x, spp.y, 'rgba(150,230,255,0.95)', 18, 300, 3);
        popup(spp.x, spp.y - 14, '护盾 +1', '#9fe8ff');
        Sfx.shieldGet();
        vibe(15);
      }

      // 强化道具拾取（磁铁 / 翅膀）
      for (var pw = 0; pw < G.powerList.length; pw++) {
        var pu = G.powerList[pw];
        if (pu.taken) continue;
        var relp = pu.z - G.camZ;
        if (!(relp - 1.1 <= PLAYER_Z && relp + dCam + 1.1 >= PLAYER_Z)) continue;
        if (Math.abs(P.x - pu.x) > 0.95) continue;
        if (pu.y < P.y - 0.2 || pu.y > P.y + 2.0) continue;
        pu.taken = true;
        var pp = proj(pu.x, pu.y, relp);
        if (pu.kind === 'magnet') {
          G.magnetT = 8;
          burst(pp.x, pp.y, 'rgba(200,120,255,0.95)', 20, 300, 3);
          popup(pp.x, pp.y - 16, '磁铁 8 秒', '#d9a6ff');
          Sfx.shieldGet();
        } else {
          G.wingT = 7;
          G.airJumps = 1;
          burst(pp.x, pp.y, 'rgba(150,235,255,0.95)', 20, 300, 3);
          popup(pp.x, pp.y - 16, '翅膀 7 秒', '#bff0ff');
          Sfx.launch();
        }
        vibe(20);
      }

      // 回收
      for (var k = G.obs.length - 1; k >= 0; k--) {
        if (G.obs[k].z - G.camZ < -8) G.obs.splice(k, 1);
      }
      for (var m = G.coinList.length - 1; m >= 0; m--) {
        if (G.coinList[m].z - G.camZ < -8) G.coinList.splice(m, 1);
      }
      for (var m2 = G.shieldList.length - 1; m2 >= 0; m2--) {
        if (G.shieldList[m2].z - G.camZ < -8) G.shieldList.splice(m2, 1);
      }
      for (var m3 = G.powerList.length - 1; m3 >= 0; m3--) {
        if (G.powerList[m3].z - G.camZ < -8) G.powerList.splice(m3, 1);
      }
    }

    // 屏幕震动 / 闪光
    if (G.shopMsgT > 0) G.shopMsgT = Math.max(0, G.shopMsgT - dt);
    G.shake = Math.max(0, G.shake - dt * 34);
    G.flash = Math.max(0, G.flash - dt * 1.8);

    // 轻提示 / 里程横幅计时
    for (var ti2 = G.toasts.length - 1; ti2 >= 0; ti2--) {
      G.toasts[ti2].t -= dt;
      if (G.toasts[ti2].t <= 0) G.toasts.splice(ti2, 1);
    }
    if (G.mileBanner) {
      G.mileBanner.t -= dt;
      if (G.mileBanner.t <= 0) G.mileBanner = null;
    }

    // 极简模式直接跳过粒子逻辑；普通模式在死亡慢镜头时同步放慢。
    if (!G.minimal) {
      for (var q = G.parts.length - 1; q >= 0; q--) {
        var pt = G.parts[q];
        pt.life -= sdt;
        if (pt.life <= 0) { G.parts.splice(q, 1); continue; }
        pt.vy += pt.g * sdt;
        var dg = Math.max(0, 1 - (pt.drag || 0) * sdt * 1.2);
        pt.vx *= dg; pt.vy *= dg;
        pt.x += pt.vx * sdt;
        pt.y += pt.vy * sdt;
      }
    }
  }

  // ---------- 主题 ----------
  function TH_now() { return THEMES[G.theme] || THEMES[0]; }

  // ---------- 背景绘制 ----------
  // 渐变缓存：静态渐变只创建一次，resize 时清空
  var gradCache = {};
  var BAKING_BG = false;
  function cachedGrad(key, make) {
    if (BAKING_BG) return make();   // 烘焙时用当前 ctx 新建渐变，避免跨画布复用
    var g = gradCache[key];
    if (!g) { g = make(); gradCache[key] = g; }
    return g;
  }

  // ---------- 静态背景烘焙（天空 / 太阳 / 星星 / 天际线） ----------
  var bgCache = { key: '', cv: null };
  var BG_PAD = 90;

  function bakeBackdrop() {
    var TH = TH_now();
    var key = TH.id + '|' + W + '|' + H + '|' + DPR + '|' + G.q + '|' + G.state;
    if (bgCache.key === key && bgCache.cv) return;
    var topH = Math.ceil(HORIZON + 96);
    var cw = Math.max(1, Math.round((W + BG_PAD * 2) * DPR));
    var chh = Math.max(1, Math.round(topH * DPR));
    if (!bgCache.cv) bgCache.cv = document.createElement('canvas');
    if (bgCache.cv.width !== cw || bgCache.cv.height !== chh) {
      bgCache.cv.width = cw;
      bgCache.cv.height = chh;
    }
    var octx = bgCache.cv.getContext('2d');
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, cw, chh);
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.translate(BG_PAD, 0);

    var savedCtx = ctx;
    var savedT = G.t;
    ctx = octx;
    BAKING_BG = true;
    G.t = 3.3;              // 固定时间，星星/灯带不闪
    drawSky();
    drawStars();
    drawSun();
    drawSkyline();
    BAKING_BG = false;
    G.t = savedT;
    ctx = savedCtx;
    bgCache.key = key;
  }

  // 烘焙后再补一层轻微闪烁的星星，保证天空不是死的
  function drawStarTwinkle() {
    if (G.q < 2) return;                 // 流畅模式下星星只保留烘焙结果
    if (!TH_now().stars || !stars.length) return;
    ctx.fillStyle = '#dff2ff';
    ctx.beginPath();
    for (var i = 0; i < stars.length; i += 7) {
      var st2 = stars[i];
      var tw = Math.abs(Math.sin(G.t * st2.s + st2.p));
      if (tw < 0.55) continue;
      ctx.moveTo(st2.x, st2.y);
      ctx.arc(st2.x, st2.y, st2.r * 1.3, 0, TAU);
    }
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 低画质时关闭阴影辉光，减轻 GPU 负担
  function shadowGlow(color, blur) {
    if (G.q > 1) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  }

  // 天际线离屏预渲染：每个主题只画一次到离屏 canvas，帧内只贴图 + 少量动态灯
  var skyCache = { key: '', cv: null, tw: null };
  var skyRec = null; // 非 null 时记录动态闪烁灯的位置

  function drawSky() {
    var TH = TH_now();
    var g = cachedGrad('sky|' + TH.id, function () {
      var gg = ctx.createLinearGradient(0, 0, 0, HORIZON + 80);
      gg.addColorStop(0, TH.sky[0]);
      gg.addColorStop(0.32, TH.sky[1]);
      gg.addColorStop(0.6, TH.sky[2]);
      gg.addColorStop(0.82, TH.sky[3]);
      gg.addColorStop(1, TH.sky[4]);
      return gg;
    });
    ctx.fillStyle = g;
    ctx.fillRect(-90, 0, W + 180, HORIZON + 82);

    var hg = cachedGrad('skyglow|' + TH.id, function () {
      var g2 = ctx.createRadialGradient(W * 0.5, HORIZON + 10, 0, W * 0.5, HORIZON + 10, Math.max(W * 0.6, H * 0.5));
      g2.addColorStop(0, TH.glow);
      g2.addColorStop(0.5, 'rgba(0,0,0,0)');
      g2.addColorStop(1, 'rgba(0,0,0,0)');
      return g2;
    });
    ctx.fillStyle = hg;
    ctx.fillRect(-90, HORIZON - H * 0.42, W + 180, H * 0.5);
  }

  function drawStars() {
    if (!TH_now().stars) return;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.45 + 0.55 * Math.abs(Math.sin(G.t * s.s + s.p));
      ctx.globalAlpha = tw * 0.85;
      ctx.fillStyle = '#cfe9ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSun() {
    var TH = TH_now();
    var cx = sunCX;
    var cy = HORIZON - H * 0.115;
    var r = Math.max(34, H * 0.105);

    var glow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 3.2);
    glow.addColorStop(0, TH.sun[1]);
    glow.addColorStop(0.35, 'rgba(255,255,255,0.10)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r * 3.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
    var disc = ctx.createLinearGradient(0, cy - r, 0, cy + r);
    disc.addColorStop(0, TH.sun[0]);
    disc.addColorStop(0.4, TH.sun[1]);
    disc.addColorStop(0.68, TH.sun[2]);
    disc.addColorStop(1, TH.sun[3]);
    ctx.fillStyle = disc;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    if (TH.id === 'neon') {
      ctx.globalCompositeOperation = 'destination-out';
      var bandH = r * 0.085;
      for (var i = 0; i < 5; i++) {
        var by = cy + r * 0.08 + i * bandH * 1.7;
        ctx.fillRect(cx - r, by, r * 2, bandH * (0.5 + i * 0.16));
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  function hash01(a, b, c) {
    var v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
    return v - Math.floor(v);
  }

  function drawSkyline() {
    var TH = TH_now();
    var key = TH.id + '|' + W + '|' + H + '|' + DPR;
    if (skyCache.key !== key || !skyCache.cv) {
      // 重新预渲染当前主题的天际线
      var cv = document.createElement('canvas');
      cv.width = canvas.width;
      cv.height = canvas.height;
      var octx = cv.getContext('2d');
      octx.setTransform(DPR, 0, 0, DPR, 0, 0);
      skyRec = [];
      var savedCtx = ctx;
      var savedT = G.t;
      ctx = octx;
      G.t = 3.3; // 固定时间渲染，保证预渲染画面稳定
      if (TH.style === 'dunes') drawDunes(TH);
      else if (TH.style === 'pines') drawPines(TH);
      else if (TH.style === 'palace') drawPalace(TH);
      else drawCity(TH, TH.style === 'london');
      G.t = savedT;
      ctx = savedCtx;
      skyCache.key = key;
      skyCache.cv = cv;
      skyCache.tw = skyRec;
      skyRec = null;
    }
    ctx.drawImage(skyCache.cv, 0, 0, W, H);
    // 少量动态闪烁灯，保持夜晚的生机
    var tw = skyCache.tw || [];
    for (var i = 0; i < tw.length; i++) {
      var w = tw[i];
      ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(G.t * (1.2 + w.p) + w.o));
      ctx.fillStyle = w.c;
      ctx.fillRect(w.x, w.y, w.w, w.h);
    }
    ctx.globalAlpha = 1;
  }

  function drawCity(TH, withTower) {
    for (var layer = 0; layer <= 1; layer++) {
      var arr = skyline[layer];
      var back = layer === 0;
      for (var i = 0; i < arr.length; i++) {
        var b = arr[i];
        var top = HORIZON - b.h;
        ctx.fillStyle = back ? TH.bA : TH.bB;
        ctx.fillRect(b.x, top, b.w, b.h + 8);

        var cols = Math.max(1, Math.floor((b.w - 8) / 10));
        var rows = Math.min(16, Math.max(1, Math.floor((b.h - 10) / 13)));
        for (var c = 0; c < cols; c++) {
          for (var r = 0; r < rows; r++) {
            var frac = hash01(b.seed * 97.3, c, r);
            if (frac > (back ? 0.45 : 0.66)) {
              var tw = 0.5 + 0.5 * Math.sin(G.t * (1.2 + frac * 2) + c + r);
              ctx.globalAlpha = (back ? 0.2 : 0.32) + 0.4 * tw;
              ctx.fillStyle = frac > 0.9 ? TH.win[1] : TH.win[0];
              ctx.fillRect(b.x + 5 + c * 10, top + 7 + r * 13, 3.4, 5);
              if (skyRec && (c + r) % 7 === 0) {
                skyRec.push({ x: b.x + 5 + c * 10, y: top + 7 + r * 13, w: 3.4, h: 5, c: frac > 0.9 ? TH.win[1] : TH.win[0], p: frac * 2, o: c + r });
              }
            }
          }
        }
        ctx.globalAlpha = 1;

        if (!back && b.seed > 0.62) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = TH.accent;
          ctx.fillRect(b.x + 2, top, b.w - 4, 1.8);
          ctx.globalAlpha = 1;
        }
        if (back && b.seed > 0.84) {
          var ax = b.x + b.w * 0.5;
          ctx.fillStyle = TH.bA;
          ctx.fillRect(ax - 1, top - 14, 2, 14);
          ctx.fillStyle = TH.win[1];
          ctx.globalAlpha = 0.4 + 0.5 * Math.abs(Math.sin(G.t * 2.6 + b.seed * 10));
          ctx.fillRect(ax - 2.5, top - 18, 5, 5);
          ctx.globalAlpha = 1;
          if (skyRec) {
            skyRec.push({ x: ax - 2.5, y: top - 18, w: 5, h: 5, c: TH.win[1], p: 2.6, o: b.seed * 10 });
          }
        }
      }
    }

    if (withTower) {
      // 大本钟
      var tx = W * 0.24;
      var tw2 = Math.max(18, W * 0.028);
      var th = H * 0.34;
      var ty = HORIZON - th;
      ctx.fillStyle = '#243040';
      ctx.fillRect(tx - tw2 / 2, ty, tw2, th + 8);
      ctx.fillStyle = '#2e3c4e';
      ctx.fillRect(tx - tw2 * 0.8, ty - 18, tw2 * 1.6, 20);
      // 钟面
      ctx.fillStyle = '#e8d9a8';
      ctx.beginPath();
      ctx.arc(tx, ty + 26, tw2 * 0.42, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx, ty + 26);
      ctx.lineTo(tx, ty + 26 - tw2 * 0.3);
      ctx.moveTo(tx, ty + 26);
      ctx.lineTo(tx + tw2 * 0.22, ty + 26 + tw2 * 0.1);
      ctx.stroke();
      // 尖顶
      ctx.fillStyle = '#1c2634';
      ctx.beginPath();
      ctx.moveTo(tx - tw2 * 0.7, ty - 18);
      ctx.lineTo(tx, ty - 52);
      ctx.lineTo(tx + tw2 * 0.7, ty - 18);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#cfe4f5';
      ctx.beginPath();
      ctx.arc(tx, ty - 6, 2.4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawDunes(TH) {
    // 远处金字塔
    var pyr = [
      { x: W * 0.18, w: W * 0.16, h: H * 0.2 },
      { x: W * 0.28, w: W * 0.1, h: H * 0.13 }
    ];
    for (var i = 0; i < pyr.length; i++) {
      var p = pyr[i];
      ctx.fillStyle = TH.bB;
      ctx.beginPath();
      ctx.moveTo(p.x - p.w / 2, HORIZON);
      ctx.lineTo(p.x, HORIZON - p.h);
      ctx.lineTo(p.x + p.w / 2, HORIZON);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = TH.bA;
      ctx.beginPath();
      ctx.moveTo(p.x, HORIZON - p.h);
      ctx.lineTo(p.x + p.w / 2, HORIZON);
      ctx.lineTo(p.x + p.w * 0.1, HORIZON);
      ctx.closePath();
      ctx.fill();
    }

    for (var layer = 0; layer < 2; layer++) {
      var amp = (layer === 0 ? 0.1 : 0.055) * H;
      var yBase = HORIZON + (layer === 0 ? -H * 0.005 : H * 0.03);
      var phase = layer * 2.4 + 1.3;
      var pts = [];
      for (var x = -60; x <= W + 60; x += 34) {
        var y = yBase - amp * (0.55 + 0.45 * Math.sin(x * 0.0062 + phase)) -
          amp * 0.22 * Math.sin(x * 0.019 + phase * 1.7);
        pts.push({ x: x, y: y });
      }
      var shape = pts.concat([{ x: W + 60, y: HORIZON + H * 0.1 }, { x: -60, y: HORIZON + H * 0.1 }]);
      poly(shape, layer === 0 ? TH.bA : TH.bB);
    }
  }

  function drawPines(TH) {
    // 雪山
    for (var m = 0; m < 6; m++) {
      var mx = (m + 0.5) * W / 6 + hash01(m, 3, 7) * 60 - 30;
      var mh = H * (0.12 + hash01(m, 5, 9) * 0.1);
      var mw = W * 0.16;
      ctx.fillStyle = TH.bA;
      ctx.beginPath();
      ctx.moveTo(mx - mw / 2, HORIZON + 4);
      ctx.lineTo(mx, HORIZON - mh);
      ctx.lineTo(mx + mw / 2, HORIZON + 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(235,250,255,0.55)';
      ctx.beginPath();
      ctx.moveTo(mx - mw * 0.14, HORIZON - mh * 0.72);
      ctx.lineTo(mx, HORIZON - mh);
      ctx.lineTo(mx + mw * 0.14, HORIZON - mh * 0.72);
      ctx.closePath();
      ctx.fill();
    }
    // 松树
    var arr = skyline[1];
    for (var i = 0; i < arr.length; i++) {
      var b = arr[i];
      if (hash01(b.seed * 31, 1, 2) < 0.35) continue;
      var tx = b.x + b.w * 0.5;
      var scale = 0.5 + hash01(b.seed * 17, 2, 3) * 0.72;
      var th = (0.055 + hash01(b.seed * 13, 4, 5) * 0.06) * H * scale;
      var tw = th * 0.42;
      ctx.fillStyle = TH.bB;
      ctx.fillRect(tx - 1.5, HORIZON - th * 0.15, 3, th * 0.18);
      for (var k = 0; k < 3; k++) {
        var ky = HORIZON - th * (0.15 + k * 0.28);
        var kw = tw * (1 - k * 0.25);
        ctx.beginPath();
        ctx.moveTo(tx - kw / 2, ky);
        ctx.lineTo(tx, ky - th * 0.36);
        ctx.lineTo(tx + kw / 2, ky);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#eafaff';
      ctx.beginPath();
      ctx.moveTo(tx - tw * 0.18, HORIZON - th * 0.72);
      ctx.lineTo(tx, HORIZON - th * 0.92);
      ctx.lineTo(tx + tw * 0.18, HORIZON - th * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawPalace(TH) {
    for (var layer = 0; layer <= 1; layer++) {
      var arr = skyline[layer];
      var back = layer === 0;
      for (var i = 0; i < arr.length; i++) {
        var b = arr[i];
        if (b.h < H * 0.05) continue;
        var bodyTop = HORIZON - b.h * 0.82;
        var roofH = Math.max(12, b.h * 0.34);
        var roofTop = bodyTop - roofH;
        var x0 = b.x, x1 = b.x + b.w, w = b.w;
        var eave = Math.max(6, w * 0.16);

        // 墙体
        ctx.fillStyle = back ? TH.bA : TH.bB;
        ctx.fillRect(x0, bodyTop, w, HORIZON - bodyTop + 8);
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#000000';
        var pc = Math.max(2, Math.floor(w / 14));
        for (var c = 0; c < pc; c++) {
          ctx.fillRect(x0 + w * (c + 0.5) / pc - 1, bodyTop + 4, 2, HORIZON - bodyTop - 8);
        }
        ctx.globalAlpha = 1;

        // 屋顶
        ctx.fillStyle = back ? '#3a1210' : '#1e0a09';
        ctx.beginPath();
        ctx.moveTo(x0 - eave, bodyTop + roofH * 0.25);
        ctx.quadraticCurveTo(x0 - eave * 0.4, roofTop + roofH * 0.32, x0 + w * 0.22, roofTop);
        ctx.lineTo(x0 + w * 0.78, roofTop);
        ctx.quadraticCurveTo(x1 + eave * 0.4, roofTop + roofH * 0.32, x1 + eave, bodyTop + roofH * 0.25);
        ctx.lineTo(x1, bodyTop + roofH * 0.02);
        ctx.lineTo(x0, bodyTop + roofH * 0.02);
        ctx.closePath();
        ctx.fill();

        // 屋脊金线
        ctx.strokeStyle = TH.accent;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(x0 - eave, bodyTop + roofH * 0.25);
        ctx.quadraticCurveTo(x0 + w * 0.5, roofTop - 1, x1 + eave, bodyTop + roofH * 0.25);
        ctx.stroke();
        ctx.globalAlpha = 1;

        // 檐下灯笼
        if (!back) {
          for (var lc = 0; lc < 2; lc++) {
            var lx = x0 + w * (lc === 0 ? 0.1 : 0.9);
            var ly = bodyTop + roofH * 0.32;
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = '#ff5a3c';
            ctx.beginPath(); ctx.arc(lx, ly, Math.max(2.2, w * 0.055), 0, TAU); ctx.fill();
            ctx.globalAlpha = 0.18;
            ctx.beginPath(); ctx.arc(lx, ly, Math.max(5, w * 0.14), 0, TAU); ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        // 窗
        var cols = Math.max(1, Math.floor(w / 18));
        for (var c2 = 0; c2 < cols; c2++) {
          var wx = x0 + w * (c2 + 0.5) / cols;
          var wy = bodyTop + (HORIZON - bodyTop) * 0.42;
          if (hash01(b.seed * 41, c2, layer) > 0.42) {
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = TH.win[0];
            ctx.fillRect(wx - 2.5, wy - 3.5, 5, 7);
            ctx.globalAlpha = 0.16;
            ctx.beginPath();
            ctx.arc(wx, wy, 9, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
            if (skyRec && c2 % 3 === 0) {
              skyRec.push({ x: wx - 2.5, y: wy - 3.5, w: 5, h: 7, c: TH.win[0], p: 1.6, o: c2 });
            }
          }
        }
      }
    }
  }

  function frac0(s) { return s - Math.floor(s); }

  function drawGround() {
    var TH = TH_now();
    var g = cachedGrad('ground|' + TH.id, function () {
      var gg = ctx.createLinearGradient(0, HORIZON, 0, H);
      gg.addColorStop(0, TH.ground[0]);
      gg.addColorStop(0.16, TH.ground[1]);
      gg.addColorStop(0.55, TH.ground[2]);
      gg.addColorStop(1, TH.ground[3]);
      return gg;
    });
    ctx.fillStyle = g;
    ctx.fillRect(0, HORIZON, W, H - HORIZON + 2);
  }

  function poly(pts, fill, stroke, lw) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
  }

  function roadStrip(x0, x1, y, zN, zF, fill) {
    var a = proj(x0, y, zN), b = proj(x1, y, zN), c = proj(x1, y, zF), d = proj(x0, y, zF);
    poly([a, b, c, d], fill);
  }

  function drawRoad() {
    var TH = TH_now();
    var zN = 2.0, zF = 200;
    var ln = proj(-ROAD_HALF, 0, zN), rn = proj(ROAD_HALF, 0, zN);
    var lf = proj(-ROAD_HALF, 0, zF), rf = proj(ROAD_HALF, 0, zF);

    var g = cachedGrad('road|' + TH.id, function () {
      var gg = ctx.createLinearGradient(0, lf.y, 0, ln.y);
      gg.addColorStop(0, TH.road[0]);
      gg.addColorStop(0.35, TH.road[1]);
      gg.addColorStop(1, TH.road[2]);
      return gg;
    });
    poly([ln, rn, rf, lf], g);

    var lg = cachedGrad('walk|' + TH.id, function () {
      var g2 = ctx.createLinearGradient(0, lf.y, 0, H);
      g2.addColorStop(0, TH.walk[0]);
      g2.addColorStop(1, TH.walk[1]);
      return g2;
    });
    roadStrip(-ROAD_HALF - 3.2, -ROAD_HALF, 0.01, zN, zF, lg);
    roadStrip(ROAD_HALF, ROAD_HALF + 3.2, 0.01, zN, zF, lg);

    // 车道虚线
    var PERIOD = 9, LEN = 3.2;
    var z0 = Math.floor((G.camZ + 150) / PERIOD) * PERIOD;
    for (; z0 > G.camZ + 4.6; z0 -= PERIOD) {
      var zn = Math.max(z0 - G.camZ, 4.4);
      var zf = Math.max(z0 - G.camZ + LEN, zn + 0.02);
      if (zn > 170) continue;
      roadStrip(-1.13, -1.0, 0.012, zn, zf, TH.dash);
      roadStrip(1.0, 1.13, 0.012, zn, zf, TH.dash);
    }

    // 霓虹边线
    ctx.save();
    shadowGlow(TH.accent, 16);
    roadStrip(-ROAD_HALF - 0.06, -ROAD_HALF + 0.06, 0.03, 2.0, zF, TH.edge);
    roadStrip(ROAD_HALF - 0.06, ROAD_HALF + 0.06, 0.03, 2.0, zF, TH.edge);
    ctx.restore();

    // 地平雾
    var fog = cachedGrad('roadfog|' + TH.id, function () {
      var g3 = ctx.createLinearGradient(0, HORIZON - 4, 0, HORIZON + H * 0.13);
      g3.addColorStop(0, TH.haze);
      g3.addColorStop(1, 'rgba(0,0,0,0)');
      return g3;
    });
    ctx.fillStyle = fog;
    ctx.fillRect(0, HORIZON - 4, W, H * 0.15);
  }

  function drawDecor() {
    var PERIOD = 13;
    var z0 = Math.floor((G.camZ + 200) / PERIOD) * PERIOD;
    for (; z0 > G.camZ + 2.4; z0 -= PERIOD) {
      var rel = z0 - G.camZ;
      if (rel > 195) continue;
      drawPost(-4.75, rel);
      drawPost(4.75, rel);
    }
  }

  function drawPost(x, rel) {
    var TH = TH_now();
    var w = 0.09;
    var zN = rel - 0.09, zF = rel + 0.09;
    if (zF < 2.4) return;
    box3D(x, w, 0, 2.85, zN, zF, TH.post[0], TH.post[1], TH.post[2]);
    var p = proj(x, 3.02, rel);
    if (p.s > 900) return;
    var r = clamp(0.13 * p.s, 1.5, 16);
    ctx.save();
    shadowGlow(TH.post[0], 18);
    ctx.fillStyle = TH.post[0];
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawArch(rel) {
    // 拱门已移除（用户反馈挡视线）；保留空函数避免异常引用。
    void rel;
  }

  // ---------- 天气粒子 ----------
  function spawnWeather(kind, initial) {
    var p = { x: 0, y: 0, vx: 0, vy: 0, size: 2, a: 0.6, rot: 0, t: 0 };
    if (kind === 'snow') {
      p.x = Math.random() * W;
      p.y = initial ? Math.random() * H : -12;
      p.vx = rnd(-22, 22);
      p.vy = rnd(45, 95);
      p.size = rnd(1.4, 3.4);
      p.a = rnd(0.4, 0.9);
    } else if (kind === 'sand') {
      p.x = initial ? Math.random() * W : W + 30 + Math.random() * 60;
      p.y = HORIZON + rnd(-20, H * 0.55);
      p.vx = -rnd(240, 420);
      p.vy = rnd(-14, 26);
      p.size = rnd(10, 30);
      p.a = rnd(0.1, 0.3);
    } else if (kind === 'petal') {
      p.x = Math.random() * W;
      p.y = initial ? Math.random() * H : -12;
      p.vx = rnd(-34, 34);
      p.vy = rnd(26, 58);
      p.size = rnd(2, 4.2);
      p.a = rnd(0.35, 0.8);
      p.rot = Math.random() * TAU;
    } else if (kind === 'fog') {
      p.x = Math.random() * W;
      p.y = HORIZON + rnd(-30, H * 0.32);
      p.vx = rnd(-14, 14);
      p.vy = rnd(-4, 4);
      p.size = rnd(90, 200);
      p.a = rnd(0.04, 0.1);
    }
    return p;
  }

  function updateWeather(dt) {
    var TH = TH_now();
    if (TH.weather !== G.weatherKind) {
      G.weatherKind = TH.weather;
      G.weather.length = 0;
    }
    var qMul = G.q > 1 ? 1 : 0.5;
    var want = TH.weather === 'none' ? 0 : (TH.weather === 'fog' ? 8 : Math.round((lowPowerMode ? 28 : 60) * qMul));
    var guard = 0;
    while (G.weather.length < want && guard++ < 120) G.weather.push(spawnWeather(TH.weather, true));

    for (var i = G.weather.length - 1; i >= 0; i--) {
      var p = G.weather[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.t += dt;
      if (TH.weather === 'petal') p.rot += dt * 2.4;
      var out = p.y > H + 30 || p.y < -30 || p.x < -80 || p.x > W + 120;
      if (out) {
        if (G.weather.length > want) { G.weather.splice(i, 1); continue; }
        var np = spawnWeather(TH.weather, false);
        p.x = np.x; p.y = np.y; p.vx = np.vx; p.vy = np.vy;
        p.size = np.size; p.a = np.a; p.rot = np.rot; p.t = 0;
      }
    }
  }

  function drawWeather() {
    var TH = TH_now();
    if (!G.weather.length) return;
    if (TH.weather === 'snow') {
      ctx.fillStyle = '#ffffff';
      for (var i = 0; i < G.weather.length; i++) {
        var p = G.weather[i];
        ctx.globalAlpha = p.a;
        ctx.beginPath();
        ctx.arc(p.x + Math.sin(p.t * 2 + p.size) * 6, p.y, p.size, 0, TAU);
        ctx.fill();
      }
    } else if (TH.weather === 'sand') {
      ctx.strokeStyle = TH.sun[1];
      ctx.lineWidth = 1.3;
      for (var j = 0; j < G.weather.length; j++) {
        var q = G.weather[j];
        ctx.globalAlpha = q.a;
        ctx.beginPath();
        ctx.moveTo(q.x, q.y);
        ctx.lineTo(q.x + q.size, q.y - q.vy * 0.05);
        ctx.stroke();
      }
    } else if (TH.weather === 'petal') {
      ctx.fillStyle = '#ffb6d5';
      for (var k = 0; k < G.weather.length; k++) {
        var r = G.weather[k];
        ctx.globalAlpha = r.a;
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, r.size, r.size * 0.55, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    } else if (TH.weather === 'fog') {
      for (var m = 0; m < G.weather.length; m++) {
        var f = G.weather[m];
        var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
        g.addColorStop(0, 'rgba(210,228,240,' + f.a + ')');
        g.addColorStop(1, 'rgba(210,228,240,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 3D 盒子 ----------
  function box3D(cx, hw, y0, y1, zN, zF, cTop, cFront, cSide) {
    if (zF < 2.3) return;
    var zn = Math.max(zN, 2.3);
    var zf = Math.max(zF, zn + 0.05);
    if (zf > 260) return;

    var ln = proj(cx - hw, y0, zn), rn = proj(cx + hw, y0, zn);
    var lt = proj(cx - hw, y1, zn), rt = proj(cx + hw, y1, zn);
    var Ln = proj(cx - hw, y0, zf), Rn = proj(cx + hw, y0, zf);
    var Lt = proj(cx - hw, y1, zf), Rt = proj(cx + hw, y1, zf);

    if (y1 < CAM_Y - 0.02) poly([lt, rt, Rt, Lt], cTop);
    if (cx + hw < 0) poly([rn, rt, Rt, Rn], cSide);
    else if (cx - hw > 0) poly([ln, lt, Lt, Ln], cSide);
    poly([ln, rn, rt, lt], cFront);
  }

  function frontFace(cx, hw, y0, y1, zn) {
    if (zn > 240) return null;
    return {
      bl: proj(cx - hw, y0, zn),
      br: proj(cx + hw, y0, zn),
      tr: proj(cx + hw, y1, zn),
      tl: proj(cx - hw, y1, zn)
    };
  }

  function fp(f, u, v) {
    var bx = lerp(f.bl.x, f.br.x, u), by = lerp(f.bl.y, f.br.y, u);
    var tx = lerp(f.tl.x, f.tr.x, u), ty = lerp(f.tl.y, f.tr.y, u);
    return { x: lerp(bx, tx, v), y: lerp(by, ty, v) };
  }

  // ---------- 障碍物绘制 ----------
  function drawObstacle(o, rel) {
    if (rel < 2.2) return;
    if (o.type === 'dune' || o.type === 'icicle' || o.type === 'lantern' || o.type === 'booth' || o.type === 'fence') drawThemeObs(o, rel);
    else if (o.type === 'pillar') drawPillar(o, rel);
    else if (o.type === 'gate') drawGate(o, rel);
    else if (o.type === 'spike') drawSpike(o, rel);
    else if (o.type === 'pendulum') drawPendulum(o, rel);
    else if (o.type === 'barrier') drawBarrier(o, rel);
    else if (o.type === 'slider') drawSlider(o, rel);
    else if (o.type === 'beam') drawBeam(o, rel);
    else if (o.type === 'drone') drawDrone(o, rel);
    else if (o.type === 'ramp' || o.type === 'launch') drawRamp(o, rel);
    else drawBlock(o, rel);
  }

  // 高柱：太高跳不过，只能换道
  function drawPillar(o, rel) {
    if (rel < 2.2) return;
    var zf = rel + o.d * 0.5;
    if (zf < 2.3) return;
    box3D(o.x, o.w * 0.5, 0, 2.5, rel - o.d * 0.5, rel + o.d * 0.5, '#8f7bf0', '#584aa8', '#2f2860');
    var zc = Math.max(rel - o.d * 0.5, 2.35);
    for (var i = 1; i <= 3; i++) {
      var yy = (i / 4) * 2.5;
      var a = proj(o.x - o.w * 0.5, yy, zc), b = proj(o.x + o.w * 0.5, yy, zc);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(200,185,255,0.6)';
      ctx.lineWidth = Math.max(1, 0.03 * a.s);
      ctx.stroke();
    }
    var top = proj(o.x, 2.5, zc);
    ctx.save();
    shadowGlow('rgba(170,150,255,0.9)', 14);
    ctx.beginPath();
    ctx.arc(top.x, top.y, Math.max(2, 0.06 * top.s), 0, TAU);
    ctx.fillStyle = '#d8ccff';
    ctx.fill();
    ctx.restore();
  }

  // 窄门：低横梁 + 门框，滑铲通过
  function drawGate(o, rel) {
    if (rel < 2.2) return;
    var zf = rel + o.d * 0.5;
    if (zf < 2.3) return;
    var hw = o.w * 0.5;
    for (var sg2 = -1; sg2 <= 1; sg2 += 2) {
      box3D(o.x + sg2 * (hw - 0.08), 0.08, 0, o.y1, rel - o.d * 0.5, rel + o.d * 0.5, '#5f6fa8', '#3a4670', '#232b47');
    }
    box3D(o.x, hw, o.y0, o.y1, rel - o.d * 0.5, rel + o.d * 0.5, '#ffb35c', '#c97c22', '#8a5210');
    var zc = Math.max(rel - o.d * 0.5, 2.35);
    var a = proj(o.x - hw, o.y0, zc), b = proj(o.x + hw, o.y0, zc);
    ctx.save();
    shadowGlow('rgba(255,180,90,0.8)', 12);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(255,215,150,0.95)';
    ctx.lineWidth = Math.max(2, 0.04 * a.s);
    ctx.stroke();
    ctx.restore();
  }

  // 场景专属障碍（沙丘 / 冰锥 / 石灯笼 / 电话亭 / 电子栅栏）
  function drawThemeObs(o, rel) {
    if (rel < 2.2) return;
    var zf = rel + o.d * 0.5;
    if (zf < 2.3) return;
    var hw = o.w * 0.5;
    var zc = Math.max(rel - o.d * 0.5, 2.35);

    if (o.type === 'dune') {
      box3D(o.x, hw, 0.02, 0.26, rel - o.d * 0.5, rel + o.d * 0.5, '#e8b46a', '#b8843c', '#8a5f26');
      for (var i = 0; i < 5; i++) {
        var rx = o.x - hw + (i + 0.5) * (o.w / 5);
        var tp = proj(rx, 0.74, zc);
        var lp = proj(rx - o.w / 10, 0.26, zc);
        var rp = proj(rx + o.w / 10, 0.26, zc);
        poly([lp, rp, tp], i % 2 ? '#f2caa0' : '#e8b46a', 'rgba(255,235,190,0.55)', 1);
      }
      return;
    }
    if (o.type === 'icicle') {
      for (var k = 0; k < 5; k++) {
        var ix2 = o.x - hw + (k + 0.5) * (o.w / 5);
        var bp = proj(ix2, o.y0, zc);
        var lw3 = proj(ix2 - 0.1, 2.34, zc);
        var rw3 = proj(ix2 + 0.1, 2.34, zc);
        poly([lw3, rw3, bp], 'rgba(198,238,255,0.92)', 'rgba(255,255,255,0.8)', 1);
      }
      var ba = proj(o.x - hw, 2.4, zc), bb = proj(o.x + hw, 2.4, zc);
      ctx.beginPath();
      ctx.moveTo(ba.x, ba.y);
      ctx.lineTo(bb.x, bb.y);
      ctx.strokeStyle = 'rgba(200,235,255,0.85)';
      ctx.lineWidth = Math.max(2, 0.05 * ba.s);
      ctx.stroke();
      return;
    }
    if (o.type === 'lantern') {
      box3D(o.x, hw, 0, 0.55, rel - o.d * 0.5, rel + o.d * 0.5, '#a2968a', '#6f6559', '#48413a');
      box3D(o.x, hw * 0.7, 0.55, 1.55, rel - o.d * 0.32, rel + o.d * 0.32, '#ffcf7a', '#d89a3c', '#9c6a1e');
      box3D(o.x, hw * 0.92, 1.55, 1.9, rel - o.d * 0.5, rel + o.d * 0.5, '#8f8578', '#625a4f', '#3f3932');
      box3D(o.x, hw * 1.0, 1.9, 2.35, rel - o.d * 0.42, rel + o.d * 0.42, '#a2968a', '#6f6559', '#48413a');
      var gp = proj(o.x, 1.05, zc);
      ctx.save();
      shadowGlow('rgba(255,200,110,0.85)', 16);
      ctx.beginPath();
      ctx.arc(gp.x, gp.y, Math.max(2, 0.1 * gp.s), 0, TAU);
      ctx.fillStyle = 'rgba(255,230,170,0.95)';
      ctx.fill();
      ctx.restore();
      return;
    }
    if (o.type === 'booth') {
      box3D(o.x, hw, 0, 2.35, rel - o.d * 0.5, rel + o.d * 0.5, '#c0392b', '#8e2318', '#5f150e');
      var t1 = proj(o.x - hw * 0.72, 1.95, zc), t2 = proj(o.x + hw * 0.72, 1.95, zc);
      var t3 = proj(o.x + hw * 0.72, 0.45, zc), t4 = proj(o.x - hw * 0.72, 0.45, zc);
      poly([t1, t2, t3, t4], 'rgba(180,225,240,0.35)', 'rgba(220,245,255,0.6)', 1);
      box3D(o.x, hw * 0.9, 2.35, 2.62, rel - o.d * 0.45, rel + o.d * 0.45, '#ffd15c', '#c99a2a', '#8a6410');
      return;
    }
    // fence：悬浮电子栅栏（下面可以滑铲，上面可以跳过）
    var lx4 = o.x - hw, rx4 = o.x + hw;
    // 能量场
    var fl = proj(lx4, o.y0, zc), fr = proj(rx4, o.y0, zc);
    var tl2 = proj(lx4, o.y1, zc), tr2 = proj(rx4, o.y1, zc);
    poly([fl, fr, tr2, tl2], 'rgba(90,240,225,0.16)', 'rgba(140,255,240,0.55)', 1);
    // 上下两条光带
    ctx.save();
    shadowGlow('rgba(120,255,240,0.9)', 12);
    for (var p2 = 0; p2 < 2; p2++) {
      var yy2 = p2 === 0 ? o.y0 : o.y1;
      var a2 = proj(lx4, yy2, zc), b2 = proj(rx4, yy2, zc);
      ctx.beginPath();
      ctx.moveTo(a2.x, a2.y);
      ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = 'rgba(150,255,245,0.95)';
      ctx.lineWidth = Math.max(2, 0.045 * a2.s);
      ctx.stroke();
    }
    ctx.restore();
    // 两侧发射器（画在判定范围外，不影响滑铲）
    for (var q2 = 0; q2 < 2; q2++) {
      var ex2 = o.x + (q2 === 0 ? -(hw + 0.26) : (hw + 0.26));
      var eb = proj(ex2, 0.45, zc), et = proj(ex2, 1.35, zc);
      ctx.beginPath();
      ctx.moveTo(eb.x, eb.y);
      ctx.lineTo(et.x, et.y);
      ctx.strokeStyle = 'rgba(170,215,235,0.85)';
      ctx.lineWidth = Math.max(2, 0.06 * eb.s);
      ctx.stroke();
      var em = proj(ex2, o.y0 + (o.y1 - o.y0) * 0.5, zc);
      ctx.beginPath();
      ctx.arc(em.x, em.y, Math.max(2, 0.07 * em.s), 0, TAU);
      ctx.fillStyle = 'rgba(150,255,245,0.95)';
      ctx.fill();
    }
    // 电弧
    var spark = proj(o.x + Math.sin(G.t * 9) * hw * 0.7, o.y0 + 0.2, zc);
    ctx.beginPath();
    ctx.arc(spark.x, spark.y, Math.max(1.5, 0.03 * spark.s), 0, TAU);
    ctx.fillStyle = 'rgba(200,255,250,0.95)';
    ctx.fill();
  }

  // 地刺带：低矮，必须跳过去
  function drawSpike(o, rel) {
    if (rel < 2.2) return;
    var hw = o.w * 0.5;
    var zn = rel - o.d * 0.5, zf = rel + o.d * 0.5;
    if (zf < 2.3) return;
    box3D(o.x, hw, 0.02, 0.14, zn, zf, '#7f8aa0', '#525c72', '#333b4e');
    var n = 7;
    var zsp = Math.max(zn, 2.35);
    var span = hw * 2 - 0.14;
    for (var i = 0; i < n; i++) {
      var x = o.x - hw + 0.07 + (i + 0.5) * (span / n);
      var tip = proj(x, 0.66, zsp);
      var wl = proj(x - 0.082, 0.12, zsp);
      var wr = proj(x + 0.082, 0.12, zsp);
      poly([wl, wr, tip], i % 2 ? '#d5deee' : '#b7c2d6', 'rgba(240,248,255,0.55)', 1);
      var gl = proj(x, 0.3, zsp);
      ctx.beginPath();
      ctx.arc(gl.x, gl.y, Math.max(1, gl.s * 0.02), 0, TAU);
      ctx.fillStyle = 'rgba(255,120,140,0.75)';
      ctx.fill();
    }
  }

  // 摆锤：吊在横梁上左右摆，撞到会被砸
  function drawPendulum(o, rel) {
    if (rel < 2.2) return;
    var hx = o.x + Math.sin(G.t * o.sw + o.ph) * o.amp;
    o.headX = hx;
    var pivY = 3.0;
    var pv = proj(o.x, pivY, rel);
    var hd = proj(hx, 1.18, rel);
    if (pv.s <= 0 || hd.s <= 0) return;

    // 横梁
    var bl = proj(-4.0, pivY, rel), br = proj(4.0, pivY, rel);
    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y);
    ctx.lineTo(br.x, br.y);
    ctx.strokeStyle = 'rgba(118,148,186,0.85)';
    ctx.lineWidth = Math.max(2, 0.1 * pv.s);
    ctx.lineCap = 'round';
    ctx.stroke();

    // 链条
    ctx.beginPath();
    ctx.moveTo(pv.x, pv.y);
    ctx.lineTo(hd.x, hd.y);
    ctx.strokeStyle = 'rgba(205,220,240,0.9)';
    ctx.lineWidth = Math.max(1.4, 0.032 * pv.s);
    ctx.stroke();

    // 锤头
    var r = Math.max(3, 0.38 * hd.s);
    var g2 = ctx.createRadialGradient(hd.x - r * 0.3, hd.y - r * 0.3, r * 0.2, hd.x, hd.y, r);
    g2.addColorStop(0, '#ffb08a');
    g2.addColorStop(1, '#d24a2c');
    ctx.beginPath();
    ctx.arc(hd.x, hd.y, r, 0, TAU);
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,205,170,0.85)';
    ctx.lineWidth = Math.max(1.5, r * 0.16);
    ctx.stroke();
    // 锤头的金属箍
    ctx.beginPath();
    ctx.ellipse(hd.x, hd.y + r * 0.28, r * 0.86, r * 0.34, 0, 0, TAU);
    ctx.fillStyle = 'rgba(120,60,40,0.45)';
    ctx.fill();
    // 高光
    ctx.beginPath();
    ctx.arc(hd.x - r * 0.3, hd.y - r * 0.32, r * 0.22, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
  }

  // 移动路障：琥珀色，正面箭头提示会左右平移
  function drawSlider(o, rel) {
    var hw = 0.8, y0 = 0.05, y1 = 0.8;
    var zn = rel - 0.28, zf = rel + 0.28;
    if (zf < 2.3) return;
    box3D(o.x, hw, y0, y1, zn, zf, '#ffd98a', '#e8963a', '#a8641f');
    var f = frontFace(o.x, hw, y0, y1, Math.max(zn, 2.3));
    if (f) {
      for (var i = 0; i < 3; i++) {
        var u0 = 0.18 + i * 0.26;
        poly([fp(f, u0, 0.18), fp(f, u0 + 0.12, 0.18), fp(f, u0 + 0.06, 0.82), fp(f, u0 - 0.06, 0.82)], 'rgba(255,250,230,0.9)');
      }
      ctx.save();
      shadowGlow('rgba(255,190,90,0.9)', 12);
      ctx.strokeStyle = 'rgba(255,220,150,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(f.tl.x, f.tl.y);
      ctx.lineTo(f.tr.x, f.tr.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBarrier(o, rel) {
    var hw = 0.8, y0 = 0.05, y1 = 0.8;
    var zn = rel - 0.28, zf = rel + 0.28;
    if (zf < 2.3) return;
    box3D(o.x, hw, y0, y1, zn, zf, '#ff8f9b', '#d2334b', '#96212f');
    var f = frontFace(o.x, hw, y0, y1, Math.max(zn, 2.3));
    if (f) {
      for (var i = 0; i < 4; i++) {
        var u0 = i * 0.25 + 0.02;
        poly([fp(f, u0, 0.1), fp(f, u0 + 0.11, 0.1), fp(f, u0 + 0.11, 0.9), fp(f, u0, 0.9)], 'rgba(255,244,238,0.94)');
      }
      ctx.save();
      shadowGlow('rgba(255,120,140,0.9)', 12);
      ctx.strokeStyle = 'rgba(255,190,200,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(f.tl.x, f.tl.y);
      ctx.lineTo(f.tr.x, f.tr.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBeam(o, rel) {
    var hw = 0.95, y0 = 1.32, y1 = 1.78;
    var zn = rel - 0.25, zf = rel + 0.25;
    if (zf < 2.3) return;

    var postW = 0.085;
    box3D(o.x - hw + postW, postW, 0, y0, zn, zf, '#54e6d9', '#2b8079', '#1b5c57');
    box3D(o.x + hw - postW, postW, 0, y0, zn, zf, '#54e6d9', '#2b8079', '#1b5c57');

    ctx.save();
    shadowGlow('rgba(110,255,240,0.7)', 14);
    box3D(o.x, hw, y0, y1, zn, zf, '#3ad6c8', '#155454', '#0e3c3b');
    var f = frontFace(o.x, hw, y0, y1, Math.max(zn, 2.3));
    if (f) {
      poly([fp(f, 0, 0.04), fp(f, 1, 0.04), fp(f, 1, 0.24), fp(f, 0, 0.24)], 'rgba(150,255,246,0.95)');
      for (var i = 0; i < 5; i++) {
        var u0 = i * 0.2;
        poly([fp(f, u0, 0.3), fp(f, u0 + 0.06, 0.3), fp(f, u0 + 0.15, 0.92), fp(f, u0 + 0.09, 0.92)], 'rgba(70,225,208,0.5)');
      }
    }
    ctx.restore();
  }

  function drawRamp(o, rel) {
    var TH = TH_now();
    var isLaunch = o.type === 'launch';
    var edge = isLaunch ? '#ffd45f' : TH.accent;
    var hw = o.w * 0.5;
    var zNear = rel - o.d * 0.5;   // 近端：低，玩家从这里跑上坡
    var zFar = rel + o.d * 0.5;    // 远端：高，接无人机 / 弹射口
    if (zFar < 2.4) return;
    var top = o.y1;

    var nearL = proj(o.x - hw, 0, zNear), nearR = proj(o.x + hw, 0, zNear);
    var farL = proj(o.x - hw, top, zFar), farR = proj(o.x + hw, top, zFar);
