    var farL0 = proj(o.x - hw, 0, zFar), farR0 = proj(o.x + hw, 0, zFar);

    // 侧面
    poly([farL0, farL, nearL], isLaunch ? '#4a3410' : '#173a46');
    poly([farR0, farR, nearR], isLaunch ? '#32230a' : '#0f2a34');

    // 斜面（近端亮、远端暗）
    var g = ctx.createLinearGradient(0, nearL.y, 0, farL.y);
    if (isLaunch) {
      g.addColorStop(0, '#8a662a');
      g.addColorStop(1, '#d9a33c');
    } else {
      g.addColorStop(0, '#5a94a4');
      g.addColorStop(1, '#2c5568');
    }
    poly([nearL, nearR, farR, farL], g);

    // 霓虹边线
    ctx.save();
    shadowGlow(edge, 12);
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(nearL.x, nearL.y); ctx.lineTo(farL.x, farL.y);
    ctx.moveTo(nearR.x, nearR.y); ctx.lineTo(farR.x, farR.y);
    ctx.stroke();
    if (isLaunch) {
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(farL.x, farL.y); ctx.lineTo(farR.x, farR.y);
      ctx.stroke();
    }
    ctx.restore();

    // 横向纹路
    for (var i = 1; i <= 3; i++) {
      var f = i / 4;
      var zz = lerp(zNear, zFar, f);
      var a = proj(o.x - hw * 0.88, top * f, zz);
      var b = proj(o.x + hw * 0.88, top * f, zz);
      ctx.strokeStyle = 'rgba(210,245,255,0.28)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    // 上坡箭头（朝坡顶）
    var arrows = isLaunch ? 2 : 1;
    for (var k = 0; k < arrows; k++) {
      var f0 = (isLaunch ? 0.26 : 0.34) + k * 0.32;
      var f1 = Math.min(0.94, f0 + 0.2);
      var aL = proj(o.x - hw * 0.5, top * f0, lerp(zNear, zFar, f0));
      var aR = proj(o.x + hw * 0.5, top * f0, lerp(zNear, zFar, f0));
      var aC = proj(o.x, top * f1, lerp(zNear, zFar, f1));
      ctx.strokeStyle = edge;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = isLaunch ? 3.4 : 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(aL.x, aL.y);
      ctx.lineTo(aC.x, aC.y);
      ctx.lineTo(aR.x, aR.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawDrone(o, rel) {
    var TH = TH_now();
    var hw = o.w * 0.5;
    var zn = rel - o.d * 0.5, zf = rel + o.d * 0.5;
    if (zf < 2.4) return;
    var top = o.y1, bot = o.y0;

    // 地面投影
    var gnd = proj(o.x, 0.02, rel);
    ctx.globalAlpha = 0.26 * A_MUL;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(gnd.x, gnd.y, hw * gnd.s * 0.85, 0.32 * gnd.s * 0.5, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = A_MUL;

    // 机身
    box3D(o.x, hw, bot, top, zn, zf, '#d7f2fb', '#274f60', '#173b49');

    // 顶面霓虹边
    var f = frontFace(o.x, hw, top - 0.06, top, Math.max(zn, 2.3));
    if (f) poly([f.bl, f.br, f.tr, f.tl], TH.accent);

    // 底部光晕
    var u = proj(o.x, bot - 0.02, rel);
    ctx.save();
    ctx.globalAlpha = 0.28 * A_MUL;
    shadowGlow(TH.accent, 26);
    ctx.fillStyle = TH.accent;
    ctx.beginPath();
    ctx.ellipse(u.x, u.y, hw * u.s * 0.8, 0.2 * u.s, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 四个旋翼
    var spin = G.t * 24;
    for (var i = 0; i < 4; i++) {
      var sx = (i % 2 ? 1 : -1) * hw * 0.8;
      var sz = (i < 2 ? 1 : -1) * o.d * 0.34;
      var rp = proj(o.x + sx, bot - 0.13, rel + sz);
      var tp = proj(o.x + sx, top, rel + sz);
      if (rp.s <= 0 || rp.s > 900) continue;
      var rr = 0.24 * rp.s;

      ctx.strokeStyle = 'rgba(170,220,235,0.45)';
      ctx.lineWidth = Math.max(1, 0.022 * rp.s);
      ctx.beginPath();
      ctx.moveTo(tp.x, tp.y);
      ctx.lineTo(rp.x, rp.y);
      ctx.stroke();

      ctx.globalAlpha = 0.22 * A_MUL;
      ctx.fillStyle = TH.accent;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rr * 1.6, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = A_MUL;

      ctx.strokeStyle = 'rgba(215,248,255,0.6)';
      ctx.lineWidth = Math.max(1, 0.028 * rp.s);
      for (var k = 0; k < 2; k++) {
        var a = spin + k * Math.PI / 2 + i * 1.1;
        ctx.beginPath();
        ctx.moveTo(rp.x - Math.cos(a) * rr, rp.y - Math.sin(a) * rr * 0.38);
        ctx.lineTo(rp.x + Math.cos(a) * rr, rp.y + Math.sin(a) * rr * 0.38);
        ctx.stroke();
      }
    }

    // 顶部信号灯
    var lp = proj(o.x, top + 0.02, rel);
    var blink = 0.35 + 0.65 * Math.abs(Math.sin(G.t * 3.4));
    ctx.globalAlpha = blink * A_MUL;
    ctx.fillStyle = TH.accent2;
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, Math.max(1.2, 0.07 * lp.s), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = A_MUL;
  }

  function drawBlock(o, rel) {
    var hw = 0.78, y0 = 0, y1 = 2.0;
    var zn = rel - 0.45, zf = rel + 0.45;
    if (zf < 2.3) return;
    box3D(o.x, hw, y0, y1, zn, zf, '#4a4275', '#241e40', '#312a55');
    var f = frontFace(o.x, hw, y0, y1, Math.max(zn, 2.3));
    if (!f) return;
    var pf = frontFace(o.x, hw * 0.7, 0.42, 1.72, Math.max(zn, 2.3));
    if (pf) {
      ctx.save();
      shadowGlow('rgba(255,110,190,0.85)', 16);
      poly([pf.bl, pf.br, pf.tr, pf.tl], 'rgba(255,110,190,0.55)', 'rgba(255,180,225,0.95)', 2);
      ctx.restore();
      for (var i = 0; i < 4; i++) {
        var u0 = i * 0.25 + 0.03;
        poly([fp(pf, u0, 0.04), fp(pf, u0 + 0.1, 0.04), fp(pf, u0 + 0.1, 0.2), fp(pf, u0, 0.2)], 'rgba(255,214,92,0.7)');
      }
    }
    // 顶面警示条
    ctx.globalAlpha = 0.65 * A_MUL;
    poly([
      fp(f, 0.1, 1.0), fp(f, 0.9, 1.0),
      fp(f, 0.9, 0.92), fp(f, 0.1, 0.92)
    ], '#ffd15c');
    ctx.globalAlpha = A_MUL;
  }

  // ---------- 金币 ----------
  function drawCoin(c, rel) {
    if (rel < 2.3) return;
    var p = proj(c.x, c.y, rel);
    var r = 0.27 * p.s;
    if (r < 0.6 || p.s > 1200) return;
    var wob = Math.abs(Math.cos(c.spin));
    var rx = r * (0.26 + 0.74 * wob);

    ctx.save();
    ctx.globalAlpha = 0.14 * A_MUL;
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.45, 0, TAU); ctx.fill();
    ctx.globalAlpha = A_MUL;

    var g = ctx.createLinearGradient(p.x - rx, p.y - r, p.x + rx, p.y + r);
    g.addColorStop(0, '#fff5c2');
    g.addColorStop(0.45, '#ffd45f');
    g.addColorStop(1, '#e39a10');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, Math.max(0.8, rx), r, 0, 0, TAU); ctx.fill();
    if (rx > 2.5) {
      ctx.strokeStyle = 'rgba(255,246,200,0.9)';
      ctx.lineWidth = Math.max(1, r * 0.09);
      ctx.stroke();
    }
    if (wob > 0.42 && r > 5) {
      ctx.globalAlpha = ((wob - 0.42) / 0.58) * A_MUL;
      ctx.fillStyle = '#7a4a00';
      ctx.font = '700 ' + Math.round(r * 1.15) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♪', p.x, p.y + r * 0.06);
      ctx.globalAlpha = A_MUL;
    }
    ctx.restore();
  }

  function drawShieldPickup(sp, rel) {
    if (rel < 2.4) return;
    var bobY = sp.y + Math.sin(G.t * 2.2 + sp.z * 0.35) * 0.06;
    var p = proj(sp.x, bobY, rel);
    var r = 0.3 * p.s;
    if (r < 1.2) return;

    ctx.save();
    var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
    g.addColorStop(0, 'rgba(120,220,255,0.34)');
    g.addColorStop(0.6, 'rgba(90,190,255,0.1)');
    g.addColorStop(1, 'rgba(90,190,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.2, 0, TAU); ctx.fill();

    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = G.t * 0.8 + i * TAU / 6 - Math.PI / 2;
      var px2 = p.x + Math.cos(a) * r, py2 = p.y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    var gg = ctx.createLinearGradient(p.x, p.y - r, p.x, p.y + r);
    gg.addColorStop(0, '#f2ffff');
    gg.addColorStop(0.45, '#9febff');
    gg.addColorStop(1, '#3ba9e2');
    ctx.fillStyle = gg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(235,255,255,0.9)';
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x, p.y - r * 0.48);
    ctx.lineTo(p.x + r * 0.34, p.y - r * 0.24);
    ctx.lineTo(p.x + r * 0.34, p.y + r * 0.1);
    ctx.quadraticCurveTo(p.x + r * 0.28, p.y + r * 0.44, p.x, p.y + r * 0.56);
    ctx.quadraticCurveTo(p.x - r * 0.28, p.y + r * 0.44, p.x - r * 0.34, p.y + r * 0.1);
    ctx.lineTo(p.x - r * 0.34, p.y - r * 0.24);
    ctx.closePath();
    ctx.fillStyle = 'rgba(22,86,128,0.9)';
    ctx.fill();
    ctx.restore();
  }

  // ---------- 强化道具（磁铁 / 翅膀） ----------
  function drawPowerPickup(pu, rel) {
    if (rel < 2.4) return;
    var bobY = pu.y + Math.sin(G.t * 2.4 + pu.z * 0.3) * 0.07;
    var p = proj(pu.x, bobY, rel);
    var r = 0.3 * p.s;
    if (r < 1.2) return;
    var isMag = pu.kind === 'magnet';
    var c1 = isMag ? 'rgba(205,120,255,' : 'rgba(140,230,255,';
    ctx.save();
    var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.3);
    g.addColorStop(0, c1 + '0.36)');
    g.addColorStop(0.6, c1 + '0.1)');
    g.addColorStop(1, c1 + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.3, 0, TAU); ctx.fill();

    if (isMag) {
      // 磁铁：U 形马蹄
      ctx.lineWidth = Math.max(1.6, r * 0.34);
      ctx.lineCap = 'butt';
      ctx.strokeStyle = '#c97bff';
      ctx.beginPath();
      ctx.arc(p.x, p.y + r * 0.12, r * 0.62, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.fillStyle = '#ff5f7a';
      ctx.beginPath(); ctx.arc(p.x - r * 0.56, p.y + r * 0.44, r * 0.22, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8fd8ff';
      ctx.beginPath(); ctx.arc(p.x + r * 0.56, p.y + r * 0.44, r * 0.22, 0, TAU); ctx.fill();
    } else {
      // 翅膀：两片羽翼
      ctx.fillStyle = 'rgba(190,240,255,0.92)';
      for (var i = 0; i < 2; i++) {
        var s2 = i === 0 ? -1 : 1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(s2 * 0.5 + Math.sin(G.t * 3 + i) * 0.08);
        ctx.beginPath();
        ctx.ellipse(s2 * r * 0.5, 0, r * 0.62, r * 0.3, s2 * 0.6, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 角色 ----------
  function limb(a, b, w, color) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.8, w);
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawPlayerShadow() {
    var P = G.player;
    var p = proj(P.x, (P.support || 0) + 0.015, PLAYER_Z);
    var k = clamp(1 - (P.y - (P.support || 0)) * 0.32, 0.35, 1);
    ctx.save();
    ctx.globalAlpha = 0.3 * k;
    ctx.fillStyle = '#05030c';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 0.4 * p.s * k, 0.12 * p.s * k, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawCharacter() {
    var P = G.player;
    var px = P.x, py = P.y;
    var crouch = clamp(P.crouch, 0, 1);
    var ph = P.phase;
    var dead = P.dead;
    var sBase = FOCAL / PLAYER_Z;
    var k = 1 - 0.42 * crouch;
    var bob = (P.onGround && !dead) ? Math.sin(ph * 2) * 0.018 * (1 - crouch * 0.6) : 0;

    function sk(v) { return v * k + bob; }
    function P2(x, y, dz) { return proj(px + x, py + y, PLAYER_Z + (dz || 0)); }
    function avgS(a, b) { return (a.s + b.s) * 0.5; }

    var hipY = sk(0.84), waistY = sk(0.98), shoulderY = sk(1.30);
    var headY = sk(1.545);
    var headR = 0.106;

    var SK = SKINS[G.skin] || SKINS[0];
    var skin = '#ffe6d8', skinD = '#eebba9';
    var hairG = SK.hairG, hair = SK.hair, hairM = SK.hairM, hairD = SK.hairD;
    var shirt = SK.shirt, shirtD = SK.shirtD;
    var skirtTop = SK.skirtTop, skirtC = SK.skirtC;
    var bootC = SK.boot, dark = SK.dark;
    var teal = SK.accent, tealL = SK.accentL, red = SK.tie;

    var pivot = proj(px, py + 0.84, PLAYER_Z);

    ctx.save();
    if (dead) {
      ctx.translate(pivot.x, pivot.y);
      ctx.rotate(P.tumble);
      ctx.translate(-pivot.x, -pivot.y);
    } else if (P.onGround) {
      var sway = Math.sin(ph) * 0.013;
      ctx.translate(pivot.x, pivot.y);
      ctx.rotate(sway);
      // 落地压缩：先蹲一下再弹回
      if (P.landT > 0) {
        var lq = clamp(P.landT / 0.18, 0, 1);
        ctx.scale(1 + 0.11 * lq, 1 - 0.13 * lq);
      }
      ctx.translate(-pivot.x, -pivot.y);
    } else {
      // 腾空：起跳瞬间纵向拉伸
      if (P.stretchT > 0) {
        var sq2 = clamp(P.stretchT / 0.14, 0, 1);
        ctx.translate(pivot.x, pivot.y);
        ctx.scale(1 - 0.07 * sq2, 1 + 0.10 * sq2);
        ctx.translate(-pivot.x, -pivot.y);
      }
    }

    // 背后柔光
    var ar = 0.92 * sBase;
    var aura = ctx.createRadialGradient(pivot.x, pivot.y, 0, pivot.x, pivot.y, ar);
    aura.addColorStop(0, 'rgba(' + SK.aura + ',0.14)');
    aura.addColorStop(0.5, 'rgba(' + SK.aura + ',0.05)');
    aura.addColorStop(1, 'rgba(' + SK.aura + ',0)');
    ctx.beginPath(); ctx.arc(pivot.x, pivot.y, ar, 0, TAU);
    ctx.fillStyle = aura; ctx.fill();

    // ---------------- 双马尾（三层缎带） ----------------
    function drawTail(side) {
      var t = G.t * 1.25 + ph * 0.1;
      var sw = Math.sin(t + side * 0.9);
      var x0 = side * 0.092, y0 = headY + 0.03;
      var x1 = side * (0.27 + sw * 0.03), y1 = headY - 0.12;
      var x2 = side * (0.33 + sw * 0.05), y2 = headY - 0.6;
      var x3 = side * (0.24 + sw * 0.07), y3 = headY - 1.2;
      var N = 22, base = [];

      for (var i = 0; i <= N; i++) {
        var u = i / N;
        var x = cb(x0, x1, x2, x3, u);
        var y = cb(y0, y1, y2, y3, u);
        var xa = cb(x0, x1, x2, x3, Math.min(1, u + 0.008));
        var ya = cb(y0, y1, y2, y3, Math.min(1, u + 0.008));
        var dx = xa - x, dy = ya - y;
        var len = Math.sqrt(dx * dx + dy * dy) || 1e-4;
        base.push({ x: x, y: y, nx: -dy / len, ny: dx / len, u: u });
      }

      var topY = P2(0, y0 + 0.1).y, botY = P2(0, y3).y;

      function strand(wScale, uEnd, off, fill) {
        var A = [], B = [];
        var n = Math.max(2, Math.round(N * uEnd));
        for (var j = 0; j <= n; j++) {
          var uu = (j / n) * uEnd;
          var x = cb(x0, x1, x2, x3, uu);
          var y = cb(y0, y1, y2, y3, uu);
          var xa = cb(x0, x1, x2, x3, Math.min(1, uu + 0.01));
          var ya = cb(y0, y1, y2, y3, Math.min(1, uu + 0.01));
          var dx = xa - x, dy = ya - y, len = Math.sqrt(dx * dx + dy * dy) || 1e-4;
          var nx = -dy / len, ny = dx / len;
          var w = 0.096 * Math.pow(Math.max(0, 1 - uu), 0.62) * Math.min(1, uu * 4.2) * wScale *
            (1 + 0.3 * Math.sin(Math.PI * Math.min(1, uu))) * (1 + 0.09 * Math.sin(uu * 11 + t * 1.6));
          var zz = -0.03 * uu;
          A.push(P2(x + nx * (w + off), y + ny * (w + off), zz));
          B.push(P2(x - nx * (w - off), y - ny * (w - off), zz));
        }
        poly(A.concat(B.reverse()), fill);
      }

      strand(1.42, 1.0, 0, 'rgba(10,60,60,0.42)');
      var tg = ctx.createLinearGradient(0, topY, 0, botY);
      tg.addColorStop(0, hairG);
      tg.addColorStop(0.26, hair);
      tg.addColorStop(0.7, hairM);
      tg.addColorStop(1, hairD);
      strand(1.0, 1.0, 0, tg);
      strand(0.62, 0.84, side * 0.012, 'rgba(15,120,114,0.85)');
      strand(0.34, 1.02, -side * 0.01, 'rgba(205,255,250,0.32)');

      // 发绳
      var tie = P2(side * 0.1, headY + 0.045);
      ctx.save();
      ctx.translate(tie.x, tie.y);
      ctx.rotate(side * 0.3);
      var ts = Math.max(3, headR * tie.s * 0.42);
      ctx.fillStyle = '#0e1220';
      ctx.fillRect(-ts / 2, -ts / 2, ts, ts);
      ctx.fillStyle = side > 0 ? red : '#e8f9ff';
      ctx.fillRect(-ts / 2, -ts / 2, ts * 0.5, ts);
      ctx.restore();
    }
    drawTail(-1);
    drawTail(1);

    // ---------------- 腿 ----------------
    var stride = Math.sin(ph);
    for (var li = 0; li < 2; li++) {
      var ls = li === 0 ? -1 : 1;
      var st = stride * ls;
      var fz, lift;
      if (crouch > 0.45) { fz = 0.52; lift = 0.03; }
      else if (!P.onGround && !dead) { fz = 0.12 * ls; lift = 0.16 + 0.07 * Math.max(0, st); }
      else { fz = st * 0.18; lift = Math.max(0, st) * 0.17; }

      var hip = P2(ls * 0.072, hipY, 0);
      var foot = P2(ls * 0.09, lift + 0.035, fz);
      var bootTopY = sk(0.40);
      var q = clamp((hipY - bootTopY) / Math.max(0.03, hipY - lift), 0, 1);
      var knee = P2(ls * 0.08, lerp(hipY, lift + 0.035, q), lerp(0, fz, q));
      var kneeUp = P2(ls * 0.08, lerp(hipY, lift + 0.035, Math.min(1, q + 0.13)), lerp(0, fz, Math.min(1, q + 0.13)));

      limb(hip, knee, 0.104 * avgS(hip, knee), skin);
      limb(knee, foot, 0.12 * avgS(knee, foot), bootC);
      limb(knee, kneeUp, 0.048 * knee.s, teal);
      // 靴口高光
      ctx.beginPath();
      ctx.arc(kneeUp.x, kneeUp.y, 0.026 * kneeUp.s, 0, TAU);
      ctx.fillStyle = 'rgba(200,255,252,0.7)';
      ctx.fill();
      // 鞋
      ctx.beginPath();
      ctx.ellipse(foot.x, foot.y, 0.055 * foot.s, 0.034 * foot.s, 0, 0, TAU);
      ctx.fillStyle = dark;
      ctx.fill();
    }

    // ---------------- 裙子 ----------------
    var stL = P2(-0.128, waistY - 0.012), stR = P2(0.128, waistY - 0.012);
    var hemY = sk(SK.skirtLen);
    var hemPts = [];
    var NH = 8;
    for (var hi = 0; hi <= NH; hi++) {
      var hu = hi / NH;
      hemPts.push(P2(lerp(-0.245, 0.245, hu), hemY + (hi % 2 ? 0.03 : 0)));
    }
    var sg = ctx.createLinearGradient(0, stL.y, 0, hemPts[0].y);
    sg.addColorStop(0, skirtTop);
    sg.addColorStop(1, skirtC);
    poly([stL].concat(hemPts).concat([stR]), sg);
    ctx.globalAlpha = 0.35;
    poly([P2(0.02, waistY - 0.02), stR, hemPts[NH], P2(0.02, hemY)], SK.skirtLow);
    ctx.globalAlpha = 1;

    for (var pi2 = -3; pi2 <= 3; pi2++) {
      var bx2 = pi2 * 0.055;
      limb(P2(bx2 * 0.9, waistY - 0.02), P2(bx2 * 1.75, hemY - 0.005), 1.1, 'rgba(120,230,225,0.12)');
    }
    for (var hi2 = 0; hi2 < NH; hi2++) {
      limb(hemPts[hi2], hemPts[hi2 + 1], 0.028 * hemPts[hi2].s, 'rgba(63,210,201,0.9)');
    }

    // ---------------- 上身 ----------------
    var sL = P2(-0.142, shoulderY), sR = P2(0.142, shoulderY);
    var wL = P2(-0.098, waistY), wR = P2(0.098, waistY);
    var tg2 = ctx.createLinearGradient(wL.x, 0, wR.x, 0);
    tg2.addColorStop(0, shirtD);
    tg2.addColorStop(0.32, shirt);
    tg2.addColorStop(0.72, shirt);
    tg2.addColorStop(1, shirtD);
    poly([wL, wR, sR, sL], tg2);
    ctx.globalAlpha = 0.35;
    poly([P2(0.03, shoulderY - 0.01), sR, wR, P2(0.03, waistY)], shirtD);
    ctx.globalAlpha = 1;
    limb(P2(-0.142, shoulderY - 0.02), P2(0.142, shoulderY - 0.02), 0.032 * sL.s, 'rgba(175,198,224,0.55)');
    limb(P2(-0.112, shoulderY - 0.05), P2(0.112, shoulderY - 0.05), 0.045 * sL.s, teal);
    limb(P2(-0.106, waistY + 0.02), P2(0.106, waistY + 0.02), 0.03 * wL.s, teal);

    // 蝴蝶结（第二套皮肤）
    if (SK.bow) {
      var bowP = P2(0, waistY + 0.02);
      var bw = 0.085 * bowP.s, bh = 0.055 * bowP.s;
      ctx.fillStyle = red;
      ctx.beginPath();
      ctx.ellipse(bowP.x - bw * 0.9, bowP.y, bw, bh, -0.4, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bowP.x + bw * 0.9, bowP.y, bw, bh, 0.4, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(bowP.x, bowP.y, bw * 0.38, 0, TAU);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    // ---------------- 手臂 ----------------
    for (var ai = 0; ai < 2; ai++) {
      var as = ai === 0 ? -1 : 1;
      var sw2 = Math.sin(ph) * as * 1.35;
      var air = (P.onGround || dead) ? 0 : 1;
      var sh = P2(as * 0.14, shoulderY - 0.015);
      var elbow = P2(as * (0.196 + 0.02 * Math.abs(sw2)), sk(1.02) + air * 0.1 + Math.abs(sw2) * 0.02, -sw2 * 0.17);
      var hand = P2(as * (0.205 + 0.05 * air), sk(0.82) + air * 0.5 + Math.max(0, sw2) * 0.11, -sw2 * 0.34);
      var cuff = P2(as * 0.2, sk(0.97) + air * 0.11, -sw2 * 0.14);

      limb(sh, elbow, 0.078 * avgS(sh, elbow), skin);
      limb(elbow, hand, 0.088 * avgS(elbow, hand), bootC);
      limb(elbow, cuff, 0.028 * elbow.s, teal);
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, 0.033 * hand.s, 0, TAU);
      ctx.fillStyle = skin;
      ctx.fill();
    }

    // ---------------- 脖子 / 头 ----------------
    limb(P2(0, headY - 0.075), P2(0, shoulderY + 0.02), 0.058 * sBase, skinD);

    var hp = P2(0, headY);
    var hr = headR * sBase;

    // 后颈发
    ctx.beginPath();
    ctx.moveTo(hp.x - hr * 0.98, hp.y - hr * 0.06);
    ctx.quadraticCurveTo(hp.x, hp.y + hr * 1.42, hp.x + hr * 0.98, hp.y - hr * 0.06);
    ctx.fillStyle = hairD;
    ctx.fill();

    // 侧发（垂在脸颊两侧）
    for (var si2 = 0; si2 < 2; si2++) {
      var ss2 = si2 === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.ellipse(hp.x + ss2 * hr * 0.92, hp.y + hr * 0.26, hr * 0.17, hr * 0.5, ss2 * 0.2, 0, TAU);
      ctx.fillStyle = hairM;
      ctx.fill();
    }

    // 头在肩上的投影
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.ellipse(hp.x, hp.y + hr * 1.28, hr * 0.95, hr * 0.34, 0, 0, TAU);
    ctx.fillStyle = '#0a2233';
    ctx.fill();
    ctx.globalAlpha = 1;

    // 头发主体
    var hg2 = ctx.createRadialGradient(hp.x - hr * 0.45, hp.y - hr * 0.5, hr * 0.06, hp.x, hp.y, hr * 1.2);
    hg2.addColorStop(0, hairG);
    hg2.addColorStop(0.32, hair);
    hg2.addColorStop(0.75, hairM);
    hg2.addColorStop(1, hairD);
    ctx.beginPath();
    ctx.ellipse(hp.x, hp.y - hr * 0.02, hr * 1.07, hr * 1.14, 0, 0, TAU);
    ctx.fillStyle = hg2;
    ctx.fill();
    ctx.strokeStyle = 'rgba(9,55,55,0.4)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // 发丝纹理
    for (var hs3 = 0; hs3 < 2; hs3++) {
      var hsd = hs3 === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(hp.x + hsd * hr * 0.12, hp.y - hr * 0.82);
      ctx.quadraticCurveTo(hp.x + hsd * hr * 0.72, hp.y - hr * 0.18, hp.x + hsd * hr * 0.66, hp.y + hr * 0.62);
      ctx.strokeStyle = 'rgba(10,95,90,0.3)';
      ctx.lineWidth = Math.max(1, hr * 0.07);
      ctx.stroke();
    }

    // 发旋高光
    ctx.beginPath();
    ctx.ellipse(hp.x - hr * 0.28, hp.y - hr * 0.52, hr * 0.36, hr * 0.14, -0.5, 0, TAU);
    ctx.fillStyle = 'rgba(232,255,252,0.45)';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(hp.x + hr * 0.5, hp.y + hr * 0.3, hr * 0.16, hr * 0.3, 0.5, 0, TAU);
    ctx.fillStyle = 'rgba(190,255,248,0.16)';
    ctx.fill();

    // 耳机
    ctx.beginPath();
    ctx.arc(hp.x, hp.y - hr * 0.06, hr * 0.98, Math.PI * 1.1, Math.PI * 1.9);
    ctx.strokeStyle = '#12161f';
    ctx.lineWidth = Math.max(1.8, hr * 0.21);
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hp.x, hp.y - hr * 0.06, hr * 0.985, Math.PI * 1.26, Math.PI * 1.74);
    ctx.strokeStyle = 'rgba(80,225,215,0.8)';
    ctx.lineWidth = Math.max(1, hr * 0.07);
    ctx.stroke();

    for (var ei2 = 0; ei2 < 2; ei2++) {
      var es2 = ei2 === 0 ? -1 : 1;
      var ex2 = hp.x + es2 * hr * 0.9, ey2 = hp.y + hr * 0.08;
      ctx.beginPath(); ctx.arc(ex2, ey2, hr * 0.24, 0, TAU); ctx.fillStyle = '#11151f'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, hr * 0.16, 0, TAU); ctx.fillStyle = teal; ctx.fill();
      ctx.beginPath(); ctx.arc(ex2 - hr * 0.04, ey2 - hr * 0.05, hr * 0.055, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
    }

    // 鬓发（垂在头两侧的发尾）
    for (var hi3 = 0; hi3 < 2; hi3++) {
      var hs = hi3 === 0 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(hp.x + hs * hr * 0.5, hp.y + hr * 0.12);
      ctx.quadraticCurveTo(hp.x + hs * hr * 1.08, hp.y + hr * 0.55, hp.x + hs * hr * 0.8, hp.y + hr * 1.12);
      ctx.quadraticCurveTo(hp.x + hs * hr * 0.86, hp.y + hr * 0.55, hp.x + hs * hr * 0.34, hp.y + hr * 0.16);
      ctx.closePath();
      ctx.fillStyle = hairM;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hp.x + hs * hr * 0.56, hp.y + hr * 0.2);
      ctx.quadraticCurveTo(hp.x + hs * hr * 0.9, hp.y + hr * 0.6, hp.x + hs * hr * 0.72, hp.y + hr * 0.96);
      ctx.quadraticCurveTo(hp.x + hs * hr * 0.72, hp.y + hr * 0.55, hp.x + hs * hr * 0.36, hp.y + hr * 0.24);
      ctx.closePath();
      ctx.fillStyle = teal;
      ctx.fill();
    }

    // 呆毛
    ctx.beginPath();
    ctx.moveTo(hp.x - hr * 0.06, hp.y - hr * 0.9);
    ctx.quadraticCurveTo(hp.x - hr * 0.16, hp.y - hr * 2.05, hp.x + hr * 0.52, hp.y - hr * 1.72);
    ctx.quadraticCurveTo(hp.x + hr * 0.06, hp.y - hr * 1.5, hp.x + hr * 0.06, hp.y - hr * 0.86);
    ctx.closePath();
    ctx.fillStyle = hair;
    ctx.fill();
    ctx.strokeStyle = 'rgba(9,55,55,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ---------------- 死亡表情：撞到啦（>_<） ----------------
    if (G.state === 'dying' || G.state === 'dead') {
      var fy = hp.y + hr * 0.30;
      var ex = hr * 0.34, ey = hr * 0.17;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = Math.max(1.4, hr * 0.11);
      ctx.lineCap = 'round';
      // 左眼 ">"
      ctx.beginPath();
      ctx.moveTo(hp.x - ex - ey * 0.9, fy - ey);
      ctx.lineTo(hp.x - ex, fy);
      ctx.lineTo(hp.x - ex - ey * 0.9, fy + ey);
      ctx.stroke();
      // 右眼 "<"
      ctx.beginPath();
      ctx.moveTo(hp.x + ex + ey * 0.9, fy - ey);
      ctx.lineTo(hp.x + ex, fy);
      ctx.lineTo(hp.x + ex + ey * 0.9, fy + ey);
      ctx.stroke();
      // 张嘴
      ctx.fillStyle = 'rgba(60,20,40,0.85)';
      ctx.beginPath();
      ctx.ellipse(hp.x, hp.y + hr * 0.66, hr * 0.16, hr * 0.12, 0, 0, TAU);
      ctx.fill();
      // 冷汗一滴
      ctx.fillStyle = 'rgba(140,220,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(hp.x + hr * 0.62, hp.y - hr * 0.08, hr * 0.07, hr * 0.11, 0.3, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();

    // ---------------- 护盾力场 ----------------
    if (G.shields > 0 && !dead) {
      var bc = proj(px, py + 0.82, PLAYER_Z);
      var R = 0.74 * sBase;
      var pulse = 0.5 + 0.5 * Math.sin(G.t * 3.2);
      var bg2 = ctx.createRadialGradient(bc.x, bc.y, R * 0.6, bc.x, bc.y, R * 1.15);
      bg2.addColorStop(0, 'rgba(90,200,255,0)');
      bg2.addColorStop(0.88, 'rgba(120,215,255,' + (0.05 + pulse * 0.03) + ')');
      bg2.addColorStop(1, 'rgba(170,240,255,0)');
      ctx.beginPath(); ctx.arc(bc.x, bc.y, R * 1.15, 0, TAU);
      ctx.fillStyle = bg2; ctx.fill();

      ctx.beginPath();
      ctx.ellipse(bc.x, bc.y, R, R * 1.14, 0, 0, TAU);
      ctx.strokeStyle = 'rgba(150,235,255,' + (0.22 + pulse * 0.22) + ')';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(bc.x, bc.y, R * 0.9, R * 1.02, 0, Math.PI * 1.12, Math.PI * 1.62);
      ctx.strokeStyle = 'rgba(230,255,255,0.38)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // ---------- 世界对象排序绘制 ----------
  function drawWorld() {
    var items = [];
    var i;

    var PERIOD = 13;
    var z0 = Math.floor((G.camZ + 200) / PERIOD) * PERIOD;
    for (; z0 > G.camZ + 2.4; z0 -= PERIOD) {
      var relP = z0 - G.camZ;
      if (relP > 195) continue;
      drawPost(-4.75, relP);
      drawPost(4.75, relP);
    }

    // 路边装饰拱门已移除（挡视线）；立柱路灯保留。

    for (i = 0; i < G.obs.length; i++) {
      (function (o) {
        var rel = o.z - G.camZ;
        var ext = (o.d || 0.6) * 0.5;
        if (rel + ext < 3.0 || rel - ext > 220) return;
        var al = clamp((rel + ext - 3.0) / 4.2, 0, 1);
        items.push({
          z: rel, fn: function () {
            ctx.save();
            A_MUL = al;
            ctx.globalAlpha = al;
            drawObstacle(o, rel);
            ctx.restore();
            A_MUL = 1;
          }
        });
      })(G.obs[i]);
    }

    for (i = 0; i < G.coinList.length; i++) {
      (function (c) {
        if (c.taken) return;
        var rel = c.z - G.camZ;
        if (rel < 3.2 || rel > 220) return;
        var al = clamp((rel - 3.2) / 3.6, 0, 1);
        items.push({
          z: rel, fn: function () {
            ctx.save();
            A_MUL = al;
            ctx.globalAlpha = al;
            drawCoin(c, rel);
            ctx.restore();
            A_MUL = 1;
          }
        });
      })(G.coinList[i]);
    }

    for (i = 0; i < G.shieldList.length; i++) {
      (function (sp) {
        if (sp.taken) return;
        var rels = sp.z - G.camZ;
        if (rels < 3.0 || rels > 220) return;
        var als = clamp((rels - 3.0) / 3.6, 0, 1);
        items.push({
          z: rels, fn: function () {
            ctx.save();
            A_MUL = als;
            ctx.globalAlpha = als;
            drawShieldPickup(sp, rels);
            ctx.restore();
            A_MUL = 1;
          }
        });
      })(G.shieldList[i]);
    }

    for (i = 0; i < G.powerList.length; i++) {
      (function (pu) {
        if (pu.taken) return;
        var relp = pu.z - G.camZ;
        if (relp < 3.0 || relp > 220) return;
        var alp = clamp((relp - 3.0) / 3.6, 0, 1);
        items.push({
          z: relp, fn: function () {
            ctx.save();
            A_MUL = alp;
            ctx.globalAlpha = alp;
            drawPowerPickup(pu, relp);
            ctx.restore();
            A_MUL = 1;
          }
        });
      })(G.powerList[i]);
    }

    items.push({ z: PLAYER_Z, fn: drawCharacter });
    items.sort(function (a, b) { return b.z - a.z; });
    for (i = 0; i < items.length; i++) items[i].fn();
  }

  // ---------- 粒子 ----------
  function drawParticles() {
    for (var i = 0; i < G.parts.length; i++) {
      var q = G.parts[i];
      var a = clamp(q.life / q.max, 0, 1);
      ctx.globalAlpha = a;
      if (q.text) {
        ctx.fillStyle = q.color;
        ctx.font = '900 ' + q.size + 'px ' + FONT;
        shadowGlow('rgba(0,0,0,0.55)', 6);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(q.text, q.x, q.y);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = q.color;
        ctx.beginPath();
        ctx.arc(q.x, q.y, Math.max(0.5, q.size * a), 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- UI ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawVignette() {
    var g = cachedGrad('vig', function () {
      var gg = ctx.createRadialGradient(W * 0.5, H * 0.55, Math.min(W, H) * 0.22, W * 0.5, H * 0.55, Math.max(W, H) * 0.78);
      gg.addColorStop(0, 'rgba(0,0,0,0)');
      gg.addColorStop(0.7, 'rgba(0,0,0,0.18)');
      gg.addColorStop(1, 'rgba(0,0,0,0.6)');
      return gg;
    });
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawHUD() {
    if (G.state === 'menu') { drawMuteButton(); return; }
    var padT = Math.max(16, Math.min(W, H) * 0.035) + SAFE.t; // 顶部留出刘海/状态栏
    var padB = Math.max(16, Math.min(W, H) * 0.035) + SAFE.b; // 底部留出 Home 指示条
    var padR = Math.max(16, Math.min(W, H) * 0.035) + SAFE.r;
    var pad = padT;
    var small = clamp(W * 0.011, 10, 13);
    var big = clamp(W * 0.028, 22, 34);

    var narrowHud = W < 640;

    if (narrowHud) {
      // ===== 手机布局：金币左上 · 分数居中 · 护盾右上 =====
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      var coinTxt = String(G.coins);
      ctx.fillStyle = '#ffd45f';
      ctx.font = '800 ' + big + 'px ' + FONT;
      ctx.save();
      shadowGlow('rgba(255,200,80,0.45)', 10);
      ctx.fillText(coinTxt, pad + big * 0.72, pad + small * 0.5);
      ctx.restore();
      var ciX = pad + big * 0.26, ciY = pad + small * 0.5 + big * 0.52;
      ctx.beginPath();
      ctx.arc(ciX, ciY, Math.max(5, big * 0.26), 0, TAU);
      ctx.fillStyle = '#ffd45f';
      ctx.fill();
      ctx.fillStyle = '#8a5a00';
      ctx.font = '800 ' + Math.round(Math.max(8, big * 0.34)) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♪', ciX, ciY + 1);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(170,240,235,0.5)';
      ctx.font = '700 ' + Math.round(small * 0.92) + 'px ' + FONT;
      ctx.fillText('BEST ' + String(G.best).padStart(6, '0'), pad, pad + small * 0.5 + big + 6);

      // 分数居中
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(170,240,235,0.62)';
      ctx.font = '700 ' + small + 'px ' + FONT;
      ctx.fillText('S C O R E', W / 2, pad);
      ctx.fillStyle = '#eafcff';
      ctx.font = '800 ' + big + 'px ' + FONT;
      ctx.save();
      shadowGlow('rgba(80,240,230,0.55)', 14);
      ctx.fillText(String(Math.floor(G.score)).padStart(6, '0'), W / 2, pad + small + 8);
      ctx.restore();

      // 护盾右上
      var shR2 = clamp(big * 0.26, 6, 11);
      var shY2 = pad + small + 10 + big + shR2;
      var shCap2 = shieldCap();
      for (var si3 = 0; si3 < shCap2; si3++) {
        var shX2 = W - padR - shR2 - (shCap2 - 1 - si3) * (shR2 * 2 + 12);
        drawShieldIcon(shX2, shY2, shR2, si3 < G.shields);
      }
    } else {
      // ===== 宽屏布局：分数左上 · 金币右上 =====
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(170,240,235,0.62)';
      ctx.font = '700 ' + small + 'px ' + FONT;
      ctx.fillText('S C O R E', pad, pad);

      ctx.fillStyle = '#eafcff';
      ctx.font = '800 ' + big + 'px ' + FONT;
      ctx.save();
      shadowGlow('rgba(80,240,230,0.55)', 14);
      ctx.fillText(String(Math.floor(G.score)).padStart(6, '0'), pad, pad + small + 8);
      ctx.restore();

      // 护盾槽
      var shR = clamp(big * 0.26, 6, 11);
      var shY = pad + small + 10 + big + shR;
      var shCap = shieldCap();
      for (var si2 = 0; si2 < shCap; si2++) {
        drawShieldIcon(pad + shR + si2 * (shR * 2 + 12), shY, shR, si2 < G.shields);
      }

      // 金币
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(170,240,235,0.62)';
      ctx.font = '700 ' + small + 'px ' + FONT;
      ctx.fillText('BEST ' + String(G.best).padStart(6, '0'), W - padR, pad);

      ctx.fillStyle = '#ffd45f';
      ctx.font = '800 ' + big + 'px ' + FONT;
      ctx.save();
      shadowGlow('rgba(255,200,80,0.5)', 12);
      ctx.fillText(String(G.coins), W - padR, pad + small + 8);
      ctx.restore();

      // 金币小图标
      var ix = W - padR - ctx.measureText(String(G.coins)).width - 34;
      var iy = pad + small + 8 + big * 0.48;
      ctx.beginPath();
      ctx.arc(ix, iy, Math.max(5, big * 0.26), 0, TAU);
      ctx.fillStyle = '#ffd45f';
      ctx.fill();
      ctx.fillStyle = '#8a5a00';
      ctx.font = '800 ' + Math.round(Math.max(8, big * 0.34)) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♪', ix, iy + 1);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
    }

    if (G.daily) {
      var dbTxt = '每日挑战 ' + G.dailyDate;
      ctx.save();
      ctx.font = '800 ' + Math.round(small * 0.92) + 'px ' + FONT;
      var dbW = ctx.measureText(dbTxt).width + 20;
      var dbX = narrowHud ? pad : W - padR - dbW;
      var dbY = narrowHud ? pad + small * 0.5 + big + 32 : pad + small * 0.5 + big + 8;
      rr(dbX, dbY, dbW, 22, 11);
      ctx.fillStyle = 'rgba(45,24,70,0.68)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,160,215,0.65)'; ctx.lineWidth = 1;
      rr(dbX, dbY, dbW, 22, 11); ctx.stroke();
      ctx.fillStyle = '#ffd7ef';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dbTxt, dbX + dbW / 2, dbY + 11);
      ctx.restore();
    }

    // 连击与能量技能状态
    if (G.combo > 1 && G.state === 'playing') {
      // 即将断连时脉冲警示
      var cPulse = (G.comboT > 0 && G.comboT < 0.7) ? 1 + 0.14 * Math.sin(G.t * 26) : 1;
      var cCol = (G.comboT > 0 && G.comboT < 0.7) ? '#ff9a6a' : '#ffd45f';
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = '900 ' + Math.round(clamp(W * 0.026, 18, 30) * cPulse) + 'px ' + FONT;
      ctx.fillStyle = cCol;
      ctx.shadowColor = G.comboT < 0.7 ? 'rgba(255,140,90,0.8)' : 'rgba(255,190,70,0.7)';
      ctx.shadowBlur = 12;
      ctx.fillText('COMBO ×' + G.combo, W / 2, narrowHud ? pad + small + big + 16 : pad + 5);
      ctx.restore();
    }
    // 道具计时徽章（磁铁 / 翅膀）
    if (G.magnetT > 0 || G.wingT > 0) {
      var badgeY = (narrowHud ? pad + small + big + 16 : pad + 5) + clamp(W * 0.026, 18, 30) + 10;
      var bw2 = 88, bh3 = 20;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + small + 'px ' + FONT;
      if (G.magnetT > 0) {
        ctx.fillStyle = 'rgba(60,20,90,0.55)';
        rr(W / 2 - bw2 - 4, badgeY, bw2, bh3, 10); ctx.fill();
        ctx.strokeStyle = 'rgba(200,130,255,0.7)'; ctx.lineWidth = 1;
        rr(W / 2 - bw2 - 4, badgeY, bw2, bh3, 10); ctx.stroke();
        ctx.fillStyle = '#e3b8ff';
        ctx.fillText('磁铁 ' + Math.ceil(G.magnetT) + 's', W / 2 - bw2 / 2 - 4, badgeY + bh3 / 2 + 1);
      }
      if (G.wingT > 0) {
        ctx.fillStyle = 'rgba(10,40,60,0.55)';
        rr(W / 2 + 4, badgeY, bw2, bh3, 10); ctx.fill();
        ctx.strokeStyle = 'rgba(140,230,255,0.7)'; ctx.lineWidth = 1;
        rr(W / 2 + 4, badgeY, bw2, bh3, 10); ctx.stroke();
        ctx.fillStyle = '#bff0ff';
        ctx.fillText('翅膀 ' + Math.ceil(G.wingT) + 's', W / 2 + 4 + bw2 / 2, badgeY + bh3 / 2 + 1);
      }
      ctx.restore();
    }
    // 速度条（竖条，贴右侧）
    var sp = clamp((G.speed - 24) / 18, 0, 1);
    var vbW = 7, vbH = Math.min(168, H * 0.2);
    var vbX = W - padR - vbW;
    var vbBottom = H - padB - 58;
    var vbY = vbBottom - vbH;
    // 轨道
    rr(vbX, vbY, vbW, vbH, vbW / 2);
    ctx.fillStyle = 'rgba(120,200,220,0.18)';
    ctx.fill();
    // 从下往上填充
    var vfH = Math.max(6, vbH * sp);
    var sg = ctx.createLinearGradient(0, vbBottom, 0, vbY);
    sg.addColorStop(0, '#57e6d8');
    sg.addColorStop(1, '#ff79b8');
    ctx.fillStyle = sg;
    rr(vbX, vbBottom - vfH, vbW, vfH, vbW / 2);
    ctx.fill();
    // 顶部小刻度
    ctx.fillStyle = 'rgba(230,255,255,0.35)';
    ctx.fillRect(vbX - 3, vbY - 2, vbW + 6, 2);

    // 竖排 SPEED 文字
    ctx.save();
    ctx.translate(vbX - 11, vbY + vbH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(170,240,235,0.55)';
    ctx.font = '700 ' + small + 'px ' + FONT;
    ctx.fillText('SPEED', 0, 0);
    ctx.restore();

    // 能量技能按钮（鼠标、触屏均可点击，键盘 E / Shift 也可触发）
    var ss = clamp(Math.min(W, H) * 0.09, 54, 72);
    var sx = W / 2 - ss / 2, sy = H - padB - ss - 16;
    G.ui.skill = { x: sx, y: sy, w: ss, h: ss };
    ctx.save();
    var skillReady = G.energy >= SKILL_COST && G.skillT <= 0;
    ctx.globalAlpha = skillReady || G.skillT > 0 ? 1 : 0.78;
    ctx.fillStyle = skillReady || G.skillT > 0 ? 'rgba(30,125,135,0.82)' : 'rgba(10,24,38,0.68)';
    rr(sx, sy, ss, ss, 16); ctx.fill();
    ctx.strokeStyle = skillReady || G.skillT > 0 ? '#9ffff6' : 'rgba(130,205,220,0.45)';
    ctx.lineWidth = skillReady || G.skillT > 0 ? 2.5 : 1.3; rr(sx, sy, ss, ss, 16); ctx.stroke();
    if (G.skillDeny > 0) {
      var da = G.skillDeny / 0.45;
      ctx.fillStyle = 'rgba(255,120,160,' + (0.2 * da) + ')';
      rr(sx, sy, ss, ss, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,130,170,' + (0.85 * da) + ')';
      ctx.lineWidth = 3;
      rr(sx, sy, ss, ss, 16); ctx.stroke();
    }
    ctx.fillStyle = skillReady || G.skillT > 0 ? '#d8fffb' : '#a7d8df';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.round(ss * 0.32) + 'px ' + FONT;
    ctx.fillText(skillReady ? 'E' : Math.floor(G.energy) + '%', sx + ss / 2, sy + ss * 0.42);
    ctx.font = '700 ' + Math.round(ss * 0.14) + 'px ' + FONT;
    ctx.fillText(G.skillT > 0 ? '冲刺中' : (skillReady ? '可释放' : '冲刺'), sx + ss / 2, sy + ss * 0.75);
    ctx.restore();

    // 开场提示
    if (G.playT < 4.2 && G.state === 'playing') {
      var a = clamp(4.2 - G.playT, 0, 1) * 0.75;
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(220,255,252,0.9)';
      ctx.font = '600 ' + clamp(W * 0.013, 12, 16) + 'px ' + FONT;
      ctx.fillText('← → 变道    ↑ 跳跃    ↓ 滑铲    点击 / E 冲刺', W / 2, H - padB - 4);
      ctx.globalAlpha = 1;
    }

    if (G.themeT > 0) {
      var THb = TH_now();
      ctx.save();
      ctx.globalAlpha = clamp(G.themeT, 0, 1) * 0.95;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + clamp(W * 0.02, 15, 22) + 'px ' + FONT;
      ctx.fillStyle = THb.accent;
      ctx.shadowColor = THb.accent;
      ctx.shadowBlur = 14;
      ctx.fillText('— ' + THb.name + ' —', W / 2, H * 0.17);
      ctx.restore();
    }

    drawSystemButtons(G.state === 'playing' || G.state === 'paused' || G.state === 'dying');
  }

  function drawShieldIcon(x, y, r, filled) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.78, y - r * 0.46);
    ctx.lineTo(x + r * 0.78, y + r * 0.16);
    ctx.quadraticCurveTo(x + r * 0.62, y + r * 0.74, x, y + r);
    ctx.quadraticCurveTo(x - r * 0.62, y + r * 0.74, x - r * 0.78, y + r * 0.16);
    ctx.lineTo(x - r * 0.78, y - r * 0.46);
    ctx.closePath();
    if (filled) {
      var g = ctx.createLinearGradient(x, y - r, x, y + r);
      g.addColorStop(0, '#cdf6ff');
      g.addColorStop(0.5, '#6fd6ff');
      g.addColorStop(1, '#2f8fd6');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(235,255,255,0.9)';
    } else {
      ctx.fillStyle = 'rgba(130,180,205,0.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,205,225,0.28)';
    }
    ctx.lineWidth = 1.4;
    ctx.stroke();
    if (filled) {
      ctx.beginPath();
      ctx.arc(x, y + r * 0.05, r * 0.24, 0, TAU);
      ctx.fillStyle = 'rgba(18,70,105,0.85)';
      ctx.fill();
    }
  }

  // 暂停 + 静音系统按钮（左下角，贴近安全区）
  function drawSystemButtons(showPause) {
    var s = Math.max(38, Math.min(W, H) * 0.062);
    var y = H - s - 14 - SAFE.b;
    var px2 = 14 + SAFE.l;          // 暂停键在最左
    var mx = px2 + s + 8;           // 静音键在它右边
    G.ui.mute = { x: mx, y: y, w: s, h: s };
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(10,20,32,0.5)';
    rr(mx, y, s, s, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(90,225,215,0.5)';
    ctx.lineWidth = 1.4;
    rr(mx, y, s, s, 10); ctx.stroke();
    ctx.fillStyle = Sfx.masterMuted ? 'rgba(160,190,200,0.5)' : 'rgba(180,255,248,0.92)';
    ctx.font = '700 ' + Math.round(s * 0.46) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♪', mx + s / 2, y + s / 2 + 1);
    if (Sfx.masterMuted) {
      ctx.strokeStyle = 'rgba(255,120,150,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mx + s * 0.24, y + s * 0.76);
      ctx.lineTo(mx + s * 0.76, y + s * 0.24);
      ctx.stroke();
    }
    ctx.restore();

    if (showPause) {
      G.ui.pause = { x: px2, y: y, w: s, h: s };
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(10,20,32,0.5)';
      rr(px2, y, s, s, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(90,225,215,0.5)';
      ctx.lineWidth = 1.4;
      rr(px2, y, s, s, 10); ctx.stroke();
      // 双竖条暂停图标
      ctx.fillStyle = 'rgba(180,255,248,0.92)';
      var bw2 = Math.max(2.5, s * 0.09), bh2 = s * 0.36;
      ctx.fillRect(px2 + s / 2 - bw2 - s * 0.055, y + s / 2 - bh2 / 2, bw2, bh2);
      ctx.fillRect(px2 + s / 2 + s * 0.055, y + s / 2 - bh2 / 2, bw2, bh2);
      ctx.restore();
    } else {
      G.ui.pause = null;
    }
  }

  function drawMuteButton() {
    drawSystemButtons(false);
  }

  function button(x, y, w, h, text, primary) {
    var pulse = 0.5 + 0.5 * Math.sin(G.t * 3);
    ctx.save();
    ctx.fillStyle = primary ? 'rgba(45,205,190,' + (0.16 + pulse * 0.10) + ')' : 'rgba(255,255,255,0.05)';
    rr(x, y, w, h, h * 0.34); ctx.fill();
    ctx.strokeStyle = primary ? 'rgba(120,250,238,' + (0.6 + pulse * 0.35) + ')' : 'rgba(200,220,240,0.3)';
    ctx.lineWidth = 2;
    rr(x, y, w, h, h * 0.34); ctx.stroke();
    ctx.fillStyle = primary ? '#f2fffd' : 'rgba(220,235,250,0.8)';
    ctx.font = '800 ' + Math.round(clamp(h * 0.36, 15, 24)) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2 + 1);
    ctx.restore();
  }

  function chip(x, y, w, h, glyph, text, tint) {
    ctx.save();
    var fs = Math.round(h * 0.4);
    ctx.font = '800 ' + fs + 'px ' + FONT;
    var gw = ctx.measureText(glyph).width;
    var fs2 = Math.round(h * 0.34);
    ctx.font = '600 ' + fs2 + 'px ' + FONT;
    var tw = ctx.measureText(text).width;
    var total = gw + 7 + tw;
    var sx = x + (w - total) / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    rr(x, y, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = tint;
    ctx.lineWidth = 1.2;
    rr(x, y, w, h, h / 2); ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = tint;
    ctx.font = '800 ' + fs + 'px ' + FONT;
    ctx.fillText(glyph, sx, y + h / 2 + 1);
    ctx.fillStyle = 'rgba(228,246,250,0.85)';
    ctx.font = '600 ' + fs2 + 'px ' + FONT;
    ctx.fillText(text, sx + gw + 7, y + h / 2 + 1);
    ctx.restore();
  }

  function drawCoinIcon(x, y, r) {
    var g = ctx.createLinearGradient(x, y - r, x, y + r);
    g.addColorStop(0, '#fff2b8');
    g.addColorStop(0.5, '#ffd45f');
    g.addColorStop(1, '#e39a10');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(122,74,0,0.85)';
    ctx.font = '800 ' + Math.round(r * 1.25) + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♪', x, y + 1);
  }

  function drawSkinPreview(cx, cy, r, SK) {
    // 轻微呼吸 / 摇摆，让预览动起来
    cy += Math.sin(G.t * 3.1) * r * 0.06;
    // 肩 / 衣服
    ctx.fillStyle = SK.shirt;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 1.12, r * 1.12, r * 0.72, 0, Math.PI, TAU);
    ctx.fill();
    ctx.fillStyle = SK.skirtC;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 1.52, r * 0.98, r * 0.4, 0, Math.PI, TAU);
    ctx.fill();

    // 双马尾
    ctx.fillStyle = SK.hairM;
    ctx.beginPath(); ctx.ellipse(cx - r * 1.12, cy + r * 0.32, r * 0.3, r * 0.92, 0.28, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 1.12, cy + r * 0.32, r * 0.3, r * 0.92, -0.28, 0, TAU); ctx.fill();
    ctx.fillStyle = SK.hair;
    ctx.beginPath(); ctx.ellipse(cx - r * 1.1, cy + r * 0.2, r * 0.2, r * 0.8, 0.28, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 1.1, cy + r * 0.2, r * 0.2, r * 0.8, -0.28, 0, TAU); ctx.fill();

    // 头发
    var hg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r * 1.0);
    hg.addColorStop(0, SK.hairG);
    hg.addColorStop(0.6, SK.hair);
    hg.addColorStop(1, SK.hairD);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.92, 0, TAU); ctx.fill();

    // 脸
    ctx.fillStyle = '#ffe6d8';
    ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.14, r * 0.6, r * 0.62, 0, 0, TAU); ctx.fill();

    // 刘海
    ctx.fillStyle = SK.hair;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.62, cy + r * 0.02);
    ctx.quadraticCurveTo(cx - r * 0.5, cy - r * 0.62, cx, cy - r * 0.62);
    ctx.quadraticCurveTo(cx + r * 0.5, cy - r * 0.62, cx + r * 0.62, cy + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.3, cy - r * 0.2, cx, cy - r * 0.14);
    ctx.quadraticCurveTo(cx - r * 0.3, cy - r * 0.2, cx - r * 0.62, cy + r * 0.02);
    ctx.closePath();
    ctx.fill();

    // 眼睛
    ctx.fillStyle = SK.hairD;
    ctx.beginPath(); ctx.ellipse(cx - r * 0.26, cy + r * 0.2, r * 0.07, r * 0.11, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.26, cy + r * 0.2, r * 0.07, r * 0.11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(cx - r * 0.24, cy + r * 0.17, r * 0.025, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.28, cy + r * 0.17, r * 0.025, 0, TAU); ctx.fill();

    // 腮红
    ctx.fillStyle = 'rgba(255,150,180,0.35)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.42, cy + r * 0.36, r * 0.1, r * 0.06, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.42, cy + r * 0.36, r * 0.1, r * 0.06, 0, 0, TAU); ctx.fill();

    // 耳机
    ctx.strokeStyle = '#151a2c';
    ctx.lineWidth = Math.max(2, r * 0.14);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.9, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();
    ctx.fillStyle = '#151a2c';
    ctx.beginPath(); ctx.arc(cx - r * 0.86, cy + r * 0.06, r * 0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.86, cy + r * 0.06, r * 0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = SK.accent;
    ctx.beginPath(); ctx.arc(cx - r * 0.86, cy + r * 0.06, r * 0.08, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.86, cy + r * 0.06, r * 0.08, 0, TAU); ctx.fill();
  }

  function drawThemeChip(x, y, w, h, idx, active) {
    var T = THEMES[idx];
    ctx.save();
    if (active) {
      ctx.shadowColor = T.accent;
      ctx.shadowBlur = 20;
    }
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, T.sky[2]);
    g.addColorStop(0.55, T.sky[3]);
    g.addColorStop(1, T.sky[4]);
    rr(x, y, w, h, 10);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    rr(x, y, w, h, 10);
    ctx.fillStyle = active ? 'rgba(8,10,20,0.42)' : 'rgba(8,10,20,0.7)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x + 14, y + h / 2, 5, 0, TAU);
    ctx.fillStyle = T.accent;
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = active ? '#ffffff' : 'rgba(225,240,250,0.68)';
    ctx.font = '800 ' + clamp(h * 0.3, 10, 15) + 'px ' + FONT;
    ctx.fillText(T.name, x + 24, y + h / 2 + 1);

    rr(x, y, w, h, 10);
    ctx.strokeStyle = active ? T.accent : 'rgba(255,255,255,0.16)';
    ctx.lineWidth = active ? 2.2 : 1.2;
    ctx.stroke();
  }

  function setDiff(i) {
    if (i < 0 || i >= DIFFS.length) return;
    G.diff = i;
    try { localStorage.setItem('miku-neon-diff', String(i)); } catch (e) { /* ignore */ }
    Sfx.move();
  }

  function setTheme(i) {
    G.selTheme = i;
    G.theme = i;
    bgCache.key = '';
    Music.setTheme(i);
    G.weather.length = 0;
    Sfx.move();
  }

  function drawMenu() {
    var TH = TH_now();
    ctx.fillStyle = 'rgba(6,5,16,0.5)';
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2;
    var padM = Math.max(16, Math.min(W, H) * 0.035) + SAFE.t; // 顶部避开刘海
    var padMB = Math.max(16, Math.min(W, H) * 0.035) + SAFE.b; // 底部避开 Home 条
    var shortScreen = H < 560;
    var titleSize = clamp(Math.min(W * 0.082, H * 0.12), shortScreen ? 30 : 38, 82);
    var y = H * 0.245;

    // ---- 顶部：金币钱包 + 商店 / 任务 / 排行 ----
    var wh = clamp(H * 0.048, 34, 42);
    if (shortScreen) y = Math.max(padM + wh + 30, H * 0.17);
    var ww = wh * 2.7;
    rr(padM, padM, ww, wh, wh / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,120,0.45)';
    ctx.lineWidth = 1.2;
    rr(padM, padM, ww, wh, wh / 2);
    ctx.stroke();
    drawCoinIcon(padM + wh * 0.5, padM + wh / 2, wh * 0.26);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,235,180,0.95)';
    ctx.font = '800 ' + Math.round(wh * 0.42) + 'px ' + FONT;
    ctx.fillText(String(G.wallet), padM + wh * 0.88, padM + wh / 2 + 1);

    var btnW = wh * 1.5, btnGap = 8;
    var sbx = padM + ww + 10;
    // 窄屏时压缩按钮宽度，给右上角设置键留出位置
    btnW = Math.max(40, Math.min(btnW, (W - padM - wh * 0.98 - 12 - sbx - btnGap * 2) / 3));
    G.ui.shopBtn = { x: sbx, y: padM, w: btnW, h: wh };
    button(sbx, padM, btnW, wh, '商店', false);
    G.ui.missionBtn = { x: sbx + btnW + btnGap, y: padM, w: btnW, h: wh };
    button(sbx + btnW + btnGap, padM, btnW, wh, '任务', false);
    G.ui.scoreBtn = { x: sbx + (btnW + btnGap) * 2, y: padM, w: btnW, h: wh };
    button(sbx + (btnW + btnGap) * 2, padM, btnW, wh, '排行', false);
    // 设置（右上角图标）
    var gsz = wh * 0.98;
    var gx = W - padM - gsz, gy = padM + (wh - gsz) / 2;
    G.ui.settingsBtn = { x: gx, y: gy, w: gsz, h: gsz };
    rr(gx, gy, gsz, gsz, gsz * 0.28);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,235,0.35)';
    ctx.lineWidth = 1.2;
    rr(gx, gy, gsz, gsz, gsz * 0.28);
    ctx.stroke();
    // 三条滑杆图标
    for (var gi = 0; gi < 3; gi++) {
      var lw2 = gsz * 0.5, lx2 = gx + gsz * 0.25, ly2 = gy + gsz * (0.3 + gi * 0.2);
      ctx.beginPath();
      ctx.moveTo(lx2, ly2);
      ctx.lineTo(lx2 + lw2, ly2);
      ctx.strokeStyle = 'rgba(185,240,250,0.75)';
      ctx.lineWidth = Math.max(1.4, gsz * 0.045);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(lx2 + lw2 * (gi === 0 ? 0.3 : gi === 1 ? 0.66 : 0.45), ly2, gsz * 0.055, 0, TAU);
      ctx.fillStyle = '#9ffff6';
      ctx.fill();
    }

    // 有「新的」已完成任务时，在「任务」按钮上亮小圆点
    if (missionDot()) {
      ctx.beginPath();
      ctx.arc(sbx + (btnW + btnGap) + btnW - 5, padM + 5, 4, 0, TAU);
      ctx.fillStyle = '#ff6b9d';
      ctx.fill();
    }

    // ---- 标题 ----
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + clamp(W * 0.015, 11, 15) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(120,245,235,0.8)';
    ctx.fillText('H A T S U N E   M I K U', cx, y - titleSize * 0.78);

    var grad = ctx.createLinearGradient(cx - 220, 0, cx + 220, 0);
    grad.addColorStop(0, '#8df7ee');
    grad.addColorStop(0.5, '#ffffff');
    grad.addColorStop(1, '#ff8dc4');
    ctx.save();
    shadowGlow('rgba(70,225,215,0.75)', 42);
    ctx.font = '900 ' + titleSize + 'px ' + FONT;
    ctx.fillStyle = grad;
    ctx.fillText('霓虹跑酷', cx, y + titleSize * 0.05);
    ctx.restore();

    ctx.font = '600 ' + clamp(W * 0.017, 12, 17) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(200,230,250,0.62)';
    ctx.fillText('东京霓虹夜 · 无尽跑酷', cx, y + titleSize * 0.66);

    var bw = Math.min(300, W * 0.62), bh = shortScreen ? 40 : clamp(H * 0.09, 50, 64);
    var bx = cx - bw / 2, by = y + titleSize * 0.96;
    G.ui.start = { x: bx, y: by, w: bw, h: bh };
    button(bx, by, bw, bh, '开始游戏', true);

    // ---- 难度选择 ----
    var dH = clamp(H * 0.038, 28, 34);
    var dW = Math.min(W * 0.72, 380);
    var dX = cx - dW / 2;
    var dY = by + bh + clamp(H * 0.02, 10, 16);
    var dGap = 6;
    var dChipW = (dW - dGap * 3) / 4;
    for (var di2 = 0; di2 < DIFFS.length; di2++) {
      var dx2 = dX + di2 * (dChipW + dGap);
      var on2 = G.diff === di2;
      G.ui['diff' + di2] = { x: dx2, y: dY, w: dChipW, h: dH };
      rr(dx2, dY, dChipW, dH, dH / 2);
      ctx.fillStyle = on2 ? 'rgba(70,225,210,0.20)' : 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.strokeStyle = on2 ? DIFFS[di2].color : 'rgba(255,255,255,0.14)';
      ctx.lineWidth = on2 ? 1.8 : 1;
      rr(dx2, dY, dChipW, dH, dH / 2);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = on2 ? DIFFS[di2].color : 'rgba(200,230,245,0.6)';
      ctx.font = '800 ' + Math.round(dH * 0.44) + 'px ' + FONT;
      ctx.fillText(DIFFS[di2].name, dx2 + dChipW / 2, dY + dH / 2 + 1);
    }

    var guideY;
    if (!shortScreen) {
      var chipH = clamp(H * 0.042, 28, 36);
      var chipW = Math.min(158, W * 0.3);
      var gapC = Math.min(18, W * 0.025);
      var totalW = chipW * 3 + gapC * 2;
      var chipX = cx - totalW / 2;
      var chipY = dY + dH + clamp(H * 0.026, 12, 20);
      chip(chipX, chipY, chipW, chipH, '↑', '跳过护栏', 'rgba(255,150,170,0.75)');
      chip(chipX + chipW + gapC, chipY, chipW, chipH, '↓', '滑过横梁', 'rgba(80,225,215,0.8)');
      chip(chipX + (chipW + gapC) * 2, chipY, chipW, chipH, '⇄', '躲开方块', 'rgba(255,120,190,0.75)');

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 ' + clamp(W * 0.0125, 10.5, 14) + 'px ' + FONT;
      ctx.fillStyle = 'rgba(190,225,245,0.5)';
      ctx.fillText('← → 变道　↑ 跳跃　↓ 滑铲　E / Shift 冲刺　D 每日挑战　P 暂停',
        cx, chipY + chipH + clamp(H * 0.032, 16, 26));
      guideY = chipY + chipH + clamp(H * 0.032, 16, 26) + clamp(H * 0.026, 12, 20);
    } else {
      guideY = dY + dH + 8;
    }

    // 障碍图鉴 + 每日固定挑战入口
    var rowW = Math.min(430, W * 0.88), rowGap = 8;
    var gbH = shortScreen ? 28 : clamp(H * 0.044, 30, 40);
    var gbW = Math.floor((rowW - rowGap) * 0.52), dcW = rowW - rowGap - gbW;
    var gbX = cx - rowW / 2;
    G.ui.guideBtn = { x: gbX, y: guideY, w: gbW, h: gbH };
    button(gbX, guideY, gbW, gbH, (shortScreen ? '图鉴 ' : '障碍图鉴（') + OBS_GUIDE.length + (shortScreen ? ' ›' : ' 种）›'), false);
    G.ui.dailyBtn = { x: gbX + gbW + rowGap, y: guideY, w: dcW, h: gbH };
    button(gbX + gbW + rowGap, guideY, dcW, gbH, '每日挑战 ›', true);

    if (!shortScreen) {
      ctx.fillStyle = 'rgba(170,225,240,0.4)';
      ctx.font = '600 ' + clamp(W * 0.0115, 9.5, 13) + 'px ' + FONT;
      ctx.fillText('手机：左右滑动变道 · 上滑跳跃 · 下滑滑铲 · 点击冲刺', cx, H - padMB);
    }

    // ---- 底部：主题选择（彩色卡片） ----
    var n = THEMES.length;
    var chipH2 = shortScreen ? 38 : clamp(H * 0.064, 42, 54);
    var chipY = shortScreen ? H - padMB - chipH2 : H - Math.max(96, H * 0.128) - padMB * 0.5;
    var gap2 = Math.min(14, W * 0.012);
    var chipW = (W - 2 * padM - (n - 1) * gap2) / n;

    if (chipW >= 94) {
      for (var i = 0; i < n; i++) {
        var tcx = padM + i * (chipW + gap2);
        G.ui['theme' + i] = { x: tcx, y: chipY, w: chipW, h: chipH2 };
        drawThemeChip(tcx, chipY, chipW, chipH2, i, i === G.selTheme);
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(220,240,250,0.5)';
      ctx.font = '700 ' + clamp(W * 0.0115, 10, 13) + 'px ' + FONT;
      if (!shortScreen) ctx.fillText('点击切换主题 · 跑动中每 900 米自动轮换', cx, chipY + chipH2 + 15);
    } else {
      var pw2 = Math.min(W - 2 * padM, 320);
      var px3 = cx - pw2 / 2;
      G.ui.themePrev = { x: px3, y: chipY, w: 42, h: chipH2 };
      G.ui.themeNext = { x: px3 + pw2 - 42, y: chipY, w: 42, h: chipH2 };
      drawThemeChip(px3 + 42, chipY, pw2 - 84, chipH2, G.selTheme, true);
      ctx.fillStyle = 'rgba(225,245,255,0.85)';
      ctx.font = '800 ' + Math.round(chipH2 * 0.5) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\u25c0', px3 + 21, chipY + chipH2 / 2);
      ctx.fillText('\u25b6', px3 + pw2 - 21, chipY + chipH2 / 2);
    }

    // 最高分已移至「排行」面板，菜单保持清爽
  }

  // 通用面板骨架：返回面板矩形，并记录关闭按钮 / 面板区域（点外部可关闭）
  function drawPanelFrame(title, subtitle, maxW, maxH) {
    // 面板整体限制在安全区内，刘海屏不遮挡
    var availH = H - SAFE.t - SAFE.b;
    var pw = Math.min(maxW, W * 0.94);
    var ph = Math.min(maxH, availH * 0.86);
    var px = (W - pw) / 2, py = SAFE.t + (availH - ph) / 2;
    ctx.fillStyle = 'rgba(5,4,12,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(13,19,34,0.97)';
    rr(px, py, pw, ph, 24); ctx.fill();
    ctx.strokeStyle = 'rgba(90,225,215,0.45)';
    ctx.lineWidth = 1.6;
    rr(px, py, pw, ph, 24); ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eafcff';
    ctx.font = '900 ' + clamp(pw * 0.045, 18, 26) + 'px ' + FONT;
    ctx.fillText(title, px + 28, py + 36);
    if (subtitle) {
      ctx.font = '600 ' + clamp(pw * 0.024, 11, 14) + 'px ' + FONT;
      ctx.fillStyle = 'rgba(170,220,235,0.55)';
      ctx.fillText(subtitle, px + 28, py + 64);
    }

    G.ui.panelRect = { x: px, y: py, w: pw, h: ph };
    G.ui.closePanel = { x: px + pw - 52, y: py + 16, w: 38, h: 38 };
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,230,245,0.7)';
    ctx.font = '700 26px ' + FONT;
    ctx.fillText('×', px + pw - 33, py + 36);
    return { px: px, py: py, pw: pw, ph: ph };
  }

  // ---------- 障碍图鉴 ----------
  var OBS_GUIDE = [
    { id: 'barrier', name: '护栏', how: '跳跃', col: '#ff8f9b' },
    { id: 'slider', name: '平移路障', how: '跳跃·看时机', col: '#ffd98a' },

  // 小图标：在 (cx,cy) 处画一个半宽 s 的障碍示意
  function drawObsIcon(kind, cx, cy, s) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function bar(x, y, w, h, col, r) {
      rr(x, y, w, h, r === undefined ? 2 : r);
      ctx.fillStyle = col;
      ctx.fill();
    }
    if (kind === 'barrier') {
      bar(cx - s, cy - s * 0.5, s * 2, s, '#d2334b');
      for (var i = 0; i < 3; i++) bar(cx - s + s * 0.2 + i * s * 0.6, cy - s * 0.42, s * 0.26, s * 0.84, '#fff4ee', 1);
    } else if (kind === 'slider') {
      bar(cx - s, cy - s * 0.5, s * 2, s, '#e8963a');
      for (var j = 0; j < 3; j++) bar(cx - s + s * 0.2 + j * s * 0.6, cy - s * 0.42, s * 0.26, s * 0.84, '#fffaf0', 1);
      ctx.strokeStyle = '#ffe6a8';
      ctx.lineWidth = Math.max(1.5, s * 0.16);
      ctx.beginPath();
      ctx.moveTo(cx - s * 1.25, cy);
      ctx.lineTo(cx - s * 1.05, cy);
      ctx.moveTo(cx + s * 1.25, cy);
      ctx.lineTo(cx + s * 1.05, cy);
      ctx.stroke();
    } else if (kind === 'spike') {
      bar(cx - s, cy + s * 0.35, s * 2, s * 0.3, '#525c72', 1);
      for (var k = 0; k < 4; k++) {
        var sx = cx - s + s * 0.25 + k * s * 0.5;
        ctx.beginPath();
        ctx.moveTo(sx, cy + s * 0.35);
        ctx.lineTo(sx + s * 0.25, cy - s * 0.7);
        ctx.lineTo(sx + s * 0.5, cy + s * 0.35);
        ctx.closePath();
        ctx.fillStyle = k % 2 ? '#d5deee' : '#b7c2d6';
        ctx.fill();
      }
    } else if (kind === 'beam' || kind === 'gate') {
      bar(cx - s, cy - s * 0.95, s * 0.22, s * 1.9, '#5f6fa8', 1);
      bar(cx + s * 0.78, cy - s * 0.95, s * 0.22, s * 1.9, '#5f6fa8', 1);
      bar(cx - s, cy - s * 0.75, s * 2, s * 0.5, '#c97c22', 2);
      if (kind === 'gate') bar(cx - s, cy + s * 0.2, s * 2, s * 0.16, '#8a5210', 1);
    } else if (kind === 'icicle') {
      bar(cx - s, cy - s * 0.85, s * 2, s * 0.22, '#a9d8ee', 1);
      for (var m = 0; m < 3; m++) {
        var ix = cx - s * 0.6 + m * s * 0.6;
        ctx.beginPath();
        ctx.moveTo(ix - s * 0.22, cy - s * 0.6);
        ctx.lineTo(ix + s * 0.22, cy - s * 0.6);
        ctx.lineTo(ix, cy + s * 0.55);
        ctx.closePath();
        ctx.fillStyle = 'rgba(198,238,255,0.95)';
        ctx.fill();
      }
    } else if (kind === 'fence') {
      ctx.fillStyle = 'rgba(90,240,225,0.20)';
      ctx.fillRect(cx - s, cy - s * 0.35, s * 2, s * 0.7);
      ctx.strokeStyle = '#8efff2';
      ctx.lineWidth = Math.max(1.5, s * 0.14);
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s * 0.35);
      ctx.lineTo(cx + s, cy - s * 0.35);
      ctx.moveTo(cx - s, cy + s * 0.35);
      ctx.lineTo(cx + s, cy + s * 0.35);
      ctx.stroke();
      ctx.fillStyle = '#bff9f2';
      ctx.beginPath();
      ctx.arc(cx - s * 1.15, cy, s * 0.16, 0, TAU);
      ctx.arc(cx + s * 1.15, cy, s * 0.16, 0, TAU);
      ctx.fill();
    } else if (kind === 'dune') {
      ctx.beginPath();
      ctx.moveTo(cx - s, cy + s * 0.5);
      ctx.quadraticCurveTo(cx - s * 0.2, cy - s * 0.9, cx + s, cy + s * 0.5);
      ctx.closePath();
      ctx.fillStyle = '#e8b46a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,235,190,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (kind === 'block') {
      bar(cx - s, cy - s * 0.4, s * 2, s * 1.2, '#4b3f96', 2);
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s * 0.4);
      ctx.lineTo(cx + s, cy - s * 0.4);
      ctx.lineTo(cx + s * 0.75, cy - s * 0.95);
      ctx.lineTo(cx - s * 0.75, cy - s * 0.95);
      ctx.closePath();
      ctx.fillStyle = '#8f7bf0';
      ctx.fill();
    } else if (kind === 'pillar') {
      bar(cx - s * 0.4, cy - s * 1.15, s * 0.8, s * 2.2, '#584aa8', 2);
      ctx.strokeStyle = '#c8b9ff';
      ctx.lineWidth = Math.max(1, s * 0.12);
      for (var n = 0; n < 3; n++) {
        var py2 = cy - s * 0.6 + n * s * 0.6;
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.4, py2);
        ctx.lineTo(cx + s * 0.4, py2);
        ctx.stroke();
      }
    } else if (kind === 'lantern') {
      bar(cx - s * 0.75, cy + s * 0.55, s * 1.5, s * 0.4, '#6f6559', 1);
      bar(cx - s * 0.55, cy - s * 0.35, s * 1.1, s * 0.95, '#ffcf7a', 2);
      bar(cx - s * 0.8, cy - s * 0.85, s * 1.6, s * 0.42, '#8f8578', 2);
    } else if (kind === 'booth') {
      bar(cx - s * 0.6, cy - s * 1.0, s * 1.2, s * 1.9, '#c0392b', 2);
      ctx.fillStyle = 'rgba(180,225,240,0.55)';
      ctx.fillRect(cx - s * 0.4, cy - s * 0.7, s * 0.8, s * 1.1);
      bar(cx - s * 0.75, cy - s * 1.3, s * 1.5, s * 0.32, '#ffd15c', 1);
    } else if (kind === 'pendulum') {
      ctx.strokeStyle = 'rgba(205,220,240,0.9)';
      ctx.lineWidth = Math.max(1.2, s * 0.1);
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 1.1);
      ctx.lineTo(cx + s * 0.35, cy + s * 0.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + s * 0.35, cy + s * 0.45, s * 0.42, 0, TAU);
      ctx.fillStyle = '#d24a2c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,205,170,0.9)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    } else if (kind === 'drone') {
      bar(cx - s, cy - s * 0.15, s * 2, s * 0.5, '#2fb39f', 3);
      ctx.strokeStyle = '#8ff0e2';
      ctx.lineWidth = Math.max(1.2, s * 0.1);
      ctx.beginPath();
      ctx.arc(cx - s * 0.75, cy - s * 0.55, s * 0.32, 0, TAU);
      ctx.arc(cx + s * 0.75, cy - s * 0.55, s * 0.32, 0, TAU);
      ctx.stroke();
    } else if (kind === 'ramp' || kind === 'launch') {
      ctx.beginPath();
      ctx.moveTo(cx - s, cy + s * 0.6);
      ctx.lineTo(cx + s, cy + s * 0.6);
      ctx.lineTo(cx + s, cy - s * 0.6);
      ctx.closePath();
      ctx.fillStyle = kind === 'launch' ? '#8ff0ff' : '#5fd8c8';
      ctx.fill();
      if (kind === 'launch') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1.2, s * 0.12);
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.2, cy + s * 0.2);
        ctx.lineTo(cx + s * 0.45, cy - s * 0.2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawGuide() {
    var P0 = drawPanelFrame('障碍图鉴', '每种障碍的样子与应对方式', 660, 600);
    var px = P0.px, py = P0.py, pw = P0.pw, ph = P0.ph;
    var cols = pw >= 560 ? 4 : 3;
    var rows = Math.ceil(OBS_GUIDE.length / cols);
    var gapX = 10, gapY = 10;
    var cw = (pw - 48 - gapX * (cols - 1)) / cols;
    var chh = (ph - 150 - gapY * (rows - 1)) / rows;
    var top = py + 92;

    for (var i = 0; i < OBS_GUIDE.length; i++) {
      var g = OBS_GUIDE[i];
      var col = i % cols, row = Math.floor(i / cols);
      var x2 = px + 24 + col * (cw + gapX);
      var y2 = top + row * (chh + gapY);
      rr(x2, y2, cw, chh, 12);
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 1;
      rr(x2, y2, cw, chh, 12);
      ctx.stroke();

      var iconR = Math.min(cw * 0.18, chh * 0.22, 24);
      drawObsIcon(g.id, x2 + cw / 2, y2 + chh * 0.32, iconR);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#eafcff';
      ctx.font = '800 ' + clamp(cw * 0.095, 10, 14) + 'px ' + FONT;
      ctx.fillText(g.name, x2 + cw / 2, y2 + chh - 24);

      ctx.fillStyle = g.col;
      ctx.font = '700 ' + clamp(cw * 0.075, 8.5, 12) + 'px ' + FONT;
      ctx.fillText(g.how, x2 + cw / 2, y2 + chh - 10);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(190,225,245,0.5)';
    ctx.font = '600 ' + clamp(pw * 0.024, 10, 13) + 'px ' + FONT;
    ctx.fillText('↑ 跳跃　　↓ 滑铲　　← → 换道　　E 冲刺可撞碎部分障碍', px + pw / 2, py + ph - 22);
  }

  function drawShop() {
    var P0 = drawPanelFrame('金币商店', '用跑酷赚到的金币解锁新皮肤', 660, 600);
    var px = P0.px, py = P0.py, pw = P0.pw, ph = P0.ph;

    // 钱包
    var wbtnW = 108, wbtnH = 34;
    var wx = px + pw - 28 - wbtnW - 44;
    rr(wx, py + 22, wbtnW, wbtnH, wbtnH / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,120,0.5)';
    ctx.lineWidth = 1.2;
    rr(wx, py + 22, wbtnW, wbtnH, wbtnH / 2);
    ctx.stroke();
    drawCoinIcon(wx + 18, py + 22 + wbtnH / 2, 10);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,235,180,0.95)';
    ctx.font = '800 ' + Math.round(wbtnH * 0.44) + 'px ' + FONT;
    ctx.fillText(String(G.wallet), wx + 34, py + 22 + wbtnH / 2 + 1);

    // 卡片网格（超过 2 款时自动排成 2 列）
    var cols = SKINS.length > 4 ? 3 : (SKINS.length > 2 ? 2 : SKINS.length);
    var rows = Math.ceil(SKINS.length / cols);
    var gapC = 16;
    var cw = (pw - 56 - gapC * (cols - 1)) / cols;
    var chh = (ph - 112 - 16) / rows;
    for (var i = 0; i < SKINS.length; i++) {
      var SK = SKINS[i];
      var col = i % cols, row = Math.floor(i / cols);
      var cx2 = px + 28 + col * (cw + gapC);
      var cy = py + 92 + row * (chh + 16);
      G.ui['card' + i] = { x: cx2, y: cy, w: cw, h: chh };

      var owned = !!G.owned[i];
      var equipped = G.skin === i;
      rr(cx2, cy, cw, chh, 18);
      ctx.fillStyle = equipped ? 'rgba(60,220,205,0.10)' : 'rgba(255,255,255,0.04)';
      ctx.fill();
      ctx.strokeStyle = equipped ? 'rgba(110,245,230,0.75)' : 'rgba(255,255,255,0.12)';
      ctx.lineWidth = equipped ? 1.8 : 1.2;
      rr(cx2, cy, cw, chh, 18);
      ctx.stroke();

      // 矮卡片（横屏小屏）走紧凑布局：更小的立绘、隐藏属性行
      var compact = chh < 150 || cw < 150;
      var sc2 = compact ? 0.8 : clamp(chh / 150, 0.72, 1);
      drawSkinPreview(cx2 + cw / 2, cy + (compact ? 17 : 30 * sc2), Math.min(cw * (compact ? 0.10 : 0.13), chh * (compact ? 0.11 : 0.15)), SK);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#eefaff';
      ctx.font = '800 ' + clamp(cw * 0.085, 12, 15) + 'px ' + FONT;
      ctx.fillText(SK.name, cx2 + cw / 2, cy + (compact ? 40 : 64 * sc2));

      // 皮肤属性
      if (!compact) {
        ctx.fillStyle = 'rgba(255,215,120,0.82)';
        ctx.font = '700 ' + clamp(cw * 0.062, 10, 12) + 'px ' + FONT;
        ctx.fillText(SK.perkText || '', cx2 + cw / 2, cy + 80 * sc2);
      } else if (chh >= 120) {
        ctx.fillStyle = 'rgba(255,215,120,0.72)';
        ctx.font = '700 ' + clamp(cw * 0.056, 9, 11) + 'px ' + FONT;
        ctx.fillText(SK.perkText || '', cx2 + cw / 2, cy + 80);
      }

      if (!owned) {
        drawCoinIcon(cx2 + cw / 2 - 26, cy + (compact ? 60 : 98 * sc2), 8);
        ctx.fillStyle = 'rgba(255,225,150,0.9)';
        ctx.font = '800 ' + clamp(cw * 0.075, 11, 13) + 'px ' + FONT;
        ctx.textAlign = 'left';
        ctx.fillText(String(SK.price), cx2 + cw / 2 - 13, cy + (compact ? 60 : 98 * sc2) + 1);
        ctx.textAlign = 'center';
      } else {
        ctx.fillStyle = 'rgba(150,240,225,0.75)';
        ctx.font = '700 ' + clamp(cw * 0.07, 10, 12) + 'px ' + FONT;
        ctx.fillText(equipped ? '使用中' : '已拥有', cx2 + cw / 2, cy + (compact ? 60 : 98 * sc2));
      }

      var bw2 = cw - 36, bh2 = compact ? 22 : clamp(chh * 0.2, 24, 30);
      var bx2 = cx2 + 18, by2 = cy + chh - bh2 - (compact ? 6 : 10);
      var label = equipped ? '使用中' : (owned ? '装备' : '购买');
      var canBuy = owned || G.wallet >= SK.price;
      ctx.globalAlpha = canBuy ? 1 : 0.45;
      button(bx2, by2, bw2, bh2, label, !equipped && canBuy);
      ctx.globalAlpha = 1;
    }

    // 提示
    if (G.shopMsgT > 0) {
      ctx.globalAlpha = clamp(G.shopMsgT, 0, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,150,170,0.95)';
      ctx.font = '700 ' + clamp(pw * 0.026, 12, 16) + 'px ' + FONT;
      ctx.fillText(G.shopMsg, px + pw / 2, py + ph - 18);
      ctx.globalAlpha = 1;
    }
  }

  function drawMissions() {

      var tx2 = tabX + ti2 * (tabW + 8);

      ctx.fillStyle = act ? '#eafffb' : 'rgba(200,230,245,0.6)';

      ctx.strokeStyle = m.done ? 'rgba(110,245,230,0.6)' : 'rgba(255,255,255,0.12)';

      ctx.textAlign = 'left';

      var barY = ry + rowH - 26, barH = 8;
      ctx.fillStyle = 'rgba(120,200,220,0.16)';
      rr(barX, barY, barW, barH, 4); ctx.fill();
      var p = clamp(m.prog / m.def.target, 0, 1);
      ctx.fillStyle = m.done ? '#5fe6d6' : '#ffd45f';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(190,225,245,0.5)';
    ctx.font = '600 ' + clamp(pw * 0.026, 11, 13) + 'px ' + FONT;
    ctx.fillText('今日完成 ' + Missions.doneCount() + ' / ' + list.length + ' · 点击面板外区域关闭', px + pw / 2, py + ph - 22);
  }

  function drawSettings() {
    var P0 = drawPanelFrame('设置', '音量 · 震动 · 画质', 470, 440);
    var px = P0.px, py = P0.py, pw = P0.pw, ph = P0.ph;

    var rows = [['bgm', '背景音乐'], ['sfx', '音效'], ['vibe', '震动强度']];
    var compactSet = ph < 370; // 横屏短屏：压缩间距，保证存档按钮不与滑条重叠
    var rowGap = compactSet ? 34 : 58;
    var topY = py + (compactSet ? 84 : 118);
    var tx = px + 126, tw = pw - 126 - 92;
    for (var i = 0; i < rows.length; i++) {
      var key = rows[i][0], label = rows[i][1];
      var y = topY + i * rowGap;

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(225,245,255,0.92)';
      ctx.font = '700 ' + clamp(pw * (compactSet ? 0.028 : 0.032), 11, 16) + 'px ' + FONT;
      ctx.fillText(label, px + 30, y);

      rr(tx, y - 5, tw, 10, 5);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fill();
      var v = G.vol[key];
      if (v > 0.01) {
        rr(tx, y - 5, Math.max(8, tw * v), 10, 5);
        ctx.fillStyle = 'rgba(110,245,230,0.85)';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(tx + tw * v, y, 11, 0, TAU);
      ctx.fillStyle = '#eafffb';
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,220,205,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(170,230,240,0.78)';
      ctx.font = '700 ' + clamp(pw * 0.03, 11, 15) + 'px ' + FONT;
      ctx.fillText(Math.round(v * 100) + '%', px + pw - 30, y);

  // 成就墙内容
  function drawAchvBody(px, py, pw, ph) {
    var cols = 2, rows = 4, perPage = cols * rows;
    var gapX = 14, gapY = 10;
    var cw = (pw - 48 - gapX) / cols;
    var chh = (ph - 150 - gapY * (rows - 1)) / rows;
    var top = py + 96;
    var doneN = 0;
    var pages = Math.max(1, Math.ceil(ACHV.length / perPage));
    if (G.achvPage >= pages) G.achvPage = 0;
    if (G.achvPage < 0) G.achvPage = 0;
    var page = G.achvPage;

    for (var k = 0; k < ACHV.length; k++) if (achvUnlocked(ACHV[k])) doneN++;

    for (var pi2 = 0; pi2 < perPage; pi2++) {
      var i = page * perPage + pi2;
      if (i >= ACHV.length) break;
      var a = ACHV[i];
      var col = pi2 % cols, row = Math.floor(pi2 / cols);
      var cx2 = px + 24 + col * (cw + gapX);
      var cy = top + row * (chh + gapY);
      var unlocked = achvUnlocked(a);
      var cur = Math.min(a.val(Stats.d), a.target);

      rr(cx2, cy, cw, chh, 12);
      ctx.fillStyle = unlocked ? 'rgba(60,220,205,0.10)' : 'rgba(255,255,255,0.04)';
      ctx.fill();
      ctx.strokeStyle = unlocked ? 'rgba(110,245,230,0.55)' : 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 1.2;
      rr(cx2, cy, cw, chh, 12);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = unlocked ? '#b8fff5' : '#e8f6ff';
      ctx.font = '800 ' + clamp(cw * 0.075, 12, 15) + 'px ' + FONT;
      ctx.fillText(a.name, cx2 + 12, cy + 17);

      ctx.fillStyle = 'rgba(180,220,240,0.55)';
      ctx.font = '600 ' + clamp(cw * 0.06, 10, 12) + 'px ' + FONT;
      ctx.fillText(a.desc, cx2 + 12, cy + 34);

      // 进度
      var barW2 = cw - 24, barH2 = 6;
      var bx3 = cx2 + 12, by3 = cy + chh - 24;
      rr(bx3, by3, barW2, barH2, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fill();
      var p = clamp(cur / a.target, 0, 1);
      if (p > 0.01) {
        rr(bx3, by3, Math.max(4, barW2 * p), barH2, 3);
        ctx.fillStyle = unlocked ? '#5fe6d6' : 'rgba(120,200,230,0.75)';
        ctx.fill();
      }

      ctx.textAlign = 'right';
      ctx.fillStyle = unlocked ? 'rgba(255,215,120,0.95)' : 'rgba(180,220,240,0.5)';
      ctx.font = '700 ' + clamp(cw * 0.058, 9, 11) + 'px ' + FONT;
      var label = unlocked ? '已达成 +' + a.reward : (Math.floor(cur) + '/' + a.target);
      ctx.fillText(label, cx2 + cw - 12, cy + chh - 14);
    }

    // 翻页
    var pgY = py + ph - 34;
    G.ui.achPrev = { x: px + 24, y: pgY, w: 30, h: 24 };
    G.ui.achNext = { x: px + 100, y: pgY, w: 30, h: 24 };
    var pgBtns = [[G.ui.achPrev, '‹'], [G.ui.achNext, '›']];
    for (var pb = 0; pb < pgBtns.length; pb++) {
      var rr2 = pgBtns[pb][0];
      rr(rr2.x, rr2.y, rr2.w, rr2.h, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,220,240,0.3)';
      ctx.lineWidth = 1;
      rr(rr2.x, rr2.y, rr2.w, rr2.h, 8);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(210,240,250,0.8)';
      ctx.font = '800 ' + Math.round(rr2.h * 0.62) + 'px ' + FONT;
      ctx.fillText(pgBtns[pb][1], rr2.x + rr2.w / 2, rr2.y + rr2.h / 2 + 1);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(200,235,250,0.6)';
    ctx.font = '700 ' + clamp(pw * 0.026, 11, 13) + 'px ' + FONT;
    ctx.fillText((page + 1) + ' / ' + pages, px + 77, pgY + 12);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(190,225,245,0.5)';
    ctx.font = '600 ' + clamp(pw * 0.024, 10, 13) + 'px ' + FONT;
    ctx.fillText('已达成 ' + doneN + ' / ' + ACHV.length + ' · 点击面板外关闭', px + pw - 24, pgY + 12);
  }

  function fmtDist2(n) {

    if (m < 60) return m + ' 分钟';
